<script>
(() => {
"use strict";

/* ======================================

====================================== */

const $ = id => document.getElementById(id);

const canvas = $("canvas");
const ctx = canvas.getContext("2d");

ctx.imageSmoothingEnabled = false;

const W = 960;
const H = 540;
const GRAVITY = 1650;
const SAVE_KEY = "tdw-spirit-realm-save-v2";

const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const dist = (x,y,x2,y2) => Math.hypot(x-x2,y-y2);
const random = (a,b) => a+Math.random()*(b-a);

const difficulties = {
 easy:{
  hearts:9,
  damage:.6,
  bossHp:.7,
  speed:.78
 },
 medium:{
  hearts:6,
  damage:1,
  bossHp:1,
  speed:1
 },
 hard:{
  hearts:4,

  bossHp:1.3,
  speed:1.2
 },
 extreme:{
  hearts:3,
  damage:2,
  bossHp:1.65,
  speed:1.4
 }
};

let difficulty = "medium";
let chapter = 0;
let mode = "menu";
let time = 0;
let lastFrame = 0;
let camera = 0;
let worldEnd = 3900;
let levelEnding = false;

let platforms = [];

let checkpoints = [];
let enemies = [];

let particles = [];

let collected = 0;
let checkpointX = 65;
let checkpointY = 425;
let noticeTimer = 0;

let boss = null;
let bossStarted = false;
let bossDefeated = false;
let bossArenaX = 0;
let bossCutsceneSeen = false;

const keys = {};

const player = {
 x:65,y:415,
 w:26,h:42,
 vx:0,vy:0,
 facing:1,
 speed:315,
 grounded:false,
 jumps:0,
 dashReady:true,
 dashTimer:0,
 hp:6,maxHp:6,
 invincible:0,
 shield:0,
 shieldCooldown:0,
 slashCooldown:0,
 slashTimer:0,
 burstCooldown:0
};

/* ======================================
   STORY — EIGHT CHAPTERS
====================================== */

const chapters = [
 {

 },

 },
 {

 },
 {

  intro:[
   "PLAYER: These gaps are getting wider.",
   "UNKNOWN SPIRIT: Trust the power of your spirit.",
   "UNKNOWN SPIRIT: Dash through the air and cross the shattered path."
  ],
  outro:[
   "PLAYER: I can feel the realm responding to me.",

  ]
 },
 {
  name:"Echoes of the King",
  theme:"memories",
  intro:[
   "PLAYER: That's King Aldric... but it's only a memory.",
   "ECHO OF ALDRIC: The crystal promised me the strength to protect everyone.",
   "ECHO OF ALDRIC: I never understood what was trapped inside it.",
   "PLAYER: The Black Spirit came from this realm..."
  ],
  outro:[
   "PLAYER: Defeating Aldric wasn't the end.",
   "UNKNOWN SPIRIT: No. There are still souls waiting to be freed."
  ]
 },
 {

 },
 {

  intro:[

  ]
 },
 {
  name:"The Spirit Titan",
  theme:"titan",
  intro:[
   "NARRATOR: The hero enters the final region of the Spirit Realm.",
   "PLAYER: There's nowhere left to go but forward.",
   "UNKNOWN SPIRIT: The guardian is waiting at the end of the shattered path.",
   "UNKNOWN SPIRIT: What happens next will determine the realm's fate."
  ],
  outro:[]
 }
];

/* ======================================
   MUSIC — ORIGINAL 8-BIT SOUND
====================================== */

const Music = (() => {
 let audio = null;
 let master = null;
 let enabled = true;
 let volume = .35;
 let timer = null;
 let songIndex = -1;
 let step = 0;
 let nextTime = 0;

 const notes = {
  C:0,D:2,E:4,F:5,G:7,A:9,B:11
 };

 const songs = [
  {
   name:"Broken Portal",
   bpm:100,
   lead:["C5","G5","D#5","G5","A#5","G5","F5","R",
         "D#5","G5","C6","A#5","G5","F5","D#5","R"],
   bass:["C3","G2","G#2","A#2"]
  },
  {
   name:"Floating Echoes",
   bpm:112,
   lead:["F5","A#5","C6","A#5","F5","D#5","C5","R",
         "D5","F5","G5","A#5","G5","F5","D5","R"],
   bass:["F3","D#3","A#2","C3"]
  },
  {
   name:"Phantom Forest",
   bpm:103,
   lead:["D5","F5","A5","R","G5","F5","D5","R",
         "C5","D5","F5","A5","G5","E5","D5","R"],
   bass:["D3","A2","A#2","C3"]
  },
  {
   name:"Shattered Path",
   bpm:134,
   lead:["E5","G5","B5","G5","D6","B5","G5","R",
         "E5","F#5","G5","B5","A5","G5","F#5","R"],
   bass:["E3","C3","D3","B2"]
  },
  {
   name:"Echoes of the King",
   bpm:89,
   lead:["C5","E5","G5","C6","B5","G5","E5","R",
         "D#5","G5","A#5","G5","F#5","D#5","C5","R"],
   bass:["C3","G2","D#3","F#2"]
  },
  {
   name:"Prison of Souls",
   bpm:124,
   lead:["A4","C5","F5","A5","G5","F5","C5","R",
         "A4","D5","F5","G5","F5","D5","C5","R"],
   bass:["F2","C3","D#3","F2"]
  },
  {
   name:"Heart of the Realm",
   bpm:145,
   lead:["G5","A#5","D6","C6","A#5","G5","F5","R",
         "G5","A#5","C6","D6","F6","D6","C6","R"],
   bass:["G2","D3","D#3","F3"]
  },
  {
   name:"SPIRIT TITAN — THE FINAL STAND",
   bpm:165,
   lead:["C6","G5","D#5","G5","A#5","C6","D6","R",
         "D#6","D6","C6","A#5","G5","A#5","C6","R"],
   bass:["C3","G2","G#2","A#2"]
  }
 ];

 function freq(note){
  if(note==="R")return 0;
  const m=/^([A-G])(#?)(\d)$/.exec(note);
  if(!m)return 0;
  const midi=(Number(m[3])+1)*12+
   notes[m[1]]+(m[2]?1:0);
  return 440*Math.pow(2,(midi-69)/12);
 }

 function setup(){
  if(audio)return;
  const AC=window.AudioContext||
           window.webkitAudioContext;
  if(!AC)return;
  audio=new AC();
  master=audio.createGain();
  master.gain.value=volume*.45;
  master.connect(audio.destination);
 }

 function tone(note,at,len,bass=false){
  if(!enabled||!audio)return;
  const f=freq(note);
  if(!f)return;

  const osc=audio.createOscillator();
  const gain=audio.createGain();

  osc.type=bass?"triangle":"square";
  osc.frequency.value=f;

  const v=bass?.19:.09;

  gain.gain.setValueAtTime(.0001,at);
  gain.gain.linearRampToValueAtTime(v,at+.012);
  gain.gain.exponentialRampToValueAtTime(.0001,at+len);

  osc.connect(gain);
  gain.connect(master);

  osc.start(at);
  osc.stop(at+len+.02);
 }

 function tick(){
  if(!enabled||!audio||
     audio.state!=="running")return;

  const song=songs[chapter];

  if(songIndex!==chapter){
   songIndex=chapter;
   step=0;
   nextTime=audio.currentTime+.06;
   $("musicTitle").textContent="♫ "+song.name;
  }

  const unit=30/song.bpm;

  while(nextTime<audio.currentTime+.18){
   const i=step%16;

   tone(song.lead[i],nextTime,unit*.82);

   if(i%4===0){
    tone(song.bass[(i/4)%4],nextTime,unit*3.6,true);
   }

   if(chapter===7&&i%4===2){
    tone("C3",nextTime,unit*.16,true);
   }

   step++;
   nextTime+=unit;
  }
 }

 async function start(){
  setup();
  if(!audio)return;
  try{await audio.resume();}catch(e){}
  if(!timer)timer=setInterval(tick,55);
 }

 function toggle(){
  enabled=!enabled;
  $("musicToggle").textContent=
   enabled?"♫ MUSIC: ON":"♫ MUSIC: OFF";

  if(master&&audio){
   master.gain.setTargetAtTime(
    enabled?volume*.45:0,
    audio.currentTime,.03
   );
  }

  if(enabled){
   songIndex=-1;
   start();
  }
 }

 function setVolume(v){
  volume=Number(v)/100;
  if(master&&audio){
   master.gain.setTargetAtTime(
    enabled?volume*.45:0,
    audio.currentTime,.03
   );
  }
 }

 return{
  start,toggle,setVolume,
  reset:()=>{songIndex=-1}
 };
})();

$("musicToggle").onclick=()=>Music.toggle();
$("volume").oninput=e=>Music.setVolume(e.target.value);

/* ======================================
   SCREEN / CUTSCENE SYSTEM
====================================== */

let dialogue=[];
let dialogueIndex=0;
let dialogueDone=null;
let screenPrimary=null;
let screenSecondary=null;

function showScreen(label,title,text,
                    primaryText,primaryFn,
                    secondaryText,secondaryFn){
 $("overlay").style.display="flex";
 $("overlayLabel").textContent=label;
 $("overlayTitle").textContent=title;
 $("overlayText").textContent=text;

 $("primaryButton").textContent=primaryText;
 screenPrimary=primaryFn;

 if(secondaryText){
  $("secondaryButton").style.display="inline-block";
  $("secondaryButton").textContent=secondaryText;
  screenSecondary=secondaryFn;
 }else{
  $("secondaryButton").style.display="none";
  screenSecondary=null;
 }

 $("hud").style.display="none";
 $("bossHud").style.display="none";
}

$("primaryButton").onclick=()=>{
 if(screenPrimary)screenPrimary();
};

$("secondaryButton").onclick=()=>{
 if(screenSecondary)screenSecondary();
};

function hideScreen(){
 $("overlay").style.display="none";
 $("hud").style.display="block";

 if(bossStarted&&!bossDefeated){
  $("bossHud").style.display="block";
 }
}

function cutscene(lines,onFinish,title){
 mode="scene";
 dialogue=lines;
 dialogueIndex=0;
 dialogueDone=onFinish||null;

 function showLine(){
  const line=dialogue[dialogueIndex];
  const isLast=dialogueIndex===dialogue.length-1;

  showScreen(
   "STORY CUTSCENE",
   title||chapters[chapter].name,
   line,
   isLast?"CONTINUE ADVENTURE":"NEXT →",
   ()=>{
    dialogueIndex++;

    if(dialogueIndex<dialogue.length){
     showLine();
    }else{
     hideScreen();
     mode="playing";

     const done=dialogueDone;
     dialogueDone=null;
     if(done)done();
    }
   }
  );
 }

 showLine();
}

/* ======================================
   NOTIFICATIONS
====================================== */

function notify(text,duration=1.7){
 $("notice").textContent=text;
 $("notice").style.display="block";
 noticeTimer=duration;
}

function updateHUD(){
 $("hudTitle").textContent=
  "CHAPTER "+(chapter+1)+
  " — "+chapters[chapter].name;

 $("hudObjective").textContent=
  bossStarted&&!bossDefeated
  ?"DEFEAT THE SPIRIT TITAN"
  :collected<3
   ?"SOUL FRAGMENTS: "+collected+"/3"
   :"FIND THE EXIT →";

 $("hudStats").textContent=
  "♥ "+Math.ceil(player.hp)+"/"+player.maxHp+
  "  ✦ DASH "+(player.dashReady?"READY":"USED")+
  "  🛡 "+(player.shieldCooldown<=0?"READY":"RECHARGING");
}

/* ======================================
   SAVE / LEVEL SETUP
====================================== */

function savedChapter(){
 try{
  return clamp(
   Number(localStorage.getItem(SAVE_KEY)||0),
   0,7
  );
 }catch(e){
  return 0;
 }
}

function saveChapter(n){
 try{
  const old=Number(localStorage.getItem(SAVE_KEY)||0);
  localStorage.setItem(
   SAVE_KEY,
   String(Math.max(old,n))
  );
 }catch(e){}
}

function addPlatform(x,y,w,type="solid",phase=0){
 platforms.push({
  x,y,w,h:24,type,
  baseY:y,phase
 });
}

function createLevel(n){
 chapter=n;
 mode="playing";
 time=0;
 camera=0;
 levelEnding=false;
 collected=0;
 boss=null;
 bossStarted=false;
 bossDefeated=false;
 bossCutsceneSeen=false;

 platforms=[];
 shards=[];
 checkpoints=[];
 enemies=[];
 hazards=[];
 particles=[];
 projectiles=[];

 const diff=difficulties[difficulty];

 player.maxHp=diff.hearts;
 player.hp=player.maxHp;
 player.x=65;
 player.y=425;
 player.vx=0;
 player.vy=0;
 player.grounded=false;
 player.jumps=0;
 player.dashReady=true;
 player.dashTimer=0;
 player.invincible=1;
 player.shield=0;
 player.shieldCooldown=0;
 player.slashCooldown=0;
 player.burstCooldown=0;
 player.slashTimer=0;

 checkpointX=65;
 checkpointY=425;

 addPlatform(0,470,345);

 const count=n===7?12:15;
 const heights=[416,365,400,342,380,329,376,350];

 for(let i=0;i<count;i++){
  const x=300+i*231;
  const y=heights[(i+n)%heights.length];

  let type="solid";

  if(n>=1&&i%5===2)type="moving";
  if(n>=2&&i%5===4)type="vanish";
  if(n>=3&&i%7===5)type="bounce";

  if(i===6||i===count-1)type="solid";

  addPlatform(x,y,195,type,i*.8);

  if([2,7,10].includes(i)){
   shards.push({
    x:x+85,
    y:y-54,
    taken:false,
    phase:i
   });
  }

  if(i===6){
   checkpoints.push({
    x:x+85,y:y,
    active:false
   });
  }

  if(n>=1&&i%4===3){
   const hp=Math.round((55+n*10)*diff.bossHp);

   enemies.push({
    x:x+100,y:y-78,
    baseX:x+100,
    baseY:y-78,

    phase:i,

   });

  if(n>=3&&i%6===1){
   hazards.push({
    x:x+140,y:y-90,
    phase:i
   });

 }

 const last=platforms[platforms.length-1];
 worldEnd=last.x+last.w+170;

 /* SPECIAL CHAPTER 8 BATTLEFIELD */

 if(n===7){

 }

 Music.reset();

}

/* ======================================
   PLAYER MOVEMENT
====================================== */

function platformY(p){
 if(p.type==="moving"){
  return p.baseY+Math.sin(time*1.75+p.phase)*44;
 }
 return p.baseY;
}

function platformVisible(p){
 if(p.type!=="vanish")return true;
 return Math.sin(time*2.1+p.phase)>-.4;
}

function jump(){
 if(mode!=="playing")return;
 if(player.jumps>=2)return;

 player.vy=player.jumps===0?-675:-620;
 player.jumps++;
 player.grounded=false;

 burst(player.x,player.y+18,"#a5f3ff",13);

 if(player.jumps===2){
  notify("DOUBLE JUMP",.5);
 }
}

function dash(){
 if(mode!=="playing"||!player.dashReady)return;

 player.dashTimer=.21;
 player.dashReady=false;
 player.vy=0;

 burst(player.x,player.y,"#ab97ff",23);
}

function movePlayer(dt){
 player.invincible=Math.max(0,player.invincible-dt);
 player.slashCooldown=Math.max(0,player.slashCooldown-dt);
 player.burstCooldown=Math.max(0,player.burstCooldown-dt);
 player.shieldCooldown=Math.max(0,player.shieldCooldown-dt);
 player.shield=Math.max(0,player.shield-dt);
 player.slashTimer=Math.max(0,player.slashTimer-dt);

 let movement=0;
 if(keys.a||keys.arrowleft)movement--;
 if(keys.d||keys.arrowright)movement++;

 if(movement!==0){
  player.facing=movement>0?1:-1;
 }

 if(player.dashTimer>0){
  player.dashTimer-=dt;
  player.vx=player.facing*760;
  player.vy=0;
 }else{
  player.vx=movement*player.speed;
  player.vy+=GRAVITY*dt;
 }

 const oldBottom=player.y+player.h/2;

 player.x+=player.vx*dt;
 player.y+=player.vy*dt;

 player.x=clamp(player.x,14,worldEnd-15);
 player.grounded=false;

 const bottom=player.y+player.h/2;

 for(const p of platforms){
  if(!platformVisible(p))continue;

  const top=platformY(p);

  if(
   player.vy>=0 &&
   oldBottom<=top+14 &&
   bottom>=top &&
   player.x+player.w/2>p.x &&
   player.x-player.w/2<p.x+p.w
  ){
   player.y=top-player.h/2;
   player.vy=0;
   player.grounded=true;
   player.jumps=0;
   player.dashReady=true;

   if(p.type==="bounce"){
    player.vy=-940;
    player.grounded=false;
    player.jumps=1;
    burst(player.x,top,"#7ef0ff",18);
   }
   break;
  }
 }

 if(player.y>H+125){
  respawn();
 }

 // Soul fragments.
 for(const s of shards){
  if(s.taken)continue;

  if(dist(player.x,player.y,s.x,s.y)<34){
   s.taken=true;
   collected++;

   burst(s.x,s.y,"#d7f7ff",25);
   notify("SOUL FRAGMENT "+collected+"/3");
  }
 }

 // Checkpoints.
 for(const c of checkpoints){
  if(
   !c.active &&
   Math.abs(player.x-c.x)<45 &&
   Math.abs(player.y-(c.y-30))<85
  ){
   c.active=true;

   checkpointX=c.x;
   checkpointY=c.y-45;

   notify(
    c.arena
    ?"BOSS CHECKPOINT ACTIVATED!"
    :"CHECKPOINT ACTIVATED"
   );

   burst(c.x,c.y-38,"#8cfbe8",23);
  }
 }

 // Normal chapter exit.
 if(chapter<7){
  if(player.x>worldEnd-215){
   if(collected>=3){
    completeChapter();
   }else if(noticeTimer<=0){
    notify("FIND ALL THREE SOUL FRAGMENTS");
   }
  }
 }

 // Chapter 8 entrance to the arena.
 if(
  chapter===7 &&
  boss &&
  !bossCutsceneSeen &&
  player.x>bossArenaX+155
 ){
  if(collected<3){
   player.x=bossArenaX+130;
   if(noticeTimer<=0){
    notify("COLLECT ALL THREE FRAGMENTS FIRST");
   }
  }else{
   beginBossCutscene();
  }
 }

 // Arena doors close once the battle begins.
 if(chapter===7&&bossStarted&&!bossDefeated){
  player.x=clamp(
   player.x,
   bossArenaX+130,
   bossArenaX+1110
  );
 }
}

/* ======================================
   CHECKPOINT / DAMAGE
====================================== */

function respawn(){
 player.hp-=1;

 if(player.hp<=0){
  player.hp=player.maxHp;
  notify("SPIRIT RESTORED — TRY AGAIN",2);
 }else{
  notify("RETURNED TO CHECKPOINT",1.4);
 }

 player.x=checkpointX;
 player.y=checkpointY;
 player.vx=0;
 player.vy=0;
 player.jumps=0;
 player.dashReady=true;
 player.dashTimer=0;
 player.invincible=2;

 projectiles=[];

 if(bossStarted&&!bossDefeated&&boss){
  resetBossBattle();
 }
}

function damagePlayer(amount){
 if(
  player.invincible>0 ||
  player.shield>0 ||
  mode!=="playing"
 )return;

 player.hp-=amount;
 player.invincible=.9;

 burst(player.x,player.y,"#ff77a7",15);

 if(player.hp<=0){
  player.hp=1;
  respawn();
 }
}

function soulBlade(){
 if(mode!=="playing"||player.slashCooldown>0)return;

 player.slashCooldown=.29;

 burst(
  player.x+player.facing*35,
  player.y,

 );

 for(const e of enemies){

 if(boss&&bossStarted&&!boss.dead){

   (boss.x-player.x)*player.facing>-35

  }
 }
}

function spiritBurst(){
 if(mode!=="playing"||player.burstCooldown>0)return;

 player.burstCooldown=.95;

 projectiles.push({

  y:player.y-6,

  vy:0,
  radius:14,
  damage:85,
  friendly:true,

 });

 burst(player.x,player.y,"#81edff",18);
}

function phantomShield(){
 if(mode!=="playing"||player.shieldCooldown>0)return;

 player.shield=2.1;
 player.shieldCooldown=5.5;

 burst(player.x,player.y,"#d4c7ff",20);
}

function hurtEnemy(e,damage){
 e.hp-=damage;

 burst(e.x,e.y,"#dfadff",10);

 if(e.hp<=0&&!e.dead){
  e.dead=true;
  burst(e.x,e.y,"#ae80ff",25);
 }
}

function hurtBoss(damage){
 if(!boss||!bossStarted||boss.dead)return;

 boss.hp=Math.max(0,boss.hp-damage);
 boss.flash=.16;

 burst(boss.x,boss.y,"#b9ecff",12);

 if(boss.hp<=0){
  defeatBoss();
 }
}

/* ======================================
   BOSS ATTACKS
====================================== */

function bossPhase(){
 const ratio=boss.hp/boss.maxHp;

 if(ratio<=.33)return 3;
 if(ratio<=.66)return 2;
 return 1;
}

function selectBossAttack(){
 const options=[
  "slash",
  "orbs",
  "slam"
 ];

 if(boss.phase>=2){
  options.push("teleport","flames");
 }

 if(boss.phase===3){
  options.push("slash","slam","teleport");
 }

 // Avoid repeating one attack continuously.
 const type=options[
  boss.attackCount%options.length
 ];

 boss.attackCount++;
 return type;
}

function beginAttack(type){
 boss.action="warning";
 boss.attackType=type;
 boss.warningTime=
  boss.phase===1?.8:
  boss.phase===2?.65:.48;

 boss.targetX=player.x;

 if(type==="slash"){
  notify("TITAN: SPECTRAL SLASH!",.8);
 }
 if(type==="slam"){
  notify("TITAN: GROUND SLAM! JUMP!",.8);
 }
 if(type==="orbs"){
  notify("TITAN: SPIRIT ORBS!",.8);
 }
 if(type==="teleport"){
  notify("TITAN: PHANTOM TELEPORT!",.8);
 }
 if(type==="flames"){
  notify("TITAN: SOULFIRE ERUPTION!",.8);
 }
}

function executeAttack(){
 boss.action="recover";
 boss.actionTime=
  boss.phase===3?.65:
  boss.phase===2?.85:1.1;

 const diff=difficulties[difficulty];
 const attack=boss.attackType;

 if(attack==="slash"){
  // The titan rushes into sword range.
  const direction=player.x<boss.x?-1:1;

  boss.x=clamp(
   player.x-direction*125,
   bossArenaX+310,
   bossArenaX+1010
  );

  boss.slashDirection=direction;
  boss.slashTimer=.37;

  // A wide slash zone.
  hazards.push({
   kind:"slash",
   x:boss.x+direction*75,
   y:boss.y+30,
   w:190,
   h:165,
   life:.35,
   phase:0,
   damage:diff.damage
  });

  burst(boss.x,boss.y,"#b3e9ff",35);
 }

 if(attack==="orbs"){
  const number=
   boss.phase===1?3:
   boss.phase===2?5:7;

  for(let i=0;i<number;i++){
   const angle=
    Math.atan2(
     player.y-boss.y,
     player.x-boss.x
    )+
    (i-(number-1)/2)*.15;

   const speed=(230+boss.phase*50)*diff.speed;

   projectiles.push({
    x:boss.x,
    y:boss.y-20,
    vx:Math.cos(angle)*speed,
    vy:Math.sin(angle)*speed,
    radius:12,
    damage:diff.damage,
    friendly:false,
    life:4,
    type:"orb"
   });
  }
 }

 if(attack==="slam"){
  // Move close to ground and release shockwaves.
  boss.y=338;

  boss.shockwaves.push({
   x:boss.x,
   vx:-380*diff.speed,
   life:2.3,
   radius:24
  });

  boss.shockwaves.push({
   x:boss.x,
   vx:380*diff.speed,
   life:2.3,
   radius:24
  });

  burst(boss.x,465,"#a2dfff",45);
 }

 if(attack==="teleport"){
  burst(boss.x,boss.y,"#c2a0ff",35);

  const side=player.facing===1?-1:1;

  boss.x=clamp(
   player.x+side*135,
   bossArenaX+310,
   bossArenaX+1010
  );

  burst(boss.x,boss.y,"#c2a0ff",40);

  // Short-delay melee strike.
  hazards.push({
   kind:"teleSlash",
   x:boss.x,
   y:boss.y,
   w:150,
   h:175,
   life:.6,
   phase:0,
   damage:diff.damage
  });
 }

 if(attack==="flames"){
  // Flames appear at the marked locations.
  // The attack is dodgeable because markers
  // were displayed during the warning.
  const positions=[
   boss.targetX-150,
   boss.targetX,
   boss.targetX+150
  ];

  for(const x of positions){
   boss.flames.push({
    x:clamp(
     x,
     bossArenaX+180,
     bossArenaX+1080
    ),
    life:1.15,
    damage:diff.damage
   });
  }
 }
}

/* ======================================
   BOSS AI / THREE PHASES
====================================== */

function updateBoss(dt){
 if(!boss||boss.dead||!bossStarted)return;

 const diff=difficulties[difficulty];

 boss.flash=Math.max(0,boss.flash-dt);

 const newPhase=bossPhase();

 if(newPhase!==boss.phase){
  boss.phase=newPhase;

  notify(
   newPhase===2
   ?"PHASE 2 — THE BROKEN GUARDIAN!"
   :"PHASE 3 — SPIRIT'S WRATH!",
   2.5
  );

  burst(boss.x,boss.y,"#d7baff",80);

  boss.action="recover";
  boss.actionTime=1.2;
 }

 $("bossPhase").textContent=
  "PHASE "+boss.phase+" OF 3";

 $("bossFill").style.width=
  (boss.hp/boss.maxHp*100)+"%";

 if(boss.action==="idle"){
  boss.y=293+Math.sin(time*2)*17;
  boss.attackTimer-=dt;

  if(boss.attackTimer<=0){
   beginAttack(selectBossAttack());
  }
 }

 if(boss.action==="warning"){
  boss.warningTime-=dt;

  if(boss.warningTime<=0){
   executeAttack();
  }
 }

 if(boss.action==="recover"){
  boss.actionTime-=dt;

  if(boss.actionTime<=0){
   boss.action="idle";
   boss.attackTimer=
    (boss.phase===1?.8:
     boss.phase===2?.5:.28)/diff.speed;
  }
 }

 // Contact damage, except during warning scenes.
 if(
  dist(player.x,player.y,boss.x,boss.y)<91
 ){
  damagePlayer(diff.damage);
 }

 // Shockwaves travel across the floor.
 for(let i=boss.shockwaves.length-1;i>=0;i--){
  const s=boss.shockwaves[i];

  s.x+=s.vx*dt;
  s.life-=dt;

  if(
   Math.abs(player.x-s.x)<30 &&
   player.y+player.h/2>435
  ){
   damagePlayer(diff.damage);
  }

  if(s.life<=0){
   boss.shockwaves.splice(i,1);
  }
 }

 // Soulfire pillars.
 for(let i=boss.flames.length-1;i>=0;i--){
  const f=boss.flames[i];

  f.life-=dt;

  if(
   Math.abs(player.x-f.x)<42 &&
   player.y+player.h/2>270
  ){
   damagePlayer(f.damage);
  }

  if(f.life<=0){
   boss.flames.splice(i,1);
  }
 }
}

/* ======================================
   ENEMY AND HAZARD UPDATES
====================================== */

function updateEnemies(dt){
 const diff=difficulties[difficulty];

 for(const e of enemies){
  if(e.dead)continue;

  e.phase+=dt;
  e.x=e.baseX+Math.sin(e.phase*1.2)*40;
  e.y=e.baseY+Math.sin(e.phase*2)*20;
  e.cooldown=Math.max(0,e.cooldown-dt);

  if(
   dist(player.x,player.y,e.x,e.y)<46 &&
   e.cooldown<=0
  ){
   damagePlayer(diff.damage);
   e.cooldown=1;
  }
 }

 for(let i=hazards.length-1;i>=0;i--){
  const h=hazards[i];

  if(h.kind==="slash"||h.kind==="teleSlash"){
   h.life-=dt;

   if(
    Math.abs(player.x-h.x)<h.w/2 &&
    Math.abs(player.y-h.y)<h.h/2
   ){
    damagePlayer(h.damage);
   }

   if(h.life<=0)hazards.splice(i,1);
   continue;
  }

  const hy=h.y+Math.sin(time*2+h.phase)*30;

  if(dist(player.x,player.y,h.x,hy)<37){
   damagePlayer(diff.damage);
  }
 }
}

/* ======================================
   PROJECTILES
====================================== */

function updateProjectiles(dt){
 for(let i=projectiles.length-1;i>=0;i--){
  const p=projectiles[i];

  p.x+=p.vx*dt;
  p.y+=p.vy*dt;
  p.life-=dt;

  let hit=false;

  if(p.friendly){
   for(const e of enemies){
    if(
     !e.dead &&
     dist(p.x,p.y,e.x,e.y)<p.radius+23
    ){
     hurtEnemy(e,p.damage);
     hit=true;
     break;
    }
   }

   if(
    !hit &&
    boss &&
    bossStarted &&
    !boss.dead &&
    dist(p.x,p.y,boss.x,boss.y)<p.radius+90
   ){
    hurtBoss(p.damage);
    hit=true;
   }
  }else{
   if(
    dist(p.x,p.y,player.x,player.y)<p.radius+22
   ){
    damagePlayer(p.damage);
    hit=true;
   }
  }

  if(hit||p.life<=0){
   projectiles.splice(i,1);
  }

  if(mode!=="playing")break;
 }
}

/* ======================================
   PARTICLES
====================================== */

function burst(x,y,color,count){
 for(let i=0;i<count;i++){
  const angle=random(0,Math.PI*2);

  particles.push({
   x,y,
   vx:Math.cos(angle)*random(40,240),
   vy:Math.sin(angle)*random(40,240),
   life:random(.25,.8),
   color
  });
 }
}

function updateParticles(dt){
 for(let i=particles.length-1;i>=0;i--){
  const p=particles[i];

  p.x+=p.vx*dt;
  p.y+=p.vy*dt;
  p.life-=dt;

  if(p.life<=0)particles.splice(i,1);
 }
}

/* ======================================
   GAME UPDATE
====================================== */

function update(dt){
 time+=dt;
 updateParticles(dt);

 if(noticeTimer>0){
  noticeTimer-=dt;
  if(noticeTimer<=0){
   $("notice").style.display="none";
  }
 }

 if(mode!=="playing")return;

 movePlayer(dt);

 if(mode!=="playing")return;

 updateEnemies(dt);
 updateBoss(dt);
 updateProjectiles(dt);

 const target=clamp(
  player.x-335,
  0,
  Math.max(0,worldEnd-W)
 );

 camera+=(target-camera)*Math.min(1,dt*6);

 updateHUD();
}

/* ======================================
   MAIN GAME LOOP
====================================== */

function loop(timestamp){
 const dt=Math.min(
  (timestamp-(lastFrame||timestamp))/1000,
  .04
 );

 lastFrame=timestamp;

 update(dt);
 draw();

 requestAnimationFrame(loop);
}

/* ======================================
   CONTROLS
====================================== */

window.addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();

 if(
  [" ","arrowup","arrowdown",
   "arrowleft","arrowright"].includes(k)
 ){
  e.preventDefault();
 }

 keys[k]=true;

 if(e.repeat)return;

 if(mode!=="playing")return;

 if(k===" "||k==="w"||k==="arrowup")jump();
 if(k==="shift")dash();
 if(k==="j")soulBlade();
 if(k==="k")spiritBurst();
 if(k==="n")phantomShield();
});

window.addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
});

window.addEventListener("blur",()=>{
 for(const k in keys)keys[k]=false;
});

$("slash").onclick=soulBlade;

 $("fullscreen").textContent=
  document.fullscreenElement
  ?"⛶ EXIT FULLSCREEN"
  :"⛶ FULLSCREEN";
});

$("menuButton").onclick=()=>showMenu();

/* ======================================
   MAIN MENU
====================================== */

function showMenu(){
 mode="menu";

 const progress=savedChapter();

 showScreen(
  "THEDARKWITHIN — DLC II",
  "THE SPIRIT REALM",
  "A shattered dimension waits beyond the darkness.\n\n"+
  "Leap between floating islands, collect lost souls, "+
  "master spirit powers, and battle the Spirit Titan.\n\n"+
  "EIGHT CHAPTERS • PARKOUR • BOSS FIGHT • CUTSCENES",
  progress>0
   ?"CONTINUE — CHAPTER "+(progress+1)
   :"BEGIN STORY",
  ()=>{
   Music.start();
   startChapter(progress);
  },
  "NEW GAME",
  ()=>{
   if(!confirm(
    "Start again from Chapter 1? This resets saved chapter progress."
   ))return;

   try{
    localStorage.removeItem(SAVE_KEY);
   }catch(e){}

   Music.start();
   startChapter(0);
  }
 );
}

/* ======================================
   START THE GAME
====================================== */

createLevel(0);
showMenu();
requestAnimationFrame(loop);

})();
</script>

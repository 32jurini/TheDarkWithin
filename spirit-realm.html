
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Spirit Realm — 2.5D Edition</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#2d2458,#090819 75%);color:#f3eeff;font:15px Arial,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;padding:17px 5%;background:#110d25e8;border-bottom:1px solid #a18cf0}
header h1{margin:0;font-size:clamp(22px,4vw,35px);color:#e0d1ff}
a{color:#cbb6ff;text-decoration:none}
main{max-width:1160px;margin:22px auto;padding:0 12px}
.bar{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;align-items:center;margin:12px 0;padding:12px;background:#18132dd9;border:1px solid #584b8b;border-radius:12px}
button,select{background:linear-gradient(#5b4c91,#2d2453);border:1px solid #a393ee;color:#fff;border-radius:8px;padding:11px 14px;cursor:pointer;font-weight:bold}
button:hover{background:#7566b0}
button:disabled{opacity:.4;cursor:default}
#game{position:relative;border:2px solid #ad98ff;border-radius:13px;overflow:hidden;background:#0c0a20;box-shadow:0 28px 80px #000b,0 0 50px #7c62df33}
canvas{display:block;width:100%;height:auto;image-rendering:auto}
#hud,#bossHud{position:absolute;top:12px;background:#0e0b20dd;border:1px solid #ac95ed;border-radius:10px;padding:11px;font-size:12px;z-index:4;pointer-events:none;backdrop-filter:blur(6px)}
#hud{left:12px;display:none;max-width:56%}
#bossHud{right:12px;display:none;text-align:center;width:35%}
#hpBack,#bossBack{margin-top:7px;height:12px;border-radius:10px;overflow:hidden;background:#35284b}
#hpFill{height:100%;background:linear-gradient(90deg,#fc80a2,#ffcfad);width:100%}
#bossFill{height:100%;background:linear-gradient(90deg,#8058f8,#ee9eff);width:100%}
#overlay{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px;background:radial-gradient(ellipse,#40316beF,#09071bee 77%);backdrop-filter:blur(7px)}
#tag{color:#d3b8ff;letter-spacing:3px;font-size:11px}
#title{font:700 clamp(30px,5vw,60px) Georgia,serif;color:#f2dfff;margin:15px 0;text-shadow:0 0 35px #ba8bff77}
#story{white-space:pre-line;max-width:700px;line-height:1.7;font-size:clamp(14px,2vw,19px)}
#actions{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:12px}
#notice{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:#130e28ed;border:1px solid #cdb4ff;padding:11px;border-radius:8px;z-index:6;display:none;text-align:center;pointer-events:none}
.help{text-align:center;font-size:12px;color:#bab0dc;line-height:2}
#game:fullscreen{width:100vw;height:100vh;border:0;display:flex;align-items:center;background:#080615}
#game:fullscreen canvas{height:100%;object-fit:contain}
footer{text-align:center;color:#8277a1;padding:30px;font-size:12px}
@media(max-width:650px){button{padding:9px;font-size:11px}#hud,#bossHud{font-size:9px;padding:7px}}
</style>
</head>
<body>

<header>
<h1>✦ THE SPIRIT REALM</h1>
<a href="index.html">← BACK TO LAUNCHER</a>
</header>

<main>
<div class="bar">
<label>DIFFICULTY
<select id="difficulty">
<option value="easy">Easy</option>
<option value="medium" selected>Medium</option>
<option value="hard">Hard</option>
<option value="extreme">Extreme</option>
</select></label>
<button id="fullscreen">⛶ FULLSCREEN</button>

</div>

<div id="game">

<div id="hud">
<strong id="chapterLabel"></strong>
<div id="objective"></div>
<div id="health"></div>
<div id="hpBack"><div id="hpFill"></div></div>
</div>

<div id="bossHud">
<strong>THE SPIRIT TITAN</strong>
<div id="phase"></div>
<div id="bossBack"><div id="bossFill"></div></div>
</div>

<div id="notice"></div>

<div id="overlay">
<div id="tag">THEDARKWITHIN — DLC II</div>

<button id="primary">BEGIN STORY</button>

</div>
</div>
</div>

<div class="bar">
<button id="jump">SPACE — DOUBLE JUMP</button>
<button id="attack">J — SPIRIT SLASH</button>
<button id="blast">K — SOUL BLAST</button>
<button id="dash">SHIFT — SPIRIT DASH</button>

</div>

<div class="bar">

<label>VOLUME
<input id="volume" type="range" min="0" max="100" value="35">
</label>
</div>

<p class="help">
A / D OR ARROWS — MOVE • SPACE — DOUBLE JUMP •
J — SPIRIT SLASH • K — SOUL BLAST •
SHIFT — DASH • F — PULSE • N — SHIELD
</p>
</main>

<footer>THEDARKWITHIN © 2026 — THE SPIRIT REALM 2.5D EDITION</footer>

<script>
(()=>{
"use strict";

const $=id=>document.getElementById(id);
const canvas=$("canvas");
const ctx=canvas.getContext("2d");
const W=960,H=540;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const distance=(x,y,a,b)=>Math.hypot(x-a,y-b);
const SAVE="tdw-spirit-realm-save-v2";
const keys={};

const difficulties={
 easy:{hp:9,damage:.55,boss:.75,speed:.8},
 medium:{hp:6,damage:1,boss:1,speed:1},
 hard:{hp:4,damage:1.5,boss:1.35,speed:1.2},
 extreme:{hp:3,damage:2,boss:1.7,speed:1.45}
};

const chapters=[
{
 name:"Beyond the Veil",
 lines:[
 "NARRATOR: The hero awakens in a world between life and death.",
 "HERO: Where am I? The sky is filled with shattered islands.",
 "SPIRIT: Welcome to the Spirit Realm. Our souls are disappearing.",
 "HERO: Then I'll help you find them."
 ],
 ending:"The first lost souls return to their home."
},
{
 name:"The Floating Gardens",
 lines:[
 "HERO: These gardens are growing in the sky.",
 "SPIRIT: They were once bridges between the realms.",
 "SPIRIT: Darkness has broken the paths. Follow the light."
 ],
 ending:"The hero crosses the gardens and enters the ancient ruins."
},
{
 name:"Echoes of the Lost",
 lines:[
 "NARRATOR: Voices whisper from ruined temples.",
 "LOST SOUL: Please... don't leave us here.",
 "HERO: I promise you won't be forgotten."
 ],
 ending:"The whispers fade as the imprisoned souls find peace."
},
{
 name:"The Shattered Passage",
 lines:[
 "SPIRIT: Beyond this passage lies the heart of our realm.",
 "HERO: The islands are drifting farther apart.",
 "SPIRIT: Trust your Spirit Dash and double jump."
 ],
 ending:"The shattered passage opens a path toward the spirit citadel."
},
{
 name:"The Forgotten Souls",
 lines:[
 "NARRATOR: A storm of memories surrounds the floating ruins.",
 "HERO: I can see what happened here.",
 "SPIRIT: The Titan once protected these souls."
 ],
 ending:"A memory reveals the Titan's corruption."
},
{
 name:"The Crystal Sky",
 lines:[
 "HERO: These crystals feel alive.",
 "SPIRIT: Each one contains a memory of a lost soul.",
 "HERO: Then we need to bring them together."
 ],
 ending:"The reunited souls illuminate the sky."
},
{
 name:"The Titan's Gate",
 lines:[
 "SPIRIT: The Spirit Titan is waiting beyond that gate.",
 "HERO: I thought the Titan was supposed to protect this world.",
 "SPIRIT: It did... until darkness entered its heart."
 ],
 ending:"The Titan's gate opens beneath an enormous spectral moon."
},
{
 name:"The Spirit Titan",
 lines:[
 "NARRATOR: The hero enters the heart of the Spirit Realm.",
 "HERO: I can feel the Titan watching us.",
 "SPIRIT: Collect the final souls before approaching its throne."
 ],
 ending:""
}
];

const themeColors=[
 ["#6151ad","#171e56","#7ebef9"],
 ["#417fa6","#1b355b","#90d8e9"],
 ["#7951a3","#26204f","#c0a2ff"],
 ["#505da6","#17204d","#a3aaff"],
 ["#895b9e","#30204e","#ffb4db"],
 ["#547cb1","#1a2e56","#d6baff"],
 ["#594683","#15183d","#a89bff"],
 ["#321b62","#0a092a","#e1a7ff"]
];

let mode="menu",chapter=0,difficulty="medium";
let time=0,lastFrame=0,camera=0,worldEnd=0;
let collected=0,checkpointX=75,checkpointY=390;
let platforms=[],souls=[],enemies=[],shots=[],particles=[],checkpoints=[];
let titan=null,bossActive=false,bossEntered=false;
let noticeTimer=0,finished=false;
let primaryAction=null,secondaryAction=null;

const hero={
 x:75,y:390,w:27,h:43,vx:0,vy:0,dir:1,
 hp:6,maxHp:6,jumps:0,ground:false,
 dashReady:true,dash:0,inv:0,
 slash:0,slashCd:0,blastCd:0,
 pulseCd:0,shield:0,shieldCd:0
};

/* MUSIC */

const Music=(()=>{
 let audio,master,timer;
 let enabled=true,volume=.35;
 let cursor=0,next=0,previous=-1;

 const melodies=[
  [60,63,67,70],
  [62,65,69,72],
  [65,68,72,75],
  [63,67,70,74],
  [60,65,68,72],
  [67,70,74,77],
  [62,66,69,74],
  [60,63,67,75]
 ];

 function tone(note,when,length,bass=false){
  if(!audio||!enabled)return;
  const osc=audio.createOscillator();
  const gain=audio.createGain();

  osc.type=bass?"triangle":"sine";
  osc.frequency.value=440*Math.pow(2,(note-69)/12);

  gain.gain.setValueAtTime(.0001,when);
  gain.gain.linearRampToValueAtTime(bass?.12:.08,when+.025);
  gain.gain.exponentialRampToValueAtTime(.0001,when+length);

  osc.connect(gain);
  gain.connect(master);
  osc.start(when);
  osc.stop(when+length+.02);
 }

 function tick(){
  if(!audio||audio.state!=="running"||!enabled)return;

  if(previous!==chapter){
   previous=chapter;
   cursor=0;
   next=audio.currentTime+.05;
  }

  const notes=melodies[chapter];
  const beat=30/(105+chapter*5);

  while(next<audio.currentTime+.15){
   const index=cursor%16;
   const pattern=[0,2,1,3,2,1,0,3,1,2,0,3,2,1,3,0];

   tone(notes[pattern[index]],next,beat*.85);

   if(index%4===0){
    tone(notes[index/4]-24,next,beat*3.5,true);
   }

   cursor++;
   next+=beat;
  }
 }

 async function start(){
  try{
   if(!audio){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    audio=new AC();
    master=audio.createGain();
    master.gain.value=volume*.45;
    master.connect(audio.destination);
   }
   await audio.resume();
   if(!timer)timer=setInterval(tick,55);
  }catch(e){}
 }

 function toggle(){
  enabled=!enabled;
  $("music").textContent=enabled?"♫ MUSIC: ON":"♫ MUSIC: OFF";
  if(master&&audio)master.gain.setTargetAtTime(enabled?volume*.45:0,audio.currentTime,.03);
  if(enabled)start();
 }

 function setVolume(v){
  volume=Number(v)/100;
  if(master&&audio)master.gain.setTargetAtTime(enabled?volume*.45:0,audio.currentTime,.03);
 }

 return{start,toggle,setVolume,reset:()=>previous=-1};
})();

$("music").onclick=Music.toggle;
$("volume").oninput=e=>Music.setVolume(e.target.value);

/* SCREENS */

function screen(tag,title,text,button,action,other,otherAction){
 mode="scene";
 $("overlay").style.display="flex";
 $("tag").textContent=tag;
 $("title").textContent=title;
 $("story").textContent=text;
 $("primary").textContent=button;
 $("secondary").style.display=other?"inline-block":"none";
 $("secondary").textContent=other||"";
 primaryAction=action;
 secondaryAction=otherAction||null;
 $("hud").style.display="none";
 $("bossHud").style.display="none";
}

$("primary").onclick=()=>primaryAction&&primaryAction();
$("secondary").onclick=()=>secondaryAction&&secondaryAction();

function resume(){
 mode="playing";
 $("overlay").style.display="none";
 $("hud").style.display="block";
 $("bossHud").style.display=bossActive?"block":"none";
}

function cutscene(lines,done,title){
 let index=0;
 const advance=()=>{
  if(index>=lines.length){
   resume();
   if(done)done();
   return;
  }
  const line=lines[index++];
  screen("STORY CUTSCENE",title||chapters[chapter].name,
    line,index===lines.length?"CONTINUE":"NEXT →",advance);
 };
 advance();
}

function notify(text,duration=1.6){
 $("notice").textContent=text;
 $("notice").style.display="block";
 noticeTimer=duration;
}

function saved(){
 try{
  return clamp(Number(localStorage.getItem(SAVE)||0),0,7);
 }catch(e){return 0;}
}

function save(){
 try{
  localStorage.setItem(SAVE,String(Math.max(saved(),chapter)));
 }catch(e){}
}

/* CHAPTER GENERATION */

function addPlatform(x,y,w,type="stone",phase=0){
 platforms.push({x,y,w,type,phase});
}

function makeLevel(n){
 chapter=n;
 time=0;
 camera=0;
 collected=0;
 bossActive=false;
 bossEntered=false;
 finished=false;

 platforms=[];
 souls=[];
 enemies=[];
 shots=[];
 particles=[];
 checkpoints=[];
 titan=null;

 const d=difficulties[difficulty];

 Object.assign(hero,{
  x:75,y:390,w:27,h:43,
  vx:0,vy:0,dir:1,
  hp:d.hp,maxHp:d.hp,
  jumps:0,ground:false,
  dashReady:true,dash:0,inv:1,
  slash:0,slashCd:0,blastCd:0,
  pulseCd:0,shield:0,shieldCd:0
 });

 checkpointX=75;
 checkpointY=390;

 addPlatform(0,458,335);

 const heights=[410,365,385,340,405,345,375,355];

 for(let i=0;i<15;i++){
  const x=290+i*225;
  const y=heights[(i+n)%heights.length];

  let type="stone";
  if(n>=1&&i%5===2)type="moving";
  if(n>=2&&i%5===4)type="shifting";
  if(n>=3&&i%7===5)type="spring";

  if(i===6||i===14)type="stone";

  addPlatform(x,y,190,type,i*.65);

  if([2,7,11].includes(i)){
   souls.push({x:x+95,y:y-55,taken:false});
  }

  if(i===6){
   checkpoints.push({x:x+95,y,active:false});
  }

  if(n>=1&&i%4===3){
   enemies.push({
    x:x+90,y:y-75,
    baseX:x+90,baseY:y-75,
    hp:75*d.boss,
    dead:false,phase:i*1.6
   });
  }
 }

 const last=platforms[platforms.length-1];
 worldEnd=last.x+last.w+200;

 if(n===7){
  const arenaStart=worldEnd+5;
  addPlatform(worldEnd-165,445,275);
  addPlatform(arenaStart,460,1120);
  worldEnd=arenaStart+1120;

  checkpoints.push({
   x:arenaStart+95,
   y:460,
   active:false,arena:true
  });

  titan={
   x:arenaStart+830,y:300,
   arenaStart,
   hp:1800*d.boss,
   maxHp:1800*d.boss,
   phase:1,action:"idle",
   timer:1.5,count:0,
   attack:"",target:0,
   flash:0,dead:false,
   waves:[],flames:[],strike:null
  };
 }

 Music.reset();
 updateHUD();
}

function startChapter(n){
 makeLevel(n);
 save();

 cutscene(chapters[n].lines,
  ()=>notify("COLLECT THREE LOST SOULS"),
  "CHAPTER "+(n+1)+": "+chapters[n].name);
}

function finishChapter(){
 if(finished)return;
 finished=true;

 const next=chapter+1;

 cutscene([
  "CHAPTER COMPLETE",
  chapters[chapter].ending
 ],()=>{
  if(next<8)startChapter(next);
 },"SOULS RESTORED");
}

function updateHUD(){
 $("chapterLabel").textContent=
 "CHAPTER "+(chapter+1)+" — "+chapters[chapter].name;

 $("objective").textContent=bossActive?
 "DEFEAT THE SPIRIT TITAN":
 "LOST SOULS: "+collected+"/3";

 $("health").textContent=
 "♥ "+Math.ceil(hero.hp)+"/"+hero.maxHp+
 " | DASH "+(hero.dashReady?"READY":"USED")+
 " | BLAST "+(hero.blastCd<=0?"READY":Math.ceil(hero.blastCd)+"s")+
 " | PULSE "+(hero.pulseCd<=0?"READY":Math.ceil(hero.pulseCd)+"s");

 $("hpFill").style.width=
 clamp(hero.hp/hero.maxHp*100,0,100)+"%";
}

/* EFFECTS */

function burst(x,y,color,count=15){
 for(let i=0;i<count;i++){
  const a=Math.random()*Math.PI*2;
  const s=35+Math.random()*200;

  particles.push({
   x,y,vx:Math.cos(a)*s,
   vy:Math.sin(a)*s,
   life:.35+Math.random()*.55,
   maxLife:.9,color,
   radius:2+Math.random()*4
  });
 }
}

function glow(x,y,r,color){
 const g=ctx.createRadialGradient(x,y,0,x,y,r);
 g.addColorStop(0,color);
 g.addColorStop(1,"transparent");
 ctx.fillStyle=g;
 ctx.fillRect(x-r,y-r,r*2,r*2);
}

function platformY(q){
 return q.type==="moving"?
 q.y+Math.sin(time*1.7+q.phase)*38:q.y;
}

function platformVisible(q){
 return q.type!=="shifting"||
 Math.sin(time*2+q.phase)>-.35;
}

/* CONTROLS */

function jump(){
 if(mode!=="playing"||hero.jumps>=2)return;
 hero.vy=hero.jumps===0?-665:-615;
 hero.jumps++;
 hero.ground=false;
 burst(hero.x,hero.y+15,"#b4eeff",12);
}

function dash(){
 if(mode!=="playing"||!hero.dashReady)return;
 hero.dash=.25;
 hero.dashReady=false;
 hero.vy=0;
 hero.inv=Math.max(hero.inv,.3);
 burst(hero.x,hero.y,"#b5c6ff",27);
}

function spiritSlash(){
 if(mode!=="playing"||hero.slashCd>0)return;
 hero.slashCd=.3;
 hero.slash=.23;

 burst(hero.x+hero.dir*40,hero.y,"#d7eaff",22);

 for(const e of enemies){
  if(!e.dead&&Math.abs(hero.x-e.x)<150&&
   Math.abs(hero.y-e.y)<85&&
   (e.x-hero.x)*hero.dir>-25){
   hurtEnemy(e,67);
  }
 }

 if(bossActive&&titan&&!titan.dead&&
  distance(hero.x,hero.y,titan.x,titan.y)<190){
  hurtTitan(75);
 }
}

function soulBlast(){
 if(mode!=="playing"||hero.blastCd>0)return;

 hero.blastCd=1.1;

 shots.push({
  x:hero.x+hero.dir*25,y:hero.y-8,
  vx:hero.dir*790,vy:0,
  radius:16,damage:150,
  friendly:true,life:2
 });

 burst(hero.x,hero.y,"#b9aaff",23);
}

function spiritPulse(){
 if(mode!=="playing"||hero.pulseCd>0)return;

 hero.pulseCd=6.5;
 hero.inv=Math.max(hero.inv,.65);

 burst(hero.x,hero.y,"#d9bcff",65);

 for(const e of enemies){
  if(!e.dead&&distance(hero.x,hero.y,e.x,e.y)<225){
   hurtEnemy(e,140);
  }
 }

 if(bossActive&&titan&&!titan.dead&&
  distance(hero.x,hero.y,titan.x,titan.y)<270){
  hurtTitan(190);
 }

 shots=shots.filter(s=>s.friendly||
  distance(hero.x,hero.y,s.x,s.y)>270);

 notify("SPIRIT PULSE!");
}

function soulShield(){
 if(mode!=="playing"||hero.shieldCd>0)return;

 hero.shield=2.3;
 hero.shieldCd=5.8;
 burst(hero.x,hero.y,"#f2dbff",35);
 notify("SOUL SHIELD!");
}

function hurtEnemy(e,dmg){
 e.hp-=dmg;
 burst(e.x,e.y,"#d8b4ff",10);

 if(e.hp<=0){
  e.dead=true;
  burst(e.x,e.y,"#a6dfff",30);
 }
}

function hurtTitan(dmg){
 if(!titan||titan.dead||!bossActive)return;

 titan.hp=Math.max(0,titan.hp-dmg);
 titan.flash=.15;
 burst(titan.x,titan.y,"#eac7ff",12);

 if(titan.hp<=0)bossVictory();
}

function hurt(amount){
 if(mode!=="playing"||hero.inv>0||hero.shield>0)return;

 hero.hp-=amount;
 hero.inv=.9;

 burst(hero.x,hero.y,"#f394c9",18);

 if(hero.hp<=0)respawn();
}

function respawn(){
 hero.hp=hero.maxHp;

 Object.assign(hero,{
  x:checkpointX,y:checkpointY,
  vx:0,vy:0,
  jumps:0,dashReady:true,
  dash:0,inv:1.8,
  shield:0
 });

 shots=[];

 if(bossActive)resetTitan();

 notify("RETURNED TO CHECKPOINT",2);
}

/* MOVEMENT PHYSICS */

function move(dt){
 for(const key of [
  "inv","slash","slashCd",
  "blastCd","pulseCd",
  "shield","shieldCd"
 ]){
  hero[key]=Math.max(0,hero[key]-dt);
 }

 let dir=0;
 if(keys.a||keys.arrowleft)dir--;
 if(keys.d||keys.arrowright)dir++;

 if(dir)hero.dir=dir;

 if(hero.dash>0){
  hero.dash-=dt;
  hero.vx=hero.dir*790;
  hero.vy=0;
 }else{
  hero.vx=dir*310;
  hero.vy+=1650*dt;
 }

 const previousBottom=hero.y+hero.h/2;

 hero.x+=hero.vx*dt;
 hero.y+=hero.vy*dt;
 hero.x=clamp(hero.x,12,worldEnd-12);
 hero.ground=false;

 for(const q of platforms){
  if(!platformVisible(q))continue;
  const y=platformY(q);

  if(hero.vy>=0&&
   previousBottom<=y+14&&
   hero.y+hero.h/2>=y&&
   hero.x+hero.w/2>q.x&&
   hero.x-hero.w/2<q.x+q.w){
   hero.y=y-hero.h/2;
   hero.vy=0;
   hero.jumps=0;
   hero.dashReady=true;
   hero.ground=true;

   if(q.type==="spring"){
    hero.vy=-900;
    hero.jumps=1;
    hero.ground=false;
   }
   break;
  }
 }

 if(hero.y>H+115){
  respawn();
  return;
 }

 for(const s of souls){
  if(!s.taken&&distance(hero.x,hero.y,s.x,s.y)<38){
   s.taken=true;
   collected++;
   burst(s.x,s.y,"#a9faff",32);

 }

 for(const c of checkpoints){
  if(!c.active&&
   Math.abs(hero.x-c.x)<45&&
   Math.abs(hero.y-(c.y-35))<85){
   c.active=true;
   checkpointX=c.x;
   checkpointY=c.y-45;
   notify(c.arena?"BOSS CHECKPOINT":"CHECKPOINT");
  }
 }

 if(chapter<7&&hero.x>worldEnd-210){
  if(collected===3){
   finishChapter();
  }else if(noticeTimer<=0){
   notify("COLLECT ALL THREE SOULS");
  }
 }

 if(chapter===7&&titan&&!bossEntered&&
  hero.x>titan.arenaStart+155){
  if(collected<3){
   hero.x=titan.arenaStart+130;
   if(noticeTimer<=0)notify("COLLECT THREE SOULS FIRST");

 }

 if(bossActive){
  hero.x=clamp(hero.x,
   titan.arenaStart+130,
   titan.arenaStart+1090);
 }
}

/* ENEMIES AND PROJECTILES */

function updateEnemies(dt){
 for(const e of enemies){
  if(e.dead)continue;

  e.phase+=dt;
  e.x=e.baseX+Math.sin(e.phase)*38;
  e.y=e.baseY+Math.sin(e.phase*2)*17;

  if(distance(hero.x,hero.y,e.x,e.y)<44){
   hurt(difficulties[difficulty].damage);
  }
 }
}

function updateShots(dt){
 for(let i=shots.length-1;i>=0;i--){
  const s=shots[i];

  s.x+=s.vx*dt;
  s.y+=s.vy*dt;
  s.life-=dt;

  let hit=false;

  if(s.friendly){
   for(const e of enemies){
    if(!e.dead&&distance(s.x,s.y,e.x,e.y)<s.radius+25){
     hurtEnemy(e,s.damage);
     hit=true;
     break;
    }
   }

   if(!hit&&bossActive&&titan&&!titan.dead&&
    distance(s.x,s.y,titan.x,titan.y)<s.radius+110){
    hurtTitan(s.damage);
    hit=true;
   }
  }else if(distance(s.x,s.y,hero.x,hero.y)<s.radius+23){
   hurt(s.damage);
   hit=true;
  }

  if(hit||s.life<=0)shots.splice(i,1);
  if(mode!=="playing")break;
 }
}

 ],()=>{

function resetTitan(){
 titan.hp=titan.maxHp;
 titan.phase=1;
 titan.action="idle";
 titan.timer=1.5;
 titan.count=0;
 titan.waves=[];
 titan.flames=[];
 titan.strike=null;
 shots=[];
}

function beginAttack(){
 const attacks=["orbs","slam","slash"];

 if(titan.phase>=2)attacks.push("teleport","storm");
 if(titan.phase===3)attacks.push("orbs","slam");

 titan.attack=attacks[titan.count%attacks.length];
 titan.count++;
 titan.action="warning";
 titan.timer=titan.phase===1?.85:titan.phase===2?.65:.48;
 titan.target=hero.x;

 notify("WARNING — "+titan.attack.toUpperCase(),.75);
}

function executeAttack(){
 titan.action="recover";
 titan.timer=titan.phase===3?.6:.9;

 const d=difficulties[difficulty];

 if(titan.attack==="orbs"){
  const count=titan.phase===1?3:titan.phase===2?5:7;

  for(let i=0;i<count;i++){
   const angle=Math.atan2(hero.y-titan.y,hero.x-titan.x)+
    (i-(count-1)/2)*.15;

   const speed=(240+titan.phase*50)*d.speed;

   shots.push({
    x:titan.x,y:titan.y,
    vx:Math.cos(angle)*speed,
    vy:Math.sin(angle)*speed,
    radius:13,
    damage:d.damage,
    friendly:false,life:4
   });
  }
 }

 if(titan.attack==="slam"){
  titan.waves.push(
   {x:titan.x,vx:-390*d.speed,life:2.5},
   {x:titan.x,vx:390*d.speed,life:2.5}
  );

  burst(titan.x,450,"#d4b5ff",55);
 }

 if(titan.attack==="slash"||titan.attack==="teleport"){
  titan.x=clamp(
   hero.x+(hero.x<titan.x?130:-130),
   titan.arenaStart+290,titan.arenaStart+1000
  );

  titan.strike={x:hero.x,life:.45};

  if(distance(hero.x,hero.y,titan.x,titan.y)<175){
   hurt(d.damage);
  }
 }

 if(titan.attack==="storm"){
  for(const offset of [-165,0,165]){
   titan.flames.push({
    x:clamp(titan.target+offset,
     titan.arenaStart+180,
     titan.arenaStart+1050),
    life:1.2
   });
  }
 }
}

function updateTitan(dt){
 if(!bossActive||!titan||titan.dead)return;

 titan.flash=Math.max(0,titan.flash-dt);

 const ratio=titan.hp/titan.maxHp;
 const phase=ratio<=.33?3:ratio<=.66?2:1;

 if(phase!==titan.phase){
  titan.phase=phase;
  titan.action="recover";
  titan.timer=1.2;
  burst(titan.x,titan.y,"#d2b1ff",90);
  notify("TITAN PHASE "+phase+"!",2);
 }

 $("phase").textContent="PHASE "+titan.phase+" OF 3";
 $("bossFill").style.width=(ratio*100)+"%";

 titan.timer-=dt;

 if(titan.action==="idle"){
  titan.y=300+Math.sin(time*2)*12;
  if(titan.timer<=0)beginAttack();
 }else if(titan.action==="warning"){
  if(titan.timer<=0)executeAttack();
 }else if(titan.action==="recover"&&titan.timer<=0){
  titan.action="idle";
  titan.timer=(titan.phase===1?.7:titan.phase===2?.45:.25)/difficulties[difficulty].speed;
 }

 if(distance(hero.x,hero.y,titan.x,titan.y)<100){
  hurt(difficulties[difficulty].damage);
 }

 if(titan.strike){
  titan.strike.life-=dt;
  if(titan.strike.life<=0)titan.strike=null;
 }

 for(let i=titan.waves.length-1;i>=0;i--){
  const s=titan.waves[i];
  s.x+=s.vx*dt;
  s.life-=dt;

  if(Math.abs(hero.x-s.x)<30&&hero.y+hero.h/2>430){
   hurt(difficulties[difficulty].damage);
  }

  if(s.life<=0)titan.waves.splice(i,1);
 }

 for(let i=titan.flames.length-1;i>=0;i--){
  const f=titan.flames[i];
  f.life-=dt;

  if(Math.abs(hero.x-f.x)<44&&hero.y+hero.h/2>280){
   hurt(difficulties[difficulty].damage);
  }

  if(f.life<=0)titan.flames.splice(i,1);
 }
}

/* GAME UPDATE */

function update(dt){
 time+=dt;

 if(noticeTimer>0){
  noticeTimer-=dt;
  if(noticeTimer<=0)$("notice").style.display="none";
 }

 for(let i=particles.length-1;i>=0;i--){
  const p=particles[i];
  p.x+=p.vx*dt;
  p.y+=p.vy*dt;
  p.life-=dt;
  if(p.life<=0)particles.splice(i,1);
 }

 if(mode!=="playing")return;

 move(dt);
 if(mode!=="playing")return;

 updateEnemies(dt);
 updateTitan(dt);
 updateShots(dt);

 const target=clamp(hero.x-330,0,Math.max(0,worldEnd-W));
 camera+=(target-camera)*Math.min(1,dt*6);

 updateHUD();
}

/* 2.5D SCENERY */

function cloud(x,y,scale,alpha){
 ctx.save();
 ctx.translate(x,y);
 ctx.scale(scale,scale);
 ctx.globalAlpha=alpha;

 const g=ctx.createRadialGradient(0,0,0,0,0,150);
 g.addColorStop(0,"#e2d9ff");
 g.addColorStop(1,"#cbbdff00");

 ctx.fillStyle=g;
 ctx.beginPath();
 ctx.ellipse(0,0,180,45,0,0,Math.PI*2);
 ctx.fill();

 ctx.restore();
}

function crystal(x,y,size,color){
 ctx.save();
 ctx.translate(x,y);
 ctx.shadowColor=color;
 ctx.shadowBlur=24;
 ctx.fillStyle=color;

 ctx.beginPath();
 ctx.moveTo(0,-size);
 ctx.lineTo(size*.48,-size*.12);
 ctx.lineTo(size*.25,size*.72);
 ctx.lineTo(0,size);
 ctx.lineTo(-size*.4,size*.2);
 ctx.closePath();
 ctx.fill();

 ctx.fillStyle="#ffffff88";
 ctx.beginPath();
 ctx.moveTo(0,-size);
 ctx.lineTo(0,size);
 ctx.lineTo(-size*.4,size*.2);
 ctx.closePath();
 ctx.fill();

 ctx.restore();
}

function floatingIsland(x,y,w,h,near=false){
 const g=ctx.createLinearGradient(x,y,x,y+h);

 g.addColorStop(0,near?"#756fa6":"#545184");
 g.addColorStop(.35,near?"#39345f":"#353056");
 g.addColorStop(1,"#17152e");

 ctx.fillStyle=g;
 ctx.beginPath();
 ctx.moveTo(x,y);
 ctx.lineTo(x+w,y);
 ctx.lineTo(x+w*.83,y+h*.5);
 ctx.lineTo(x+w*.58,y+h);
 ctx.lineTo(x+w*.28,y+h*.72);
 ctx.lineTo(x+w*.08,y+h*.35);
 ctx.closePath();
 ctx.fill();

 ctx.fillStyle=near?"#a6d8ee":"#7bb7d9";
 ctx.beginPath();
 ctx.ellipse(x+w/2,y,w/2,11,0,0,Math.PI*2);
 ctx.fill();

 ctx.strokeStyle="#a6c8ff33";

 for(let i=0;i<4;i++){
  ctx.beginPath();
  ctx.moveTo(x+w*(.15+i*.2),y+15);
  ctx.lineTo(x+w*(.15+i*.17),y+h*.35);
  ctx.stroke();
 }
}

function background(){
 const pal=themeColors[chapter];
 const sky=ctx.createLinearGradient(0,0,0,H);
 sky.addColorStop(0,pal[0]);
 sky.addColorStop(.55,pal[1]);
 sky.addColorStop(1,"#090a22");

 ctx.fillStyle=sky;
 ctx.fillRect(0,0,W,H);

 // Luminous spectral moon
 const moonX=700-camera*.025;
 glow(moonX,110,240,pal[2]+"44");

 ctx.fillStyle="#e9e3ff";
 ctx.shadowColor="#bfc4ff";
 ctx.shadowBlur=35;
 ctx.beginPath();
 ctx.arc(moonX,110,58,0,Math.PI*2);
 ctx.fill();
 ctx.shadowBlur=0;

 // Far islands — slow parallax
 for(let i=0;i<11;i++){
  const x=((i*290-camera*.11)%1700+1700)%1700-250;
  const y=190+(i*67)%160;

  floatingIsland(x,y,200+(i%3)*60,70+(i%4)*30);
 }

 // Intermediate clouds
 for(let i=0;i<12;i++){
  const x=((i*235-camera*.2+time*5)%1550+1550)%1550-250;
  const y=120+(i*79)%300;

  cloud(x,y,.65+i%3*.2,.13);
 }

 // Nearby floating ruins
 for(let i=0;i<8;i++){
  const x=((i*440-camera*.42)%2400+2400)%2400-400;
  const y=320+(i*43)%100;

  floatingIsland(x,y,220,110,true);

  if(i%2===0)crystal(x+110,y-45,34,pal[2]);
 }

 // Light streams
 ctx.save();
 ctx.globalCompositeOperation="screen";

 for(let i=0;i<6;i++){
  const x=i*220+Math.sin(time*.3+i)*30;
  const g=ctx.createLinearGradient(x,0,x+120,H);

  g.addColorStop(0,"#ffffff00");
  g.addColorStop(.4,pal[2]+"15");
  g.addColorStop(1,"#ffffff00");

  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.moveTo(x,0);
  ctx.lineTo(x+65,0);
  ctx.lineTo(x+190,H);
  ctx.lineTo(x+105,H);
  ctx.fill();
 }

 ctx.restore();

 for(let i=0;i<55;i++){
  const x=((i*143+time*(5+i%5))%1050+1050)%1050;
  const y=(i*79+Math.sin(time+i)*10)%520;

  ctx.fillStyle=pal[2]+"77";
  ctx.beginPath();
  ctx.arc(x,y,1+i%3*.55,0,Math.PI*2);
  ctx.fill();
 }
}

/* 2.5D PLATFORMS */

function drawPlatforms(){
 for(const q of platforms){
  if(!platformVisible(q))continue;

  const x=q.x-camera;
  const y=platformY(q);

  if(x>W+100||x+q.w<-100)continue;

  const g=ctx.createLinearGradient(x,y,x,y+110);
  g.addColorStop(0,"#575685");
  g.addColorStop(.35,"#3e3a64");
  g.addColorStop(1,"#18152b");

  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(x+q.w,y);
  ctx.lineTo(x+q.w*.78,y+68);
  ctx.lineTo(x+q.w*.58,y+95);
  ctx.lineTo(x+q.w*.3,y+61);
  ctx.lineTo(x+q.w*.07,y+33);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle=q.type==="spring"?"#e4beff":
   q.type==="moving"?"#9adfff":
   q.type==="shifting"?"#d3a8ed":"#9cc9ef";

  ctx.beginPath();
  ctx.ellipse(x+q.w/2,y,q.w/2,11,0,0,Math.PI*2);
  ctx.fill();

  ctx.strokeStyle="#ffffff35";
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(x+12,y+23);
  ctx.lineTo(x+q.w*.45,y+48);
  ctx.lineTo(x+q.w*.65,y+32);
  ctx.stroke();

  if(q.type==="spring"){
   glow(x+q.w/2,y-10,50,"#e5c5ff55");
  }
 }
}

 ctx.lineTo(65,35);
 ctx.lineTo(0,74);
 ctx.lineTo(-65,35);
 ctx.closePath();
 ctx.fill();

 ctx.strokeStyle="#c6abff";
 ctx.lineWidth=6;
 ctx.stroke();

 // Horned helmet
 ctx.fillStyle="#373059";
 ctx.beginPath();
 ctx.moveTo(-53,-100);
 ctx.lineTo(-110,-165);
 ctx.lineTo(-82,-100);
 ctx.lineTo(-58,-145);
 ctx.lineTo(0,-174);
 ctx.lineTo(58,-145);
 ctx.lineTo(82,-100);
 ctx.lineTo(110,-165);
 ctx.lineTo(53,-100);
 ctx.closePath();
 ctx.fill();

 // Face
 ctx.fillStyle="#15102b";
 ctx.beginPath();
 ctx.ellipse(0,-105,48,53,0,0,Math.PI*2);
 ctx.fill();

 ctx.shadowColor="#d6b4ff";
 ctx.shadowBlur=24;
 ctx.fillStyle="#eddcff";
 ctx.fillRect(-29,-116,20,9);
 ctx.fillRect(9,-116,20,9);
 ctx.shadowBlur=0;

 // Soul crystal
 crystal(0,-15,38,"#b3a3ff");

 ctx.restore();

 ctx.textAlign="center";
 ctx.font="bold 19px Arial";
 ctx.fillStyle="#f4ddff";
 ctx.fillText("THE SPIRIT TITAN",x,y-212);
 ctx.textAlign="left";
}

function drawBossAttacks(){
 if(!titan||!bossActive)return;

 if(titan.action==="warning"){
  ctx.globalAlpha=.35+.15*Math.sin(time*22);
  ctx.fillStyle="#ef8dff";

  if(titan.attack==="slam"){
   ctx.fillRect(titan.arenaStart+130-camera,445,960,16);
  }else if(titan.attack==="slash"||titan.attack==="teleport"){
   ctx.fillRect(titan.target-camera-95,280,190,180);
  }else if(titan.attack==="storm"){
   for(const dx of [-165,0,165]){
    ctx.fillRect(titan.target+dx-camera-40,350,80,110);
   }
  }else{
   ctx.beginPath();
   ctx.arc(titan.x-camera,titan.y,105,0,Math.PI*2);
   ctx.fill();
  }

  ctx.globalAlpha=1;
 }

 if(titan.strike){
  ctx.strokeStyle="#efc4ff";
  ctx.lineWidth=15;
  ctx.shadowColor="#d3a0ff";
  ctx.shadowBlur=25;
  ctx.beginPath();
  ctx.arc(titan.strike.x-camera,titan.y,95,-1.2,1.4);
  ctx.stroke();
  ctx.shadowBlur=0;
 }

 for(const wave of titan.waves){
  glow(wave.x-camera,447,56,"#d8b1ff77");
  ctx.fillStyle="#dfbaff";
  ctx.beginPath();
  ctx.arc(wave.x-camera,445,26,Math.PI,0);
  ctx.fill();
 }

 for(const flame of titan.flames){
  const x=flame.x-camera;
  glow(x,365,80,"#b27aff66");
  ctx.fillStyle="#bc8cf6b0";
  ctx.beginPath();
  ctx.moveTo(x-43,460);
  ctx.lineTo(x,255);
  ctx.lineTo(x+43,460);
  ctx.fill();
 }
}

function drawParticles(){
 for(const p of particles){
  ctx.globalAlpha=clamp(p.life/p.maxLife,0,1);
  ctx.fillStyle=p.color;
  ctx.shadowColor=p.color;
  ctx.shadowBlur=9;
  ctx.beginPath();
  ctx.arc(p.x-camera,p.y,p.radius,0,Math.PI*2);
  ctx.fill();
 }
 ctx.globalAlpha=1;
 ctx.shadowBlur=0;
}

function draw(){
 ctx.clearRect(0,0,W,H);
 background();
 drawPlatforms();
 drawItems();
 drawTitan();
 drawBossAttacks();

 // Projectiles
 for(const s of shots){
  const x=s.x-camera;
  const color=s.friendly?"#c6eaff":"#e09cff";

  glow(x,s.y,s.radius*4,color+"55");

  ctx.fillStyle=color;
  ctx.shadowColor=color;
  ctx.shadowBlur=18;
  ctx.beginPath();
  ctx.arc(x,s.y,s.radius,0,Math.PI*2);
  ctx.fill();
  ctx.shadowBlur=0;
 }

 drawHero();
 drawParticles();

 // Foreground atmosphere
 const fog=ctx.createLinearGradient(0,365,0,H);
 fog.addColorStop(0,"#7f64be00");
 fog.addColorStop(1,"#261a5770");
 ctx.fillStyle=fog;
 ctx.fillRect(0,365,W,H-365);

 // Exit portal
 if(chapter<7){
  const x=worldEnd-148-camera;

  ctx.strokeStyle=collected===3?"#b8fcff":"#715d96";
  ctx.shadowColor="#a9ddff";
  ctx.shadowBlur=collected===3?25:0;
  ctx.lineWidth=8;
  ctx.beginPath();
  ctx.ellipse(x,375,37,67,0,0,Math.PI*2);
  ctx.stroke();
  ctx.shadowBlur=0;

  ctx.textAlign="center";
  ctx.font="13px Arial";
  ctx.fillStyle="#e5daff";
  ctx.fillText(collected===3?"PORTAL OPEN":"3 SOULS REQUIRED",x,280);
  ctx.textAlign="left";
 }

 // Cinematic vignette
 const shade=ctx.createRadialGradient(480,245,180,480,270,590);
 shade.addColorStop(0,"#00000000");
 shade.addColorStop(1,"#0704198c");
 ctx.fillStyle=shade;
 ctx.fillRect(0,0,W,H);
}

/* FRAME LOOP */

function loop(timestamp){
 const dt=Math.min((timestamp-(lastFrame||timestamp))/1000,.04);
 lastFrame=timestamp;
 update(dt);
 draw();
 requestAnimationFrame(loop);
}

/* KEYBOARD */

window.addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();

 if([" ","arrowup","arrowdown","arrowleft","arrowright"].includes(k)){
  e.preventDefault();
 }

 keys[k]=true;

 if(e.repeat||mode!=="playing")return;

 if(k===" "||k==="w"||k==="arrowup")jump();
 if(k==="shift")dash();
 if(k==="j")spiritSlash();
 if(k==="k")soulBlast();
 if(k==="f")spiritPulse();
 if(k==="n")soulShield();
});

window.addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
});

window.addEventListener("blur",()=>{
 for(const k in keys)keys[k]=false;
});

/* BUTTONS */

$("jump").onclick=jump;
$("attack").onclick=spiritSlash;
$("blast").onclick=soulBlast;
$("dash").onclick=dash;
$("pulse").onclick=spiritPulse;
$("shield").onclick=soulShield;

$("difficulty").onchange=e=>{
 difficulty=e.target.value;
 if(mode!=="menu")startChapter(chapter);
};

$("restart").onclick=()=>{
 if(mode!=="menu")startChapter(chapter);
};

$("menu").onclick=showMenu;

$("fullscreen").onclick=async()=>{
 try{
  if(document.fullscreenElement)await document.exitFullscreen();
  else await $("game").requestFullscreen();
 }catch(e){
  alert("Fullscreen isn't available in this browser.");
 }
};

function showMenu(){
 mode="menu";

 const progress=saved();

 screen(
  "THEDARKWITHIN — DLC II",
  "THE SPIRIT REALM",
  "Enter a world of floating islands, magical spirits, and ancient ruins.\n\n"+
  "Collect lost souls, master spirit powers, and confront the corrupted Spirit Titan.\n\n"+
  "8 CHAPTERS • 2.5D SCENERY • CINEMATIC BOSS • MUSIC",
  progress>0?"CONTINUE — CHAPTER "+(progress+1):"BEGIN STORY",
  ()=>{
   Music.start();
   startChapter(progress);
  },
  "NEW GAME",
  ()=>{
   if(!confirm("Start again from Chapter 1?"))return;
   try{localStorage.removeItem(SAVE);}catch(e){}
   Music.start();
   startChapter(0);
  }
 );
}

makeLevel(0);
showMenu();
requestAnimationFrame(loop);

})();
</script>

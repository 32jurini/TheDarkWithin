// ======================================
// MUSIC ENGINE — ROYAL CHIPTUNE
// ======================================

const Music=(()=>{
 let audio=null,master=null,noise=null;
 let timer=null,enabled=true,volume=.35;
 let cursor=0,nextTime=0,activeTheme=-1;
 const BPM=[104,84,90,116,123,100,136,158];
 const SEMI={C:0,D:2,E:4,F:5,G:7,A:9,B:11};

 const themes=[
 {
 name:"Golden Kingdom — Royal Fanfare",
 lead:["C5","E5","G5","C6","G5","E5","D5","G5",
       "E5","G5","A5","G5","E5","D5","C5","R"],
 bass:["C3","G3","A3","G3"],
 chords:["C4","E4","G4"]
 },
 {
 name:"Beneath the Castle — Whispers",
 lead:["C5","R","B4","G4","R","D5","C5","R",
       "G4","A4","C5","B4","G4","R","F#4","R"],
 bass:["C3","G2","A#2","F#2"],
 chords:["C4","D#4","G4"]
 },
 {
 name:"King's Secret — Uneasy Crown",
 lead:["E5","D5","C5","R","G4","B4","C5","R",
       "E5","F5","D5","B4","C5","R","G4","R"],
 bass:["A2","F2","G2","E2"],
 chords:["A3","C4","E4"]
 },
 {
 name:"Corrupted Guard — March to War",
 lead:["A4","C5","D5","E5","D5","C5","A4","R",
       "G4","A4","C5","D5","E5","G5","E5","R"],
 bass:["A2","A2","F2","G2"],
 chords:["A3","C4","E4"]
 },
 {
 name:"Fallen Village — Ashes and Steel",
 lead:["D5","F5","A5","G5","F5","D5","C5","R",
       "D5","E5","F5","A5","G5","F5","D5","R"],
 bass:["D3","A2","C3","A2"],
 chords:["D4","F4","A4"]
 },
 {
 name:"Forbidden Ritual — Dark Magic",
 lead:["C5","R","D#5","F#5","G5","R","F#5","D#5",
       "C5","R","B4","F#4","G4","R","C5","R"],
 bass:["C2","F#2","G2","C2"],
 chords:["C4","D#4","F#4"]
 },
 {
 name:"Last Loyal Knight — Final March",
 lead:["A4","C5","E5","A5","G5","E5","D5","C5",
       "A4","C5","D5","F5","E5","D5","C5","R"],
 bass:["A2","F2","D2","E2"],
 chords:["A3","C4","E4"]
 },
 {
 name:"Purple King — Battle of the Crown",
 lead:["C6","G5","E5","G5","A5","G5","E5","D5",
       "C6","B5","A5","G5","E5","G5","C6","R"],
 bass:["C3","G2","A#2","F#2"],
 chords:["C4","D#4","G4"]
 }
 ];

 function noteFreq(n){
   if(!n||n==="R")return 0;
   const m=/^([A-G])(#?)(\d)$/.exec(n);
   if(!m)return 0;
   const midi=(Number(m[3])+1)*12+
      SEMI[m[1]]+(m[2]?1:0);
   return 440*Math.pow(2,(midi-69)/12);
 }

 function setup(){
   if(audio)return;
   const Ctx=window.AudioContext||window.webkitAudioContext;
   if(!Ctx)return;
   audio=new Ctx();
   master=audio.createGain();
   master.gain.value=volume*.55;
   master.connect(audio.destination);
   noise=audio.createBuffer(1,audio.sampleRate, audio.sampleRate);
   const d=noise.getChannelData(0);
   for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 }

 function tone(note,when,length,type="brass",level=.3){
   const frequency=noteFreq(note);
   if(!audio||!frequency||!enabled)return;
   const osc=audio.createOscillator();
   const gain=audio.createGain();
   const end=when+length;

   osc.type=type==="bass"?"triangle":
     type==="harmony"?"sine":"sawtooth";
   osc.frequency.setValueAtTime(frequency,when);

   if(type==="brass"){
     const filter=audio.createBiquadFilter();
     filter.type="lowpass";
     filter.frequency.setValueAtTime(900,when);
     filter.frequency.linearRampToValueAtTime(2100,when+.06);
     filter.frequency.linearRampToValueAtTime(650,end);
     osc.connect(filter);
     filter.connect(gain);
   }else osc.connect(gain);

   gain.gain.setValueAtTime(.0001,when);
   gain.gain.linearRampToValueAtTime(level,when+.035);
   gain.gain.setTargetAtTime(.0001,end-.06,.04);
   osc.start(when);
   osc.stop(end+.06);
   gain.connect(master);
 }

 function drum(when,kind){
   if(!audio||!enabled)return;

   if(kind==="kick"){
     const o=audio.createOscillator(),g=audio.createGain();
     o.type="sine";
     o.frequency.setValueAtTime(155,when);
     o.frequency.exponentialRampToValueAtTime(47,when+.16);
     g.gain.setValueAtTime(.38,when);
     g.gain.exponentialRampToValueAtTime(.001,when+.19);
     o.connect(g);g.connect(master);
     o.start(when);o.stop(when+.2);
   }else{
     const src=audio.createBufferSource();
     src.buffer=noise;
     const filt=audio.createBiquadFilter();
     filt.type="highpass";
     filt.frequency.value=kind==="snare"?1200:4500;
     const gain=audio.createGain();
     gain.gain.setValueAtTime(kind==="snare"?.15:.045,when);
     gain.gain.exponentialRampToValueAtTime(.001,
       when+(kind==="snare"?.13:.055));
     src.connect(filt);filt.connect(gain);
     gain.connect(master);
     src.start(when);
     src.stop(when+.16);
   }
 }

 function themeIndex(){
   return clamp(chapter,0,7);
 }

 function schedule(){
   if(!audio||!enabled||audio.state!=="running")return;
   const index=themeIndex(),song=themes[index];

   if(activeTheme!==index){
     activeTheme=index;
     cursor=0;
     nextTime=audio.currentTime+.05;
     $("trackLabel").textContent="♫ "+song.name;
   }

   const beat=60/BPM[index];
   const eighth=beat/2;

   while(nextTime<audio.currentTime+.22){
     const step=cursor%16;
     const chordIndex=Math.floor(step/4);

     tone(song.lead[step],nextTime,eighth*.83,
       "brass",index>=6?.23:.17);

     if(step%4===0){
       tone(song.bass[chordIndex%4],nextTime,beat*1.8,
         "bass",.23);

       if(index!==1){
         for(const note of song.chords){
           tone(note,nextTime,beat*.85,
             "harmony",.025);
         }
       }
     }

     if(step%4===0)drum(nextTime,"kick");
     if(step%4===2)drum(nextTime,"snare");
     if(index>=3||step%2===0)drum(nextTime,"hat");

     if(index>=6&&step%4===3)drum(nextTime,"snare");

     cursor++;
     nextTime+=eighth;
   }
 }

 async function start(){
   setup();
   if(!audio)return;
   try{await audio.resume();}catch(e){}
   if(!timer)timer=setInterval(schedule,55);
   activeTheme=-1;
   updateButton();
 }

 function updateButton(){
   $("musicButton").textContent=
     enabled?"♫ MUSIC: ON":"♫ MUSIC: OFF";
 }

 function toggle(){
   enabled=!enabled;
   if(master&&audio){
     master.gain.setTargetAtTime(
       enabled?volume*.55:0,
       audio.currentTime,.025
     );
   }
   if(enabled){
     activeTheme=-1;
     start();
   }
   updateButton();
 }

 function setVolume(value){
   volume=Number(value)/100;
   if(master&&audio){
     master.gain.setTargetAtTime(
       enabled?volume*.55:0,
       audio.currentTime,.025
     );
   }
 }

 return{start,toggle,setVolume,
   changeChapter:()=>{activeTheme=-1;}};
})();

$("musicButton").onclick=()=>Music.toggle();
$("volume").oninput=e=>Music.setVolume(e.target.value);

// ======================================
// CUTSCENES AND DIALOGUE
// ======================================

function showSlide(){
 const s=slides[slideIndex];
 $("overlayLabel").textContent=s.label;
 $("overlayTitle").textContent=s.title;
 $("overlayText").textContent=s.text;
}

function playSlides(list,callback){
 slides=list;slideIndex=0;slideDone=callback||null;
 mode="scene";
 $("overlay").style.display="flex";
 $("hud").style.display="none";
 $("newButton").style.display="none";
 $("continueButton").style.display="inline-block";
 $("continueButton").textContent="CONTINUE";
 showSlide();
}

function nextSlide(){
 if(mode!=="scene")return;
 slideIndex++;
 if(slideIndex<slides.length){showSlide();return;}
 $("overlay").style.display="none";
 $("hud").style.display="block";
 mode="playing";
 const done=slideDone;slideDone=null;
 if(done)done();
}

function talk(lines,callback){
 talking=true;
 dialogue=lines;dialogueIndex=0;
 dialogueDone=callback||null;
 $("dialogue").style.display="block";
 showDialogue();
}

function showDialogue(){
 const [who,words]=dialogue[dialogueIndex];
 $("speaker").textContent=who;
 $("speech").textContent=words;
}

function nextDialogue(){
 if(!talking)return;
 dialogueIndex++;
 if(dialogueIndex<dialogue.length){showDialogue();return;}
 talking=false;
 $("dialogue").style.display="none";
 const done=dialogueDone;dialogueDone=null;
 if(done)done();
}

$("dialogue").onclick=nextDialogue;

// ======================================

const step=()=>chapters[chapter].steps[stepIndex]||null;

function updateHUD(){
 $("chapterName").textContent=
   "CHAPTER "+(chapter+1)+" — "+chapters[chapter].name;
 $("objective").textContent=
   step()?"OBJECTIVE: "+step().name:"";
 $("health").style.width=(100*player.hp/player.maxHp)+"%";
 $("healthBack").style.display=chapter>=3?"block":"none";
}

function saveChapter(index){
 try{
   const old=Number(localStorage.getItem(SAVE)||0);
   localStorage.setItem(SAVE,String(Math.max(old,index)));
 }catch(e){}
}

function startChapter(index){
 chapter=index;stepIndex=0;
 enemies=[];shots=[];sparks=[];
 talking=false;
 $("dialogue").style.display="none";
 player.x=480;player.y=445;
 player.hp=player.maxHp;
 player.invincible=1;
 player.sword=player.gold=player.shield=player.fire=0;
 player.shieldTime=0;
 saveChapter(index);
 Music.changeChapter();
 playSlides(chapters[chapter].intro,enterStep);
}

function enterStep(){
 updateHUD();
 battleFinished=false;
 if(step()?.type==="fight")spawnBattle(step());
}

function advanceStep(){
 if(mode!=="playing")return;
 stepIndex++;
 if(stepIndex>=chapters[chapter].steps.length){
   finishChapter();
 }else enterStep();
}

function finishChapter(){
 const next=chapter+1;
 playSlides(chapters[chapter].ending,()=>{
   if(next<chapters.length)startChapter(next);
   else storyComplete();
 });
}

function storyComplete(){
 mode="ending";
 $("overlay").style.display="flex";
 $("hud").style.display="none";
 $("overlayLabel").textContent="THE FORGOTTEN KING";
 $("overlayTitle").textContent="STORY COMPLETE";
 $("overlayText").textContent=
   "All eight chapters completed.\n"+
   "The Golden Kingdom has fallen.\n"+
   "The Purple King will return in TheDarkWithin.";
 $("continueButton").textContent="RETURN TO MENU";
 $("newButton").style.display="none";
}

function nearTarget(){
 const s=step();
 return mode==="playing"&&!talking&&s&&
   s.type==="talk"&&
   distance(player.x,player.y,s.x,s.y)<95;
}

function interact(){
 if(talking){nextDialogue();return;}
 if(!nearTarget())return;
 talk(step().lines,advanceStep);
}

$("prompt").onclick=interact;

// ======================================
// ENEMIES AND COMBAT
// ======================================

const stats={
 guard:[70,10,82,20,"#895cba"],
 captain:[290,16,83,31,"#ac4bd7"],
 beast:[95,12,105,22,"#6d3978"],
 beastBoss:[370,19,83,35,"#ad457e"],
 spirit:[105,13,110,21,"#a13cd7"],
 herald:[440,20,85,37,"#c148ec"],
 guardian:[520,23,93,39,"#9675a0"],
 aldric:[620,21,100,37,"#d0a0df"],
 purpleKing:[1100,25,98,47,"#9433e3"]
};

function spawnBattle(s){
 enemies=[];shots=[];battleFinished=false;
 const [hp,damage,speed,r,color]=stats[s.kind];
 for(let i=0;i<s.count;i++){
   const a=i*2*Math.PI/s.count;
   enemies.push({
     x:s.count===1?480:480+245*Math.cos(a),
     y:s.count===1?225:305+110*Math.sin(a),
     hp,maxHp:hp,damage,speed,r,color,
     type:s.kind,attack:1,shoot:1.5,flash:0,dead:false
   });
 }
 if(s.kind==="purpleKing"){
   playSlides([
     S("THE BLACK SPIRIT","THE TRUE KING",
       "\"Your friend is gone. Behold the Purple King!\"")
   ]);
 }
}

function burst(x,y,color,n=12){
 for(let i=0;i<n;i++){
   const a=Math.random()*Math.PI*2;
   sparks.push({
     x,y,vx:Math.cos(a)*(50+Math.random()*125),
     vy:Math.sin(a)*(50+Math.random()*125),
     life:.25+Math.random()*.4,color
   });
 }
}

function hurtEnemy(e,amount){
 if(e.dead)return;
 e.hp-=amount;e.flash=.13;
 burst(e.x,e.y,"#ffd78c",6);
 if(e.hp<=0){
   e.dead=true;
   burst(e.x,e.y,e.color,25);
 }
}

function hurtPlayer(amount){
 if(player.invincible>0||player.shieldTime>0)return;
 player.hp=Math.max(0,player.hp-amount);
 player.invincible=.8;
 burst(player.x,player.y,"#ff455e",12);
 if(player.hp===0){
   mode="defeated";
   playSlides([
     S("SIR AERON","YOU HAVE FALLEN",
       "The kingdom still needs you.\nRise and fight again.")
   ],()=>{
     player.hp=player.maxHp;
     player.x=480;player.y=445;
     player.invincible=1.5;
     if(step()?.type==="fight")spawnBattle(step());
   });
 }
}

function sword(){
 if(mode!=="playing"||talking||player.sword>0)return;
 player.sword=.34;
 player.slashTime=.14;
 for(const e of enemies){
   if(e.dead)continue;
   if(distance(player.x,player.y,e.x,e.y)<90+e.r&&
     (e.x-player.x)*player.facing>-25)
     hurtEnemy(e,35);
 }
 burst(player.x+player.facing*35,player.y,"#edf4ff",8);
 checkBattle();
}

function golden(){
 if(mode!=="playing"||talking||player.gold>0)return;
 player.gold=2.5;
 burst(player.x,player.y,"#ffd45d",35);
 for(const e of enemies){
   if(!e.dead&&distance(player.x,player.y,e.x,e.y)<155+e.r)
     hurtEnemy(e,85);
 }
 checkBattle();
}

function shield(){
 if(mode!=="playing"||talking||player.shield>0)return;
 player.shield=5;
 player.shieldTime=2;
 burst(player.x,player.y,"#ffdc80",20);
}

function flame(){
 if(mode!=="playing"||talking||player.fire>0)return;
 player.fire=1.4;
 shots.push({
   x:player.x+player.facing*22,y:player.y-15,
   vx:player.facing*490,vy:0,r:13,
   damage:75,life:1.8,good:true
 });
}

function checkBattle(){
 if(mode!=="playing"||battleFinished||
    step()?.type!=="fight")return;
 if(enemies.some(e=>!e.dead))return;
 battleFinished=true;

 if(chapter===7&&step().kind==="aldric"){
   playSlides([
     S("THE KING FALLS","ALDRIC IS DEFEATED",
       "Aeron strikes his old friend to his knees."),
     S("THE BLACK SPIRIT","NOT YET!",
       "Purple flames consume the ruined throne."),
     S("THE TRANSFORMATION","THE PURPLE KING",
       "A monstrous king rises from the darkness.")
   ],advanceStep);
 }else{
   advanceStep();
 }
}

// ======================================
// GAME LOOP
// ======================================

function update(dt){
 time+=dt;

 for(let i=sparks.length-1;i>=0;i--){
   const p=sparks[i];
   p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
   if(p.life<=0)sparks.splice(i,1);
 }

 if(mode!=="playing")return;

 for(const name of ["sword","gold","shield","fire"]){
   player[name]=Math.max(0,player[name]-dt);
 }
 player.shieldTime=Math.max(0,player.shieldTime-dt);
 player.invincible=Math.max(0,player.invincible-dt);
 player.slashTime=Math.max(0,player.slashTime-dt);

 if(!talking){
   let dx=Number(!!(keys.d||keys.arrowright))-
          Number(!!(keys.a||keys.arrowleft));
   let dy=Number(!!(keys.s||keys.arrowdown))-
          Number(!!(keys.w||keys.arrowup));
   const len=Math.hypot(dx,dy);
   if(len){
     dx/=len;dy/=len;
     player.x+=dx*player.speed*dt;
     player.y+=dy*player.speed*dt;
     if(dx)player.facing=dx>0?1:-1;
   }
   player.x=clamp(player.x,25,W-25);
   player.y=clamp(player.y,195,H-30);

   if(step()?.type==="fight"){
     for(const e of enemies){
       if(e.dead)continue;
       e.attack=Math.max(0,e.attack-dt);
       e.shoot=Math.max(0,e.shoot-dt);
       e.flash=Math.max(0,e.flash-dt);
       const dx=player.x-e.x,dy=player.y-e.y;
       const d=Math.hypot(dx,dy)||1;
       const reach=e.r+player.r+8;

       if(d>reach){
         e.x+=dx/d*e.speed*dt;
         e.y+=dy/d*e.speed*dt;
       }else if(e.attack<=0){
         hurtPlayer(e.damage);
         e.attack=1.15;
       }

       if(mode!=="playing")break;

       if(e.r>=31&&e.shoot<=0){
         shots.push({
           x:e.x,y:e.y,vx:dx/d*245,vy:dy/d*245,
           r:12,damage:15,life:3,good:false
         });
         e.shoot=1.5;
       }
     }
   }

   if(mode==="playing"){
     for(let i=shots.length-1;i>=0;i--){
       const p=shots[i];
       p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
       let hit=false;

       if(p.good){
         for(const e of enemies){
           if(!e.dead&&distance(p.x,p.y,e.x,e.y)<p.r+e.r){
             hurtEnemy(e,p.damage);hit=true;break;
           }
         }
       }else if(distance(p.x,p.y,player.x,player.y)<p.r+player.r){
         hurtPlayer(p.damage);hit=true;
       }

       if(hit||p.life<=0||p.x<0||p.x>W||p.y<0||p.y>H)
         shots.splice(i,1);
       if(mode!=="playing")break;
     }
   }
 }

 if(mode==="playing")checkBattle();
 updateHUD();
 $("prompt").style.display=nearTarget()?"block":"none";
}

// ======================================
// PIXEL ART WORLD
// ======================================

const palettes={
 kingdom:["#c99576","#777c82"],
 mines:["#27152f","#443449"],
 castle:["#40314b","#5d4d62"],
 corrupted:["#642b58","#4a324c"],
 village:["#bd6349","#66413b"],
 ritual:["#321345","#49335e"],
 ruins:["#802d39","#4b343b"],
 final:["#2f1048","#3b2451"]
};

function crystal(x,y){
 const pulse=7*Math.sin(time*4);
 ctx.fillStyle="#c459ff35";
 ctx.beginPath();ctx.arc(x,y,65+pulse,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#8131c3";
 ctx.beginPath();
 ctx.moveTo(x,y-65);ctx.lineTo(x+40,y-5);
 ctx.lineTo(x,y+50);ctx.lineTo(x-40,y-5);ctx.fill();
 ctx.fillStyle="#dc95ff";
 ctx.beginPath();
 ctx.moveTo(x,y-53);ctx.lineTo(x+12,y);
 ctx.lineTo(x,y+38);ctx.fill();
}

function background(){
 const theme=chapters[chapter].theme;
 const [top,ground]=palettes[theme];
 const gradient=ctx.createLinearGradient(0,0,0,H);
 gradient.addColorStop(0,top);
 gradient.addColorStop(1,"#090810");
 ctx.fillStyle=gradient;ctx.fillRect(0,0,W,H);

 ctx.fillStyle=ground;
 for(let i=0;i<11;i++){
   const x=i*105,peak=130+(i*43)%120;
   ctx.beginPath();
   ctx.moveTo(x-80,350);ctx.lineTo(x+25,350-peak);
   ctx.lineTo(x+140,350);ctx.fill();
 }
 ctx.fillRect(0,348,W,192);

 for(let i=0;i<60;i++){
   ctx.fillStyle="#ffffff13";
   ctx.fillRect((i*127)%W,360+(i*71)%170,11,3);
 }

 if(["kingdom","castle","corrupted","ruins","final"].includes(theme)){
   ctx.fillStyle=theme==="kingdom"?"#98909c":"#393042";
   ctx.fillRect(312,105,336,240);
   for(const x of [188,690]){
     ctx.fillRect(x,72,100,272);
     ctx.fillStyle="#211626";
     ctx.fillRect(x+36,110,29,76);
     ctx.fillStyle=theme==="kingdom"?"#98909c":"#393042";
   }
   ctx.fillStyle="#201622";
   ctx.fillRect(438,185,85,160);
   ctx.fillStyle=theme==="kingdom"?"#e1bc65":"#a44bcf";
   ctx.fillRect(355,135,24,115);
   ctx.fillRect(585,135,24,115);
 }

 if(theme==="mines"||theme==="ritual"){
   ctx.fillStyle="#120c1c";
   for(let i=0;i<20;i++){
     const x=i*55;
     ctx.beginPath();
     ctx.moveTo(x,0);ctx.lineTo(x+25,80+(i%4)*20);
     ctx.lineTo(x+53,0);ctx.fill();
   }
   crystal(510,280);
 }

 if(theme==="village"){
   for(let i=0;i<5;i++){
     const x=25+i*210;
     ctx.fillStyle="#553837";
     ctx.fillRect(x,200,130,155);
     ctx.fillStyle="#30202b";
     ctx.beginPath();
     ctx.moveTo(x-12,205);ctx.lineTo(x+65,120);
     ctx.lineTo(x+142,205);ctx.fill();
     ctx.fillStyle="#ef8540";
     ctx.fillRect(x+45,255,30,45);
   }
 }

 if(theme==="final"){
   ctx.fillStyle="#e0b66a";ctx.fillRect(426,150,108,160);
   ctx.fillStyle="#612878";ctx.fillRect(439,170,82,140);
   ctx.strokeStyle="#b24fff";ctx.lineWidth=6;
   ctx.beginPath();ctx.ellipse(480,405,280,88,0,0,Math.PI*2);ctx.stroke();
 }
}

function person(x,y,color,king=false){
 ctx.save();
 ctx.translate(Math.round(x),Math.round(y));
 ctx.fillStyle="#0006";ctx.fillRect(-20,23,40,8);
 ctx.fillStyle="#24212e";
 ctx.fillRect(-13,8,10,22);ctx.fillRect(4,8,10,22);
 ctx.fillStyle=color;ctx.fillRect(-17,-25,34,38);
 ctx.fillStyle="#e0ac85";ctx.fillRect(-12,-47,24,25);
 ctx.fillStyle="#35272c";ctx.fillRect(-14,-50,28,10);
 ctx.fillStyle=king&&chapter>=2?"#d94aff":"#1b1620";
 ctx.fillRect(-8,-35,5,5);ctx.fillRect(5,-35,5,5);
 if(king){
   ctx.fillStyle="#edc874";
   ctx.fillRect(-16,-59,32,11);
   ctx.fillRect(-16,-68,6,11);
   ctx.fillRect(-3,-72,6,15);
   ctx.fillRect(10,-68,6,11);
 }
 ctx.restore();
}

function drawTarget(){
 const s=step();
 if(!s||s.type!=="talk")return;

 if(["Crystal","Ancient Altar"].includes(s.character))crystal(s.x,s.y);
 else if(["Journal","Broken Seal","Throne Door"].includes(s.character)){
   ctx.fillStyle="#ecd18d";
   ctx.fillRect(s.x-22,s.y-19,44,38);
 }else{
   person(s.x,s.y,
     s.character==="King Aldric"?"#c5a04f":"#897c98",
     s.character==="King Aldric");
 }

 ctx.textAlign="center";
 ctx.fillStyle="#ffe8a6";
 ctx.font="bold 29px Arial";
 ctx.fillText("!",s.x,s.y-76+Math.sin(time*4)*5);
 ctx.font="14px Arial";ctx.fillText(s.character,s.x,s.y+44);
 ctx.textAlign="left";
}

function drawEnemies(){
 for(const e of enemies){
   if(e.dead)continue;
   ctx.save();ctx.translate(e.x,e.y);
   ctx.fillStyle=e.flash>0?"#fff":e.color;
   ctx.beginPath();ctx.ellipse(0,0,e.r,e.r*1.25,0,0,Math.PI*2);ctx.fill();
   ctx.fillStyle="#180f20";ctx.fillRect(-e.r/2,-e.r,e.r,12);
   ctx.fillStyle="#ff3a72";
   ctx.fillRect(-12,-6,8,7);ctx.fillRect(5,-6,8,7);
   if(e.type==="aldric"||e.type==="purpleKing"){
     ctx.fillStyle="#efbf6d";
     ctx.beginPath();
     ctx.moveTo(-e.r,-e.r);ctx.lineTo(-e.r,-e.r-23);
     ctx.lineTo(0,-e.r-12);ctx.lineTo(0,-e.r-36);
     ctx.lineTo(e.r,-e.r-18);ctx.lineTo(e.r,-e.r);ctx.fill();
   }
   ctx.fillStyle="#230e24";
   ctx.fillRect(-e.r*1.2,-e.r-48,e.r*2.4,9);
   ctx.fillStyle="#f4556b";
   ctx.fillRect(-e.r*1.2,-e.r-48,
     e.r*2.4*Math.max(0,e.hp/e.maxHp),9);
   ctx.restore();
 }
}

function draw(){
 ctx.clearRect(0,0,W,H);
 background();
 drawTarget();
 drawEnemies();

 if(player.invincible<=0||Math.floor(time*12)%2===0){
   person(player.x,player.y,"#6a84aa");
   ctx.fillStyle="#e7f1ff";
   ctx.fillRect(player.x+player.facing*24,
     player.y-30,6,50);
 }

 if(player.slashTime>0){
   ctx.strokeStyle="#d7edff";ctx.lineWidth=9;
   ctx.beginPath();
   ctx.arc(player.x+player.facing*20,player.y-7,
     60,Math.PI*1.65,Math.PI*.4);
   ctx.stroke();
 }

 if(player.shieldTime>0){
   ctx.strokeStyle="#ffdc70";ctx.lineWidth=5;
   ctx.beginPath();
   ctx.arc(player.x,player.y-12,42,0,Math.PI*2);ctx.stroke();
 }

 for(const p of shots){
   ctx.fillStyle=p.good?"#ffc35a":"#ab3be7";
   ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
 }

 for(const p of sparks){
   ctx.globalAlpha=clamp(p.life*2,0,1);
   ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,5,5);
 }
 ctx.globalAlpha=1;

 if(mode==="playing"&&step()?.type==="fight"){
   ctx.fillStyle="#080814df";ctx.fillRect(330,12,300,41);
   ctx.fillStyle="#f4d396";ctx.textAlign="center";
   ctx.font="bold 17px Arial";
   ctx.fillText(
     "Enemies Remaining: "+enemies.filter(e=>!e.dead).length,
     480,38
   );
   ctx.textAlign="left";
 }
}

function frame(stamp){
 const dt=Math.min((stamp-(last||stamp))/1000,.05);
 last=stamp;
 update(dt);draw();
 requestAnimationFrame(frame);
}

// ======================================
// CONTROLS AND MENU
// ======================================

window.addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 if([" ","arrowup","arrowdown","arrowleft","arrowright"].includes(k))
   e.preventDefault();
 keys[k]=true;
 if(e.repeat)return;

 if(mode==="scene"&&["enter"," "].includes(k)){
   nextSlide();return;
 }
 if(talking&&["e","enter"," "].includes(k)){
   nextDialogue();return;
 }
 if(k==="e")interact();
 if(k===" "||k==="j")sword();
 if(k==="m")golden();
 if(k==="n")shield();
 if(k==="k")flame();
});

window.addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
});
window.addEventListener("blur",()=>{
 for(const k in keys)keys[k]=false;
});

$("sword").onclick=sword;
$("gold").onclick=golden;
$("shield").onclick=shield;
$("fire").onclick=flame;

function savedChapter(){
 try{return clamp(Number(localStorage.getItem(SAVE)||0),0,7);}
 catch(e){return 0;}
}

function menu(){
 mode="menu";
 $("overlay").style.display="flex";
 $("hud").style.display="none";
 $("overlayLabel").textContent="THEDARKWITHIN — DLC I";
 $("overlayTitle").textContent="THE FORGOTTEN KING";
 $("overlayText").textContent=
   "Eight chapters. One fallen kingdom.\n"+
   "Discover the origin of the Purple King.\n"+
   "Featuring a royal 8-bit soundtrack!";
 $("continueButton").style.display="inline-block";
 $("newButton").style.display="inline-block";
 $("continueButton").textContent=
   savedChapter()>0?"CONTINUE — CHAPTER "+(savedChapter()+1):
   "BEGIN STORY";
}

$("continueButton").onclick=()=>{
 if(mode==="menu"||mode==="ending"){
   const index=mode==="ending"?0:savedChapter();
   Music.start();
   startChapter(index);
 }else if(mode==="scene"){
   nextSlide();
 }
};

$("newButton").onclick=()=>{
 if(!confirm("Start from Chapter 1? Your checkpoint will reset."))return;
 try{localStorage.removeItem(SAVE);}catch(e){}
 Music.start();
 startChapter(0);
};

menu();
requestAnimationFrame(frame);

})();
</script>


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>The Forgotten King — 2.5D Edition</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 color:#fff0dc;
 background:radial-gradient(ellipse at top,#392441,#090711 75%);
 font-family:Georgia,serif;
 min-height:100vh;
}
header{
 padding:17px 5%;
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:15px;
 flex-wrap:wrap;
 background:#120e1be8;
 border-bottom:1px solid #b48d67;
 box-shadow:0 8px 35px #0008;
}
header h1{
 margin:0;
 color:#ffe2a8;
 font-size:clamp(20px,4vw,34px);
 letter-spacing:2px;
}
a{color:#ffdaa0;text-decoration:none;font:13px Arial}
main{max-width:1130px;margin:24px auto;padding:0 14px}
.controls{
 display:flex;
 justify-content:center;
 align-items:center;
 flex-wrap:wrap;
 gap:10px;
 padding:13px;
 margin:12px 0;
 background:#201727d9;
 border:1px solid #8b6885;
 border-radius:12px;
}
button,select{
 cursor:pointer;
 border-radius:8px;
 border:1px solid #cb9d6f;
 background:linear-gradient(#60475d,#302238);
 color:#fff0d6;
 font-weight:bold;
 padding:12px 15px;
 font-family:Arial;
 transition:.2s;
}
button:hover{
 background:linear-gradient(#86617d,#4b3052);
 transform:translateY(-1px);
}
label{font:13px Arial}
#stage{
 position:relative;
 overflow:hidden;
 background:#0c0a19;
 border:2px solid #d2aa75;
 border-radius:10px;
 box-shadow:0 0 50px #b56dca27,0 25px 70px #0009;
}
canvas{
 display:block;
 width:100%;
 height:auto;
 image-rendering:auto;
}
#hud{
 position:absolute;
 top:12px;
 left:12px;
 z-index:3;
 display:none;
 padding:12px;
 background:#100c1cd9;
 border:1px solid #cda679;
 border-radius:10px;
 backdrop-filter:blur(10px);
 font:13px Arial;
 max-width:65%;
}
#hudTitle{color:#ffdda0;font-weight:bold}
#objective{margin:7px 0}
#health{
 background:#3b2537;
 width:185px;
 height:13px;
 border-radius:15px;
 overflow:hidden;
 border:1px solid #ae6e71;
}
#healthFill{
 background:linear-gradient(90deg,#f25273,#ffb781);
 height:100%;
 width:100%;
 transition:width .2s;
}
#bossHud{
 display:none;
 position:absolute;
 top:12px;
 right:12px;
 width:32%;
 z-index:3;
 background:#100c1cdd;
 border:1px solid #b77bd7;
 padding:12px;
 border-radius:10px;
 text-align:center;
 font:12px Arial;
}
#bossBar{
 height:13px;
 background:#2b1736;
 margin-top:8px;
 border-radius:10px;
 overflow:hidden;
}
#bossFill{
 width:100%;
 height:100%;
 background:linear-gradient(90deg,#963edf,#ff77bb);
}
#overlay{
 position:absolute;
 inset:0;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 text-align:center;
 z-index:10;
 padding:25px;
 background:radial-gradient(ellipse at center,#44284af1,#080711f9 80%);
 backdrop-filter:blur(7px);
}
#smallTitle{
 color:#dcb781;
 letter-spacing:3px;
 font:12px Arial;
}
#bigTitle{
 font-size:clamp(29px,5vw,59px);
 color:#ffe3ad;
 text-shadow:0 0 32px #f6b96d77;
 margin:17px 0;
}
#story{
 max-width:740px;
 white-space:pre-line;
 line-height:1.75;
 font-size:clamp(14px,2vw,19px);
}
#notice{
 display:none;
 position:absolute;
 bottom:20px;
 left:50%;
 transform:translateX(-50%);
 padding:11px 18px;
 background:#181024e8;
 border:1px solid #e5b77d;
 border-radius:7px;
 text-align:center;
 font:bold 13px Arial;
 z-index:5;
}
.help{
 text-align:center;
 color:#bcaebf;
 font:12px/2 Arial;
 margin:15px;
}
#stage:fullscreen{
 width:100vw;
 height:100vh;
 border:0;
 display:flex;
 align-items:center;
 background:#080710;
}
#stage:fullscreen canvas{
 width:100%;
 height:100%;
 object-fit:contain;
}
footer{
 text-align:center;
 color:#a797ad;
 font:12px Arial;
 padding:27px;
}
@media(max-width:650px){
 #hud{font-size:10px;padding:7px}
 #health{width:105px}
 #bossHud{font-size:9px;padding:7px}
 button{font-size:11px;padding:9px}
}
</style>
</head>
<body>

<header>
<h1>♛ THE FORGOTTEN KING</h1>
<a href="index.html">← BACK TO THE DARK WITHIN</a>
</header>

<main>

<div class="controls">
<label>DIFFICULTY
<select id="difficulty">
<option value="easy">Easy</option>
<option value="medium" selected>Medium</option>
<option value="hard">Hard</option>
<option value="extreme">Extreme</option>
</select>
</label>
<button id="fullButton">⛶ FULLSCREEN</button>
<button id="restartButton">↻ RESTART CHAPTER</button>
<button id="menuButton">☰ MENU</button>
</div>

<div id="stage">
<canvas id="canvas" width="960" height="540"></canvas>

<div id="hud">
<div id="hudTitle"></div>
<div id="objective"></div>
<div id="health"><div id="healthFill"></div></div>
</div>

<div id="bossHud">
<strong id="bossName">THE CORRUPTED KING</strong>
<div id="bossBar"><div id="bossFill"></div></div>
</div>

<div id="notice"></div>

<div id="overlay">
<div id="smallTitle">THEDARKWITHIN — DLC I</div>
<h2 id="bigTitle">THE FORGOTTEN KING</h2>
<p id="story"></p>
<div class="controls">
<button id="continueButton">BEGIN STORY</button>
<button id="newButton">NEW GAME</button>
</div>
</div>
</div>

<div class="controls">
<button id="swordButton">SPACE / J — SWORD</button>
<button id="goldButton">M — GOLDEN SLASH</button>
<button id="shieldButton">N — KING'S SHIELD</button>
<button id="flameButton">K — SACRED FLAME</button>
<button id="interactButton">E — INTERACT</button>
</div>

<div class="controls">
<button id="musicButton">♫ MUSIC: ON</button>
<label>VOLUME
<input id="volume" type="range" min="0" max="100" value="35">
</label>
</div>

<p class="help">
WASD / ARROWS — MOVE |
E — INTERACT |
SPACE / J — SWORD |
M — GOLDEN SLASH |
N — SHIELD |
K — SACRED FLAME
</p>

</main>

<footer>
THE FORGOTTEN KING — CINEMATIC 2.5D EDITION
</footer>

<script>
(()=>{
"use strict";

const $=id=>document.getElementById(id);
const canvas=$("canvas");
const ctx=canvas.getContext("2d");
ctx.imageSmoothingEnabled=true;

const W=960,H=540;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b,c,d)=>Math.hypot(a-c,b-d);
const keys={};
const SAVE="tdw-fk-25d-save";

const difficulties={
 easy:{hp:180,enemy:.65,damage:.5,speed:.8},
 medium:{hp:120,enemy:1,damage:1,speed:1},
 hard:{hp:85,enemy:1.5,damage:1.5,speed:1.2},
 extreme:{hp:60,enemy:2,damage:2.3,speed:1.45}
};

const chapters=[
{
 name:"The Golden Kingdom",
 theme:"kingdom",
 intro:[
 "NARRATOR: Hundreds of years before TheDarkWithin, King Aldric ruled a peaceful kingdom.",
 "SIR AERON: Your Majesty, strange discoveries have been reported beneath the castle.",
 "KING ALDRIC: Then we shall investigate them together."
 ],
 tasks:[
 ["Speak to the Royal Guard","talk","ROYAL GUARD: Miners have discovered an ancient chamber beneath the castle."],
 ["Speak to the Villager","talk","VILLAGER: My brother disappeared after seeing a strange purple crystal."],
 ["Report to King Aldric","talk","KING ALDRIC: This discovery could change our kingdom forever."]
 ],
 ending:"Deep beneath the golden kingdom, something ancient waits."
},
{
 name:"Beneath the Castle",
 theme:"mines",
 intro:[
 "NARRATOR: Aeron and Aldric descend into forgotten tunnels.",
 "SIR AERON: These tunnels were sealed centuries ago.",
 "KING ALDRIC: Something down here is calling to me."
 ],
 tasks:[
 ["Find the Injured Miner","talk","MINER: The crystal speaks! It knows the king's name!"],
 ["Examine the Purple Crystal","talk","BLACK SPIRIT: At last... the king has come."],
 ["Warn King Aldric","talk","SIR AERON: Your Majesty, we must destroy this crystal!"],
 ["Confront the Crystal Guardians","fight",3,"spirit"]
 ],
 ending:"King Aldric reaches toward the crystal, and purple light consumes the chamber."
},
{
 name:"The King's Secret",
 theme:"castle",
 intro:[
 "NARRATOR: King Aldric has begun to change.",
 "ROYAL STEWARD: His Majesty spends every night speaking to an unseen voice.",
 "SIR AERON: I will discover the truth."
 ],
 tasks:[
 ["Question the Royal Steward","talk","STEWARD: The king has forbidden anyone from entering his chambers."],
 ["Read the Forbidden Journal","talk","JOURNAL: The crystal contains an entity called the Black Spirit."],
 ["Confront King Aldric","talk","KING ALDRIC: You question my loyalty to this kingdom? Leave!"],
 ["Defeat the Corrupted Guards","fight",4,"guard"]
 ],
 ending:"Aeron learns that the Black Spirit is slowly taking control of his oldest friend."
},
{
 name:"The Corrupted Guard",
 theme:"corrupted",
 intro:[
 "NARRATOR: The king orders innocent villagers imprisoned.",
 "SIR AERON: I will not harm the people I swore to protect.",
 "CAPTAIN ROWAN: Then we must stand against the corrupted guards."
 ],
 tasks:[
 ["Speak to Captain Rowan","talk","CAPTAIN ROWAN: The soldiers are not themselves!"],
 ["Defend the Courtyard","fight",5,"guard"],
 ["Defeat the Corrupted Captain","fight",1,"captain"]
 ],
 ending:"The corrupted guards fall. Smoke rises from the eastern village."
},
{
 name:"The Fallen Village",
 theme:"village",
 intro:[
 "NARRATOR: The eastern village burns beneath a blood-red sky.",
 "VILLAGE ELDER: Our families are trapped!",
 "SIR AERON: I will clear a path."
 ],
 tasks:[
 ["Find the Village Elder","talk","VILLAGE ELDER: Please save our people!"],
 ["Protect the Villagers","fight",5,"beast"],
 ["Rescue the Survivors","talk","SURVIVOR: Thank you, Sir Aeron!"],
 ["Defeat the Shadow Beast","fight",1,"beastBoss"]
 ],
 ending:"The villagers survive, but Aeron knows the king must be stopped."
},
{
 name:"The Forbidden Ritual",
 theme:"ritual",
 intro:[
 "NARRATOR: An ancient altar reveals the Black Spirit's true intentions.",
 "BLACK SPIRIT: Your king desired immortality. I merely gave him what he wanted.",
 "SIR AERON: You deceived him!"
 ],
 tasks:[
 ["Examine the Ancient Altar","talk","BLACK SPIRIT: Nothing can undo the king's choice."],
 ["Destroy the Ritual Guardians","fight",5,"spirit"],
 ["Defeat the Shadow Herald","fight",1,"herald"]
 ],
 ending:"The ritual is broken, but Aldric's transformation is almost complete."
},
{
 name:"The Last Loyal Knight",
 theme:"ruins",
 intro:[
 "NARRATOR: The castle falls into ruin.",
 "CAPTAIN ROWAN: The throne room is almost unreachable!",
 "SIR AERON: I made a promise to protect my king. Now I must protect the world."
 ],
 tasks:[
 ["Speak to Captain Rowan","talk","CAPTAIN ROWAN: This may be our final battle."],
 ["Break Through the Royal Guard","fight",6,"guard"],
 ["Defeat the Throne Guardian","fight",1,"guardian"],
 ["Open the Throne Room","talk","BLACK SPIRIT: Your loyalty will destroy you."]
 ],
 ending:"Aeron stands before the final door. Beyond it, his friend awaits."
},
{
 name:"Birth of the Purple King",
 theme:"final",
 intro:[
 "NARRATOR: The ruined throne room trembles beneath an unnatural eclipse.",
 "KING ALDRIC: Join me, Aeron. Together we can save everyone.",
 "SIR AERON: I came to save you, not serve the darkness.",
 "KING ALDRIC: Then you leave me no choice."
 ],
 tasks:[
 ["Confront King Aldric","talk","SIR AERON: Forgive me, old friend."],
 ["Defeat King Aldric","fight",1,"aldric"],
 ["Defeat the Purple King","fight",1,"purpleKing"]
 ],
 ending:"The kingdom is lost. The Purple King is born. Centuries later, TheDarkWithin will begin."
}
];

const palettes={
 kingdom:["#e4a97a","#ad7593","#403052","#ffe0a2"],
 mines:["#4b365d","#22213c","#101323","#cc91ff"],
 castle:["#a28ca8","#504567","#201a31","#f4c885"],
 corrupted:["#91426a","#47244b","#1b112c","#ea79f7"],
 village:["#e49b67","#88516a","#382439","#ffc58a"],
 ritual:["#684280","#30203f","#160e27","#e27bff"],
 ruins:["#ba6d72","#593747","#271a2d","#ffb09a"],
 final:["#674581","#351f4e","#140d23","#f19aff"]
};

let chapter=0;
let stage=0;
let mode="menu";
let difficulty="medium";
let time=0;
let previousTime=0;
let storyLines=[];
let storyIndex=0;
let onSceneEnd=null;
let enemies=[];
let projectiles=[];
let particles=[];
let noticeTime=0;
let battleStarted=false;

const player={
 x:480,y:420,r:17,
 dir:1,hp:120,maxHp:120,
 swordCd:0,goldCd:0,
 shieldCd:0,shield:0,
 flameCd:0,slash:0,
 inv:0
};

function save(){
 try{
 const old=Number(localStorage.getItem(SAVE)||0);
 localStorage.setItem(SAVE,String(Math.max(chapter,old)));
 }catch(e){}
}

function progress(){
 try{
 return clamp(Number(localStorage.getItem(SAVE)||0),0,7);
 }catch(e){return 0;}
}

function notify(msg,duration=1.7){
 $("notice").textContent=msg;
 $("notice").style.display="block";
 noticeTime=duration;
}

function showScreen(label,title,text,button,action,secondary){
 mode="scene";
 $("overlay").style.display="flex";
 $("smallTitle").textContent=label;
 $("bigTitle").textContent=title;
 $("story").textContent=text;
 $("continueButton").textContent=button;
 $("continueButton").onclick=action;
 $("newButton").style.display=secondary?"inline-block":"none";
 $("hud").style.display="none";
 $("bossHud").style.display="none";
}

function cutscene(lines,done,title){
 storyLines=lines;
 storyIndex=0;
 onSceneEnd=done;
 function next(){
  if(storyIndex>=storyLines.length){
   $("overlay").style.display="none";
   $("hud").style.display="block";
   mode="playing";
   const cb=onSceneEnd;
   onSceneEnd=null;
   if(cb)cb();
   return;
  }
  const line=storyLines[storyIndex++];
  showScreen(
   "STORY CUTSCENE",
   title||chapters[chapter].name,
   line,
   storyIndex===storyLines.length?"CONTINUE":"NEXT →",
   next
  );
 }
 next();
}

function menu(){
 mode="menu";
 $("overlay").style.display="flex";
 $("smallTitle").textContent="THEDARKWITHIN — DLC I";
 $("bigTitle").textContent="THE FORGOTTEN KING";
 $("story").textContent=
 "Hundreds of years before TheDarkWithin, "+
 "a loyal knight attempts to save his kingdom from an ancient darkness.\n\n"+
 "Eight chapters • 2.5D environments • Cinematic battles • Royal soundtrack";
 $("continueButton").textContent=progress()?
 "CONTINUE — CHAPTER "+(progress()+1):"BEGIN STORY";
 $("continueButton").onclick=()=>{
  Music.start();
  startChapter(progress());
 };
 $("newButton").style.display="inline-block";
 $("newButton").onclick=()=>{
  if(!confirm("Begin again from Chapter 1?"))return;
  try{localStorage.removeItem(SAVE);}catch(e){}
  Music.start();
  startChapter(0);
 };
 $("hud").style.display="none";
 $("bossHud").style.display="none";
}

function startChapter(n){
 chapter=n;
 stage=0;
 enemies=[];
 projectiles=[];
 particles=[];
 battleStarted=false;
 const d=difficulties[difficulty];
 Object.assign(player,{
  x:480,y:420,dir:1,
  hp:d.hp,maxHp:d.hp,
  swordCd:0,goldCd:0,
  shieldCd:0,shield:0,
  flameCd:0,slash:0,inv:1
 });
 save();
 Music.reset();
 cutscene(
  chapters[n].intro,
  beginTask,
  "CHAPTER "+(n+1)+": "+chapters[n].name
 );
}

function currentTask(){
 return chapters[chapter].tasks[stage];
}

function beginTask(){
 battleStarted=false;
 const task=currentTask();
 if(task&&task[1]==="fight")spawnEnemies(task);
 updateHUD();
}

function nextTask(){
 stage++;
 if(stage>=chapters[chapter].tasks.length){
  finishChapter();
 }else{
  beginTask();
 }
}

function finishChapter(){
 cutscene([
  "CHAPTER "+(chapter+1)+" COMPLETE",
  chapters[chapter].ending
 ],()=>{
  if(chapter<7)startChapter(chapter+1);
  else victory();
 },"THE FORGOTTEN KING");
}

function victory(){
 showScreen(
  "THE FORGOTTEN KING — FINALE",
  "THE END",
  "King Aldric has fallen.\n"+
  "The Black Spirit survives beneath the ruins.\n"+
  "The kingdom is forgotten, but its darkness will return.\n\n"+
  "THANK YOU FOR PLAYING THE FORGOTTEN KING.",
  "RETURN TO MENU",
  menu
 );
}

function interact(){
 if(mode!=="playing")return;
 const task=currentTask();
 if(task&&task[1]==="talk"){
  cutscene([task[2]],nextTask,task[0]);
 }
}

function updateHUD(){
 $("hudTitle").textContent=
 "CHAPTER "+(chapter+1)+" — "+chapters[chapter].name;
 const task=currentTask();
 $("objective").textContent=task?
 "OBJECTIVE: "+task[0]:"CHAPTER COMPLETE";
 $("healthFill").style.width=
 clamp(player.hp/player.maxHp*100,0,100)+"%";
}

function burst(x,y,color,count=14){
 for(let i=0;i<count;i++){
  const a=Math.random()*Math.PI*2;
  const speed=35+Math.random()*165;
  particles.push({
   x,y,vx:Math.cos(a)*speed,
   vy:Math.sin(a)*speed,
   life:.3+Math.random()*.5,color,
   size:2+Math.random()*4
  });
 }
}

const enemyTypes={
 guard:[80,11,75,22,"#936ab4"],
 captain:[300,18,80,32,"#a858d4"],
 beast:[105,13,100,25,"#954f96"],
 beastBoss:[420,22,75,42,"#b64d9a"],
 spirit:[115,15,95,24,"#b05fe6"],
 herald:[480,22,85,40,"#c363ef"],
 guardian:[590,26,85,43,"#9b82bc"],
 aldric:[750,24,95,45,"#d1a2df"],
 purpleKing:[1350,30,90,62,"#963fdf"]
};

function spawnEnemies(task){
 enemies=[];
 projectiles=[];
 battleStarted=true;
 const type=task[3];
 const data=enemyTypes[type];
 const d=difficulties[difficulty];

 for(let i=0;i<task[2];i++){
  const angle=2*Math.PI*i/task[2];
  const boss=task[2]===1;
  const hp=data[0]*d.enemy;
  enemies.push({
   x:boss?480:480+250*Math.cos(angle),
   y:boss?230:290+110*Math.sin(angle),
   vx:0,
   hp,maxHp:hp,
   damage:data[1]*d.damage,
   speed:data[2]*d.speed,
   r:data[3],color:data[4],
   type,flash:0,
   attack:1,shoot:1.5,
   dead:false
  });
 }

 if(task[3]==="purpleKing"){
  cutscene([
   "BLACK SPIRIT: Your friend is gone. Behold the Purple King!",
   "SIR AERON: Aldric... I am sorry.",
   "THE PURPLE KING: THE KINGDOM IS MINE FOREVER!"
  ],()=>{},"THE FINAL TRANSFORMATION");
 }
}

function hurtEnemy(e,dmg){
 if(e.dead)return;
 e.hp-=dmg;
 e.flash=.15;
 burst(e.x,e.y,"#ffe3b1",8);
 if(e.hp<=0){
  e.dead=true;
  burst(e.x,e.y,e.color,40);
 }
}

function hurtPlayer(dmg){
 if(player.inv>0||player.shield>0||mode!=="playing")return;
 player.hp-=dmg;
 player.inv=.8;
 burst(player.x,player.y,"#ff8198",15);
 if(player.hp<=0){
  cutscene([
   "SIR AERON: I cannot fall... not while the kingdom needs me.",
   "NARRATOR: The loyal knight rises to fight once more."
  ],()=>{
   player.hp=player.maxHp;
   player.inv=2;
   player.x=480;
   player.y=420;
   if(currentTask()?.[1]==="fight")spawnEnemies(currentTask());
  },"YOU HAVE FALLEN");
 }
}

function sword(){
 if(mode!=="playing"||player.swordCd>0)return;
 player.swordCd=.36;
 player.slash=.23;
 burst(player.x+player.dir*45,player.y-10,"#f2efff",18);
 for(const e of enemies){
  if(!e.dead&&
    dist(player.x,player.y,e.x,e.y)<105+e.r&&
    (e.x-player.x)*player.dir>-35){
   hurtEnemy(e,37);
  }
 }
 checkBattle();
}

function goldenSlash(){
 if(mode!=="playing"||player.goldCd>0)return;
 player.goldCd=2.5;
 burst(player.x,player.y,"#ffdc85",55);
 for(const e of enemies){
  if(!e.dead&&dist(player.x,player.y,e.x,e.y)<180+e.r){
   hurtEnemy(e,95);
  }
 }
 notify("GOLDEN SLASH!");
 checkBattle();
}

function kingsShield(){
 if(mode!=="playing"||player.shieldCd>0)return;
 player.shieldCd=5;
 player.shield=2.3;
 burst(player.x,player.y,"#ffe0a0",35);
 notify("KING'S SHIELD!");
}

function sacredFlame(){
 if(mode!=="playing"||player.flameCd>0)return;
 player.flameCd=1.25;
 projectiles.push({
  x:player.x+player.dir*25,
  y:player.y-16,
  vx:player.dir*550,vy:0,
  r:15,damage:85,life:2,
  good:true
 });
 burst(player.x,player.y,"#ffb66b",15);
}

function checkBattle(){
 if(mode!=="playing")return;
 const task=currentTask();
 if(!task||task[1]!=="fight")return;
 if(enemies.some(e=>!e.dead))return;
 if(!battleStarted)return;
 battleStarted=false;
 if(task[3]==="aldric"){
  cutscene([
   "NARRATOR: King Aldric collapses to his knees.",
   "SIR AERON: It is over. Please come back.",
   "BLACK SPIRIT: FOOLISH KNIGHT! THE KING HAS ONLY JUST BEGUN!",
   "NARRATOR: Purple fire engulfs Aldric's crown."
  ],nextTask,"THE KING'S TRANSFORMATION");
 }else nextTask();
}

function update(dt){
 time+=dt;

 if(noticeTime>0){
  noticeTime-=dt;
  if(noticeTime<=0)$("notice").style.display="none";
 }

 for(let i=particles.length-1;i>=0;i--){
  const p=particles[i];
  p.x+=p.vx*dt;
  p.y+=p.vy*dt;
  p.life-=dt;
  if(p.life<=0)particles.splice(i,1);
 }

 if(mode!=="playing")return;

 for(const k of ["swordCd","goldCd","shieldCd","shield","flameCd","slash","inv"]){
  player[k]=Math.max(0,player[k]-dt);
 }

 let mx=Number(!!(keys.d||keys.arrowright))-
        Number(!!(keys.a||keys.arrowleft));
 let my=Number(!!(keys.s||keys.arrowdown))-
        Number(!!(keys.w||keys.arrowup));
 const len=Math.hypot(mx,my);

 if(len){
  mx/=len;
  my/=len;
  player.x+=mx*205*dt;
  player.y+=my*205*dt;
  if(mx)player.dir=mx>0?1:-1;
 }

 player.x=clamp(player.x,30,930);
 player.y=clamp(player.y,220,495);

 if(currentTask()?.[1]==="fight"){
  for(const e of enemies){
   if(e.dead)continue;

   e.attack-=dt;
   e.shoot-=dt;
   e.flash=Math.max(0,e.flash-dt);

   const dx=player.x-e.x;
   const dy=player.y-e.y;
   const d=Math.hypot(dx,dy)||1;

   if(d>player.r+e.r+6){
    e.x+=dx/d*e.speed*dt;
    e.y+=dy/d*e.speed*dt;
   }else if(e.attack<=0){
    hurtPlayer(e.damage);
    e.attack=1.2;
   }

   if(mode!=="playing")break;

   if(e.r>=30&&e.shoot<=0){
    projectiles.push({
     x:e.x,y:e.y,
     vx:dx/d*235,
     vy:dy/d*235,
     r:12,damage:e.damage,
     life:3,good:false
    });
    e.shoot=1.6;
   }
  }
 }

 for(let i=projectiles.length-1;i>=0;i--){
  const p=projectiles[i];

  p.x+=p.vx*dt;
  p.y+=p.vy*dt;
  p.life-=dt;
  let hit=false;

  if(p.good){
   for(const e of enemies){
    if(!e.dead&&dist(p.x,p.y,e.x,e.y)<p.r+e.r){
     hurtEnemy(e,p.damage);
     hit=true;
     break;
    }
   }
  }else if(dist(p.x,p.y,player.x,player.y)<p.r+player.r){
   hurtPlayer(p.damage);
   hit=true;
  }

  if(hit||p.life<=0||
    p.x<0||p.x>W||p.y<0||p.y>H){
   projectiles.splice(i,1);
  }
 }

 checkBattle();
 updateHUD();

 const boss=enemies.find(e=>!e.dead&&e.r>=32);
 $("bossHud").style.display=boss?"block":"none";
 if(boss){
  $("bossName").textContent=boss.type.toUpperCase();
  $("bossFill").style.width=
   Math.max(0,boss.hp/boss.maxHp*100)+"%";
 }
}

/* ROYAL SOUNDTRACK */

const Music=(()=>{
 let audio,master,timer;
 let enabled=true;
 let volume=.35;
 let current=-1;
 let cursor=0;
 let next=0;

 const melodies=[
  [60,64,67,72,67,64,62,67],
  [60,59,55,62,60,55,58,54],
  [64,62,60,55,59,60,62,60],
  [57,60,62,64,62,60,57,55],
  [62,65,69,67,65,62,60,57],
  [60,63,66,67,66,63,59,55],
  [57,60,64,69,67,64,62,60],
  [72,67,64,67,69,67,64,62]
 ];

 function tone(note,at,length,bass=false){
  if(!audio||!enabled)return;

  const o=audio.createOscillator();
  const g=audio.createGain();
  const filter=audio.createBiquadFilter();

  o.type=bass?"triangle":"sawtooth";
  o.frequency.value=440*Math.pow(2,(note-69)/12);

  filter.type="lowpass";
  filter.frequency.value=bass?480:1400;

  g.gain.setValueAtTime(.0001,at);
  g.gain.linearRampToValueAtTime(bass?.13:.075,at+.025);
  g.gain.exponentialRampToValueAtTime(.0001,at+length);

  o.connect(filter);
  filter.connect(g);
  g.connect(master);
  o.start(at);
  o.stop(at+length+.02);
 }

 function tick(){
  if(!audio||audio.state!=="running"||!enabled)return;

  if(current!==chapter){
   current=chapter;
   cursor=0;
   next=audio.currentTime+.04;
  }

  const beat=30/(105+chapter*8);
  const notes=melodies[chapter];

  while(next<audio.currentTime+.16){
   const i=cursor%8;
   tone(notes[i],next,beat*.85);
   if(i%2===0){
    tone(notes[i]-24,next,beat*1.8,true);
   }
   cursor++;
   next+=beat;
  }
 }

 async function start(){
  try{
   if(!audio){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    audio=new AC();
    master=audio.createGain();
    master.gain.value=volume*.5;
    master.connect(audio.destination);
   }
   await audio.resume();
   if(!timer)timer=setInterval(tick,55);
  }catch(e){}
 }

 function toggle(){
  enabled=!enabled;
  $("musicButton").textContent=
   enabled?"♫ MUSIC: ON":"♫ MUSIC: OFF";
  if(master&&audio){
   master.gain.setTargetAtTime(
    enabled?volume*.5:0,
    audio.currentTime,.03
   );
  }
  if(enabled)start();
 }

 function changeVolume(v){
  volume=Number(v)/100;
  if(master&&audio){
   master.gain.setTargetAtTime(
    enabled?volume*.5:0,
    audio.currentTime,.03
   );
  }
 }

 return{
  start,toggle,changeVolume,
  reset:()=>{current=-1;}
 };
})();

});

window.addEventListener("blur",()=>{
 for(const k in keys)keys[k]=false;
});

$("swordButton").onclick=sword;
$("goldButton").onclick=goldenSlash;
$("shieldButton").onclick=kingsShield;
$("flameButton").onclick=sacredFlame;
$("interactButton").onclick=interact;

$("musicButton").onclick=Music.toggle;
$("volume").oninput=e=>Music.changeVolume(e.target.value);

$("difficulty").onchange=e=>{
 difficulty=e.target.value;
 if(mode==="playing")startChapter(chapter);
};

$("restartButton").onclick=()=>{
 if(mode==="playing"||mode==="scene")startChapter(chapter);
};

$("menuButton").onclick=menu;

$("fullButton").onclick=async()=>{
 try{
  if(document.fullscreenElement){
   await document.exitFullscreen();
  }else{
   await $("stage").requestFullscreen();
  }
 }catch(e){
  alert("Fullscreen is unavailable.");
 }
};

menu();
requestAnimationFrame(frame);

})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Forgotten King — Reforged</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top, #2d1d38 0%, #0b0810 70%);
      color: #f7ecd9;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      padding: 18px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      border-bottom: 1px solid rgba(255, 207, 138, 0.22);
      background: linear-gradient(180deg, rgba(34, 21, 41, 0.95), rgba(17, 12, 22, 0.92));
      box-shadow: 0 12px 40px rgba(0,0,0,0.35);
    }

    .logo {
      font-size: clamp(24px, 4vw, 38px);
      font-weight: 900;
      letter-spacing: 2px;
      color: #ffe4ad;
      text-shadow: 0 0 16px rgba(255, 212, 133, 0.16);
    }

    .logo span {
      color: #c9a3ff;
    }

    a.back-link {
      color: #ffe3b5;
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 208, 134, 0.28);
      background: rgba(255,255,255,0.04);
      font-weight: bold;
    }

    main {
      width: min(1180px, calc(100% - 20px));
      margin: 18px auto 30px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .top-panel, .bottom-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: center;
      padding: 12px;
      border: 1px solid rgba(255, 208, 137, 0.18);
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(38,25,48,0.88), rgba(21,15,29,0.92));
      box-shadow: 0 12px 30px rgba(0,0,0,0.18);
    }

    button, select {
      padding: 10px 13px;
      border-radius: 10px;
      border: 1px solid rgba(255, 208, 137, 0.32);
      background: linear-gradient(180deg, #5d4062, #2c2235);
      color: #fff3dd;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover, select:hover {
      filter: brightness(1.1);
    }

    #stage {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid rgba(255, 208, 137, 0.38);
      box-shadow:
        0 24px 80px rgba(0,0,0,0.4),
        0 0 80px rgba(198, 162, 255, 0.08);
      background: #09070d;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #0d0b11;
    }

    #overlay {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
      background:
        radial-gradient(circle at center, rgba(78, 48, 83, 0.75), rgba(8,7,12,0.95));
      backdrop-filter: blur(6px);
    }

    #overlayTag {
      font-size: 12px;
      letter-spacing: 3px;
      color: #f7cb86;
      margin-bottom: 8px;
    }

    #overlayTitle {
      margin: 8px 0 12px;
      font-size: clamp(28px, 5vw, 60px);
      line-height: 1;
      font-weight: 900;
      color: #ffe0a9;
      text-shadow: 0 0 24px rgba(255, 203, 108, 0.18);
    }

    #overlayText {
      max-width: 760px;
      line-height: 1.8;
      font-size: clamp(14px, 2vw, 19px);
      white-space: pre-line;
      color: #f8eedf;
    }

    #overlayButtons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 18px;
    }

    #hud {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 10;
      min-width: 300px;
      max-width: calc(100% - 28px);
      padding: 12px;
      background: rgba(17, 12, 23, 0.78);
      border: 1px solid rgba(255, 211, 145, 0.18);
      border-radius: 12px;
      backdrop-filter: blur(6px);
      display: none;
    }

    #bossHud {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 10;
      min-width: 260px;
      padding: 12px;
      text-align: center;
      background: rgba(17, 12, 23, 0.82);
      border: 1px solid rgba(201, 163, 255, 0.25);
      border-radius: 12px;
      backdrop-filter: blur(6px);
      display: none;
    }

    .bar-bg {
      width: 100%;
      height: 12px;
      background: rgba(255,255,255,0.09);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 8px;
    }

    .bar-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #f26c7c, #ffcf8b);
      border-radius: 999px;
    }

    .boss-fill {
      background: linear-gradient(90deg, #a46dff, #f8be77);
    }

    #notice {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 11;
      padding: 10px 14px;
      border-radius: 10px;
      background: rgba(20, 14, 28, 0.88);
      border: 1px solid rgba(255, 211, 145, 0.25);
      font-weight: bold;
      display: none;
      text-align: center;
      pointer-events: none;
    }

    .controls {
      font-size: 12px;
      color: #ccbdb0;
      text-align: center;
      line-height: 1.9;
      padding-bottom: 6px;
    }

    #stage:fullscreen {
      width: 100vw;
      height: 100vh;
      border-radius: 0;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #07050b;
    }

    #stage:fullscreen canvas {
      width: 100%;
      height: auto;
      max-height: 100vh;
      object-fit: contain;
    }

    footer {
      margin-top: auto;
      text-align: center;
      padding: 22px 14px 28px;
      color: #9e8d8d;
      font-size: 12px;
      letter-spacing: 1px;
    }

    @media (max-width: 760px) {
      #hud, #bossHud {
        font-size: 11px;
      }
      .controls {
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">THE <span>FORGOTTEN</span> KING</div>
    <a class="back-link" href="index.html">← BACK TO LAUNCHER</a>
  </header>

  <main>
    <div class="top-panel">
      <label>
        DIFFICULTY
        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
          <option value="extreme">Extreme</option>
        </select>
      </label>
      <button id="fullscreenBtn">⛶ FULLSCREEN</button>
      <button id="restartBtn">↻ RESTART CHAPTER</button>
      <button id="menuBtn">☰ MENU</button>
      <button id="musicBtn">♫ MUSIC ON</button>
    </div>

    <div id="stage">
      <canvas id="game" width="960" height="540"></canvas>

      <div id="hud">
        <div id="chapterLabel"></div>
        <div id="objectiveLabel" style="margin-top:4px;color:#d9c9bf;"></div>
        <div id="statusLabel" style="margin-top:6px;color:#ffe7c0;"></div>
        <div class="bar-bg">
          <div class="bar-fill" id="hpFill"></div>
        </div>
      </div>

      <div id="bossHud">
        <div style="font-weight:bold;color:#ead0ff;">THE FORGOTTEN KING</div>
        <div id="bossPhase" style="margin-top:5px;color:#f6dfbf;"></div>
        <div class="bar-bg">
          <div class="bar-fill boss-fill" id="bossFill"></div>
        </div>
      </div>

      <div id="notice"></div>

      <div id="overlay">
        <div id="overlayTag">THEDARKWITHIN — PREQUEL DLC</div>
        <div id="overlayTitle">THE FORGOTTEN KING</div>
        <div id="overlayText"></div>
        <div id="overlayButtons">
          <button id="overlayPrimary">BEGIN STORY</button>
          <button id="overlaySecondary">NEW GAME</button>
        </div>
      </div>
    </div>

    <div class="bottom-panel">
      <button id="jumpBtn">SPACE — JUMP</button>
      <button id="swordBtn">J — ROYAL BLADE</button>
      <button id="burstBtn">K — CRYSTAL BURST</button>
      <button id="dashBtn">SHIFT — KING'S DASH</button>
      <button id="guardBtn">N — ROYAL GUARD</button>
    </div>

    <div class="controls">
      A / D OR ← / → MOVE • SPACE JUMP • J SWORD • K CRYSTAL BURST •
      SHIFT DASH • N GUARD • ENTER / CLICK ADVANCE CUTSCENE
    </div>
  </main>

  <footer>THEDARKWITHIN © 2026 — THE FORGOTTEN KING: REFORGED</footer>

  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      ctx.imageSmoothingEnabled = true;

      const W = canvas.width;
      const H = canvas.height;
      const TAU = Math.PI * 2;

      const $ = id => document.getElementById(id);
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
      const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
      const rand = (a, b) => a + Math.random() * (b - a);

      const keys = {};
      const SAVE_KEY = "tdw-forgotten-king-progress";

      const difficulties = {
        easy:    { hp: 170, enemyHp: 0.8, enemyDmg: 0.65, speed: 1.0 },
        medium:  { hp: 130, enemyHp: 1.0, enemyDmg: 1.0, speed: 1.0 },
        hard:    { hp: 105, enemyHp: 1.32, enemyDmg: 1.35, speed: 1.08 },
        extreme: { hp: 90,  enemyHp: 1.65, enemyDmg: 1.75, speed: 1.15 }
      };

      const chapters = [
        {
          name: "A Crown Before the Fall",
          objective: "Defeat the invaders in the royal courtyard.",
          intro: [
            "NARRATOR: Hundreds of years before TheDarkWithin, the kingdom still stood in gold and light.",
            "GENERAL: Your Majesty, the outer walls are under attack.",
            "KING ALDRIC: Then we will meet them blade to blade.",
            "NARRATOR: The last age of the kingdom begins with steel, banners, and flame."
          ],
          outro: "The courtyard is saved, but the invaders were only the beginning."
        },
        {
          name: "The Crystal Crypts",
          objective: "Purge the corrupted crystal caverns below the castle.",
          intro: [
            "NARRATOR: Beneath the palace, purple crystal veins begin to pulse with strange life.",
            "KING ALDRIC: This corruption was buried long before my reign.",
            "ADVISOR: Then something has awakened it."
          ],
          outro: "The crystals whisper of a greater ruin waiting deeper below."
        },
        {
          name: "Siege of the Ramparts",
          objective: "Drive the corrupted knights from the high ramparts.",
          intro: [
            "NARRATOR: The corruption spreads to the ramparts, bending loyal soldiers into crystal husks.",
            "KING ALDRIC: Then I will free them, even if I must strike them down."
          ],
          outro: "The walls hold, but the sky above the kingdom has darkened."
        },
        {
          name: "The Shattered Archives",
          objective: "Recover the royal seal and survive the haunted library.",
          intro: [
            "NARRATOR: The royal archives collapse into a maze of broken marble and magic.",
            "SPIRIT SCHOLAR: The kingdom cannot survive unless you reclaim the seal.",
            "KING ALDRIC: Then lead me to it."
          ],
          outro: "The royal seal answers the king — but so does the crystal."
        },
        {
          name: "The Inner Keep",
          objective: "Reach the throne sanctum and break the siege.",
          intro: [
            "NARRATOR: The final defenders fall back to the inner keep.",
            "GENERAL: Sire, the throne chamber is nearly lost.",
            "KING ALDRIC: Then we make our last stand there."
          ],
          outro: "At the heart of the keep, the crystal answers with a terrible kingly shadow."
        },
        {
          name: "The Forgotten King",
          objective: "Defeat the crystal-cursed Forgotten King.",
          intro: [
            "NARRATOR: In the throne sanctum, the old king stands transformed by crystal power.",
            "FORGOTTEN KING: I protected this kingdom once. Now I will preserve it forever.",
            "KING ALDRIC: Not as a prison of crystal and ruin.",
            "FORGOTTEN KING: THEN COME, HEIR OF A DYING CROWN."
          ],
          outro: ""
        }
      ];

      let chapterIndex = 0;
      let difficulty = "medium";
      let mode = "menu"; // menu, scene, playing, ending
      let overlayPrimaryAction = null;
      let overlaySecondaryAction = null;
      let noticeTimer = 0;
      let noticeText = "";
      let time = 0;
      let lastFrame = 0;
      let camera = 0;
      let worldWidth = 2400;
      let cleared = false;
      let musicEnabled = true;

      let platforms = [];
      let enemies = [];
      let particles = [];
      let projectiles = [];
      let banners = [];
      let boss = null;

      const player = {
        x: 140,
        y: 410,
        w: 34,
        h: 60,
        vx: 0,
        vy: 0,
        dir: 1,
        hp: 130,
        maxHp: 130,
        grounded: false,
        jumpCount: 0,
        attackCd: 0,
        burstCd: 0,
        dashCd: 0,
        guardCd: 0,
        dashTimer: 0,
        guardTimer: 0,
        inv: 0,
        attackSwing: 0
      };

      const synth = (() => {
        let audio, master, timer;
        let beatIndex = 0;
        let chapterMusic = 0;
        let nextTime = 0;

        const melodies = [
          [64,67,71,72,71,67,64,62],
          [62,66,69,71,69,66,62,59],
          [67,71,74,76,74,71,67,64],
          [65,69,72,74,72,69,65,62],
          [60,64,67,72,67,64,60,57],
          [62,69,74,77,74,69,65,62]
        ];

        function midiToFreq(n){
          return 440 * Math.pow(2, (n - 69) / 12);
        }

        function playNote(note, when, length, type="sawtooth", gainValue=0.04){
          if(!audio || !master || !musicEnabled) return;
          if(!note) return;

          const o = audio.createOscillator();
          const g = audio.createGain();

          o.type = type;
          o.frequency.value = midiToFreq(note);

          g.gain.setValueAtTime(0.0001, when);
          g.gain.linearRampToValueAtTime(gainValue, when + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, when + length);

          o.connect(g);
          g.connect(master);
          o.start(when);
          o.stop(when + length + 0.02);
        }

        function tick(){
          if(!audio || audio.state !== "running" || !musicEnabled) return;
          const melody = melodies[chapterMusic % melodies.length];
          const beat = 0.22;

          while(nextTime < audio.currentTime + 0.18){
            const idx = beatIndex % melody.length;
            const n = melody[idx];
            playNote(n, nextTime, beat * 0.9, "sawtooth", 0.035);
            if(idx % 2 === 0){
              playNote(n - 12, nextTime, beat * 0.8, "triangle", 0.025);
            }
            if(idx % 4 === 0){
              playNote(36, nextTime, 0.08, "square", 0.018);
            }
            nextTime += beat;
            beatIndex++;
          }
        }

        async function start(){
          try{
            if(!audio){
              const AC = window.AudioContext || window.webkitAudioContext;
              if(!AC) return;
              audio = new AC();
              master = audio.createGain();
              master.gain.value = 0.55;
              master.connect(audio.destination);
            }
            await audio.resume();
            if(!timer){
              nextTime = audio.currentTime + 0.06;
              timer = setInterval(tick, 60);
            }
          }catch(err){}
        }

        function toggle(){
          musicEnabled = !musicEnabled;
          $("musicBtn").textContent = musicEnabled ? "♫ MUSIC ON" : "♫ MUSIC OFF";
          if(master && audio){
            master.gain.setTargetAtTime(musicEnabled ? 0.55 : 0.0, audio.currentTime, 0.05);
          }
          if(musicEnabled) start();
        }

        function setChapter(n){
          chapterMusic = n;
          beatIndex = 0;
          if(audio) nextTime = audio.currentTime + 0.08;
        }

        return { start, toggle, setChapter };
      })();

      function saveProgress(){
        try{
          localStorage.setItem(SAVE_KEY, String(Math.max(chapterIndex, Number(localStorage.getItem(SAVE_KEY) || 0))));
        }catch(err){}
      }

      function getProgress(){
        try{
          return clamp(Number(localStorage.getItem(SAVE_KEY) || 0), 0, chapters.length - 1);
        }catch(err){
          return 0;
        }
      }

      function showOverlay(tag, title, text, primaryText, primaryAction, secondaryText, secondaryAction){
        $("overlay").style.display = "flex";
        $("overlayTag").textContent = tag;
        $("overlayTitle").textContent = title;
        $("overlayText").textContent = text;
        $("overlayPrimary").textContent = primaryText;
        $("overlaySecondary").style.display = secondaryText ? "inline-block" : "none";
        $("overlaySecondary").textContent = secondaryText || "";
        overlayPrimaryAction = primaryAction || null;
        overlaySecondaryAction = secondaryAction || null;
        $("hud").style.display = "none";
        $("bossHud").style.display = "none";
      }

      function hideOverlay(){
        $("overlay").style.display = "none";
      }

      $("overlayPrimary").onclick = () => {
        if(overlayPrimaryAction) overlayPrimaryAction();
      };
      $("overlaySecondary").onclick = () => {
        if(overlaySecondaryAction) overlaySecondaryAction();
      };

      function notify(text, duration = 1.5){
        noticeText = text;
        noticeTimer = duration;
        $("notice").textContent = text;
        $("notice").style.display = "block";
      }

      function clearNotice(){
        noticeTimer = 0;
        $("notice").style.display = "none";
      }

      function setModePlaying(){
        mode = "playing";
        hideOverlay();
        $("hud").style.display = "block";
        $("bossHud").style.display = boss ? "block" : "none";
      }

      function playCutscene(title, lines, done){
        let idx = 0;
        mode = "scene";

        function next(){
          if(idx >= lines.length){
            setModePlaying();
            if(done) done();
            return;
          }

          showOverlay(
            "STORY CUTSCENE",
            title,
            lines[idx],
            idx === lines.length - 1 ? "CONTINUE" : "NEXT →",
            () => {
              idx++;
              next();
            }
          );
        }

        next();
      }

      function buildChapter(index){
        chapterIndex = index;
        saveProgress();
        synth.setChapter(index);

        platforms = [];
        enemies = [];
        particles = [];
        projectiles = [];
        banners = [];
        boss = null;
        cleared = false;
        camera = 0;
        clearNotice();

        const diff = difficulties[difficulty];

        player.maxHp = diff.hp;
        player.hp = diff.hp;
        player.x = 120;
        player.y = 410;
        player.vx = 0;
        player.vy = 0;
        player.grounded = false;
        player.jumpCount = 0;
        player.attackCd = 0;
        player.burstCd = 0;
        player.dashCd = 0;
        player.guardCd = 0;
        player.dashTimer = 0;
        player.guardTimer = 0;
        player.inv = 0;
        player.attackSwing = 0;

        if(index === 0){
          worldWidth = 2200;
          platforms.push(
            plat(0, 470, 420, 70),
            plat(430, 440, 220, 30),
            plat(760, 400, 220, 28),
            plat(1090, 430, 240, 30),
            plat(1440, 390, 230, 28),
            plat(1760, 350, 240, 28),
            plat(2050, 470, 160, 70)
          );
          enemies.push(
            enemy(690, 380, "raider"),
            enemy(975, 340, "raider"),
            enemy(1265, 370, "raider"),
            enemy(1625, 330, "knight"),
            enemy(1940, 410, "knight")
          );
          banners.push({x: 330, y: 305}, {x: 930, y: 270}, {x: 1540, y: 255});
        }

        if(index === 1){
          worldWidth = 2300;
          platforms.push(
            plat(0, 470, 300, 70),
            plat(320, 430, 180, 26),
            plat(560, 385, 190, 26),
            plat(830, 340, 200, 28),
            plat(1110, 395, 180, 24),
            plat(1350, 350, 200, 26),
            plat(1640, 310, 180, 24),
            plat(1885, 370, 190, 25),
            plat(2140, 470, 160, 70)
          );
          enemies.push(
            enemy(510, 370, "wraith"),
            enemy(790, 300, "wraith"),
            enemy(1065, 355, "wraith"),
            enemy(1600, 270, "knight"),
            enemy(2035, 330, "knight")
          );
        }

        if(index === 2){
          worldWidth = 2350;
          platforms.push(
            plat(0, 470, 330, 70),
            plat(360, 440, 220, 28),
            plat(650, 390, 150, 26),
            plat(885, 355, 190, 28),
            plat(1140, 420, 220, 28),
            plat(1440, 385, 190, 26),
            plat(1710, 350, 190, 24),
            plat(1965, 320, 190, 24),
            plat(2200, 470, 150, 70)
          );
          enemies.push(
            enemy(630, 350, "knight"),
            enemy(850, 315, "knight"),
            enemy(1120, 380, "raider"),
            enemy(1690, 315, "knight"),
            enemy(2160, 280, "wraith")
          );
          banners.push({x: 500, y: 300}, {x: 1510, y: 245});
        }

        if(index === 3){
          worldWidth = 2400;
          platforms.push(
            plat(0, 470, 280, 70),
            plat(320, 430, 160, 24),
            plat(540, 390, 190, 24),
            plat(790, 355, 170, 24),
            plat(1010, 325, 180, 22),
            plat(1260, 390, 210, 24),
            plat(1540, 360, 190, 24),
            plat(1790, 330, 190, 24),
            plat(2040, 300, 190, 24),
            plat(2290, 470, 120, 70)
          );
          enemies.push(
            enemy(505, 350, "wraith"),
            enemy(980, 285, "wraith"),
            enemy(1490, 320, "knight"),
            enemy(1765, 290, "wraith"),
            enemy(2210, 260, "knight")
          );
        }

        if(index === 4){
          worldWidth = 2500;
          platforms.push(
            plat(0, 470, 320, 70),
            plat(360, 425, 210, 25),
            plat(640, 390, 170, 24),
            plat(875, 350, 210, 24),
            plat(1160, 405, 200, 24),
            plat(1415, 365, 170, 22),
            plat(1650, 325, 180, 22),
            plat(1890, 285, 190, 22),
            plat(2140, 345, 200, 22),
            plat(2390, 470, 120, 70)
          );
          enemies.push(
            enemy(610, 350, "knight"),
            enemy(1105, 365, "knight"),
            enemy(1390, 325, "raider"),
            enemy(1860, 245, "wraith"),
            enemy(2325, 305, "knight")
          );
          banners.push({x: 1260, y: 305}, {x: 2070, y: 230});
        }

        if(index === 5){
          worldWidth = 2600;
          platforms.push(
            plat(0, 470, 350, 70),
            plat(410, 430, 220, 24),
            plat(700, 390, 230, 24),
            plat(1000, 350, 250, 24),
            plat(1310, 320, 220, 24),
            plat(1590, 350, 220, 24),
            plat(1870, 390, 250, 24),
            plat(2190, 470, 410, 70)
          );
          boss = createBoss(2340, 338, 1450 * diff.enemyHp);
          banners.push({x: 2300, y: 220});
        }

        updateHud();
      }

      function plat(x, y, w, h){
        return { x, y, w, h };
      }

      function enemy(x, y, type){
        const diff = difficulties[difficulty];
        let hp = 80, speed = 58, dmg = 12, radius = 18;

        if(type === "raider"){
          hp = 85; speed = 68; dmg = 13; radius = 18;
        }
        if(type === "wraith"){
          hp = 70; speed = 78; dmg = 12; radius = 16;
        }
        if(type === "knight"){
          hp = 115; speed = 54; dmg = 18; radius = 20;
        }

        return {
          type,
          x,
          y,
          w: 34,
          h: 50,
          vx: 0,
          vy: 0,
          hp: hp * diff.enemyHp,
          maxHp: hp * diff.enemyHp,
          speed,
          damage: dmg * diff.enemyDmg,
          grounded: false,
          attackCd: 0.8,
          flash: 0,
          dead: false,
          phase: Math.random() * 9
        };
      }

      function createBoss(x, y, hp){
        return {
          x,
          y,
          vx: 0,
          vy: 0,
          w: 94,
          h: 150,
          hp,
          maxHp: hp,
          phase: 1,
          attackCd: 1.4,
          action: "idle",
          slashTimer: 0,
          flash: 0,
          dead: false
        };
      }

      function startStoryFrom(index){
        buildChapter(index);
        synth.start();
        playCutscene(
          "CHAPTER " + (index + 1) + " — " + chapters[index].name,
          chapters[index].intro,
          () => {
            notify("DEFEAT ALL ENEMIES", 2);
          }
        );
      }

      function showMainMenu(){
        mode = "menu";
        const progress = getProgress();
        showOverlay(
          "THEDARKWITHIN — PREQUEL DLC",
          "THE FORGOTTEN KING",
          "A royal prequel set hundreds of years before TheDarkWithin.\n\n" +
          "Fight through golden courtyards, crystal crypts, shattered ramparts, and a ruined throne sanctum.\n\n" +
          "Experience cinematic cutscenes, fast sword combat, crystal powers, and the final battle against the Forgotten King.",
          progress > 0 ? "CONTINUE — CHAPTER " + (progress + 1) : "BEGIN STORY",
          () => startStoryFrom(progress),
          "NEW GAME",
          () => {
            try{ localStorage.removeItem(SAVE_KEY); }catch(err){}
            startStoryFrom(0);
          }
        );
      }

      function updateHud(){
        $("chapterLabel").textContent =
          "CHAPTER " + (chapterIndex + 1) + " — " + chapters[chapterIndex].name;
        $("objectiveLabel").textContent = chapters[chapterIndex].objective;
        $("statusLabel").textContent =
          "HP " + Math.ceil(Math.max(0, player.hp)) + "/" + player.maxHp +
          " | SWORD " + (player.attackCd <= 0 ? "READY" : player.attackCd.toFixed(1) + "s") +
          " | BURST " + (player.burstCd <= 0 ? "READY" : player.burstCd.toFixed(1) + "s") +
          " | DASH " + (player.dashCd <= 0 ? "READY" : player.dashCd.toFixed(1) + "s") +
          " | GUARD " + (player.guardCd <= 0 ? "READY" : player.guardCd.toFixed(1) + "s");

        $("hpFill").style.width = clamp((player.hp / player.maxHp) * 100, 0, 100) + "%";

        if(boss && !boss.dead){
          $("bossHud").style.display = mode === "playing" ? "block" : "none";
          $("bossPhase").textContent = "PHASE " + boss.phase + " OF 3";
          $("bossFill").style.width = clamp((boss.hp / boss.maxHp) * 100, 0, 100) + "%";
        }else{
          $("bossHud").style.display = "none";
        }
      }

      function particleBurst(x, y, color, count = 18, speed = 170){
        for(let i = 0; i < count; i++){
          const a = Math.random() * TAU;
          const s = rand(35, speed);
          particles.push({
            x, y,
            vx: Math.cos(a) * s,
            vy: Math.sin(a) * s,
            size: rand(2, 5),
            life: rand(0.25, 0.8),
            maxLife: rand(0.25, 0.8),
            color
          });
        }
      }

      function damageEnemy(e, amount){
        if(e.dead) return;
        e.hp -= amount;
        e.flash = 0.16;
        particleBurst(e.x, e.y - 18, e.type === "wraith" ? "#c69dff" : "#ffcf7b", 10, 160);

        if(e.hp <= 0){
          e.dead = true;
          particleBurst(e.x, e.y - 10, e.type === "wraith" ? "#c69dff" : "#ffd995", 28, 230);
        }
      }

      function damageBoss(amount){
        if(!boss || boss.dead) return;
        boss.hp -= amount;
        boss.flash = 0.16;
        particleBurst(boss.x, boss.y - 70, "#f0c07b", 15, 200);

        const ratio = boss.hp / boss.maxHp;
        const newPhase = ratio < 0.33 ? 3 : ratio < 0.66 ? 2 : 1;

        if(newPhase !== boss.phase){
          boss.phase = newPhase;
          notify("THE FORGOTTEN KING ENTERS PHASE " + newPhase, 2);
          particleBurst(boss.x, boss.y - 40, "#b689ff", 60, 260);
        }

        if(boss.hp <= 0){
          boss.dead = true;
          particleBurst(boss.x, boss.y - 30, "#ffdfa1", 90, 300);
          finishBossChapter();
        }
      }

      function damagePlayer(amount){
        if(player.inv > 0 || player.guardTimer > 0 || mode !== "playing") return;
        player.hp -= amount;
        player.inv = 0.85;
        particleBurst(player.x, player.y - 18, "#ff8ba5", 15, 180);

        if(player.hp <= 0){
          player.hp = 0;
          showDeath();
        }
      }

      function showDeath(){
        mode = "scene";
        showOverlay(
          "THE FALL OF A KING",
          "YOU HAVE FALLEN",
          "The kingdom's hope fades for a moment.\n\nRise again and continue the fight.",
          "RETRY CHAPTER",
          () => startStoryFrom(chapterIndex),
          "MENU",
          () => showMainMenu()
        );
      }

      function playerSword(){
        if(mode !== "playing" || player.attackCd > 0) return;
        player.attackCd = 0.32;
        player.attackSwing = 0.22;
        particleBurst(player.x + player.dir * 40, player.y - 18, "#ffe3a3", 12, 140);

        for(const e of enemies){
          if(e.dead) continue;
          const inRange =
            dist(player.x, player.y, e.x, e.y) < 110 &&
            (e.x - player.x) * player.dir > -35;

          if(inRange){
            damageEnemy(e, 38);
          }
        }

        if(boss && !boss.dead){
          const hitBoss =
            dist(player.x, player.y, boss.x, boss.y) < 155 &&
            (boss.x - player.x) * player.dir > -50;

          if(hitBoss){
            damageBoss(40);
          }
        }
      }

      function crystalBurst(){
        if(mode !== "playing" || player.burstCd > 0) return;
        player.burstCd = 4.2;
        particleBurst(player.x, player.y - 15, "#b992ff", 55, 270);
        particleBurst(player.x, player.y - 15, "#ffe3ad", 28, 190);
        notify("CRYSTAL BURST!", 1);

        for(const e of enemies){
          if(e.dead) continue;
          if(dist(player.x, player.y, e.x, e.y) < 185){
            damageEnemy(e, 78);
          }
        }

        if(boss && !boss.dead && dist(player.x, player.y, boss.x, boss.y) < 210){
          damageBoss(88);
        }
      }

      function kingDash(){
        if(mode !== "playing" || player.dashCd > 0) return;
        player.dashCd = 3.0;
        player.dashTimer = 0.22;
        player.inv = Math.max(player.inv, 0.30);
        particleBurst(player.x, player.y - 12, "#fff2bc", 22, 150);
        notify("KING'S DASH", 0.8);
      }

      function royalGuard(){
        if(mode !== "playing" || player.guardCd > 0) return;
        player.guardCd = 5.8;
        player.guardTimer = 1.25;
        particleBurst(player.x, player.y - 18, "#ffdca3", 16, 120);
        notify("ROYAL GUARD", 0.8);
      }

      function jump(){
        if(mode !== "playing") return;
        if(player.jumpCount >= 2) return;
        player.vy = player.jumpCount === 0 ? -610 : -560;
        player.jumpCount++;
        player.grounded = false;
        particleBurst(player.x, player.y + 18, "#ffe0a1", 8, 90);
      }

      function finishNormalChapter(){
        if(cleared) return;
        cleared = true;
        mode = "scene";

        playCutscene(
          "CHAPTER COMPLETE",
          [
            "NARRATOR: " + chapters[chapterIndex].outro,
            "The king presses onward toward the heart of the corruption."
          ],
          () => {
            if(chapterIndex < chapters.length - 1){
              startStoryFrom(chapterIndex + 1);
            }
          }
        );
      }

      function finishBossChapter(){
        mode = "scene";
        playCutscene(
          "THE FALL OF THE FORGOTTEN KING",
          [
            "FORGOTTEN KING: My crown... my kingdom... buried in crystal...",
            "KING ALDRIC: Rest now. I will remember what this place once was.",
            "NARRATOR: The crystal curse cracks. The throne sanctum falls silent.",
            "NARRATOR: Though the kingdom is saved for a time, its tragedy will echo into the age of TheDarkWithin."
          ],
          () => {
            showOverlay(
              "THEDARKWITHIN — PREQUEL COMPLETE",
              "THE FORGOTTEN KING",
              "The prequel has been completed.\n\nA golden kingdom was saved, but its scars remained.\nThose scars would one day become part of TheDarkWithin.",
              "PLAY AGAIN",
              () => {
                try{ localStorage.removeItem(SAVE_KEY); }catch(err){}
                startStoryFrom(0);
              },
              "MENU",
              () => showMainMenu()
            );
            mode = "ending";
          }
        );
      }

      function update(dt){
        time += dt;

        if(noticeTimer > 0){
          noticeTimer -= dt;
          if(noticeTimer <= 0){
            $("notice").style.display = "none";
          }
        }

        for(let i = particles.length - 1; i >= 0; i--){
          const p = particles[i];
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.life -= dt;
          if(p.life <= 0){
            particles.splice(i, 1);
          }
        }

        for(let i = projectiles.length - 1; i >= 0; i--){
          const p = projectiles[i];
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.life -= dt;

          let remove = false;

          if(p.enemy){
            if(dist(p.x, p.y, player.x, player.y) < p.r + 22){
              damagePlayer(p.damage);
              remove = true;
            }
          }else{
            for(const e of enemies){
              if(e.dead) continue;
              if(dist(p.x, p.y, e.x, e.y) < p.r + 20){
                damageEnemy(e, p.damage);
                remove = true;
                break;
              }
            }

            if(!remove && boss && !boss.dead && dist(p.x, p.y, boss.x, boss.y) < p.r + 58){
              damageBoss(p.damage);
              remove = true;
            }
          }

          if(p.life <= 0 || remove){
            projectiles.splice(i, 1);
          }
        }

        if(mode !== "playing") return;

        player.attackCd = Math.max(0, player.attackCd - dt);
        player.burstCd = Math.max(0, player.burstCd - dt);
        player.dashCd = Math.max(0, player.dashCd - dt);
        player.guardCd = Math.max(0, player.guardCd - dt);
        player.dashTimer = Math.max(0, player.dashTimer - dt);
        player.guardTimer = Math.max(0, player.guardTimer - dt);
        player.inv = Math.max(0, player.inv - dt);
        player.attackSwing = Math.max(0, player.attackSwing - dt);

        let moveDir = 0;
        if(keys.a || keys.arrowleft) moveDir--;
        if(keys.d || keys.arrowright) moveDir++;

        if(moveDir) player.dir = moveDir;

        if(player.dashTimer > 0){
          player.vx = player.dir * 680;
          player.vy = 0;
        }else{
          player.vx = moveDir * 250;
          player.vy += 1550 * dt;
        }

        const prevX = player.x;
        const prevY = player.y;
        player.x += player.vx * dt;
        player.y += player.vy * dt;

        player.grounded = false;

        for(const pl of platforms){
          if(
            prevY + player.h/2 <= pl.y &&
            player.y + player.h/2 >= pl.y &&
            player.x + player.w/2 > pl.x &&
            player.x - player.w/2 < pl.x + pl.w &&
            player.vy >= 0
          ){
            player.y = pl.y - player.h/2;
            player.vy = 0;
            player.grounded = true;
            player.jumpCount = 0;
          }
        }

        player.x = clamp(player.x, 10, worldWidth - 10);

        if(player.y > H + 100){
          showDeath();
          return;
        }

        for(const e of enemies){
          if(e.dead) continue;

          e.attackCd = Math.max(0, e.attackCd - dt);
          e.flash = Math.max(0, e.flash - dt);

          const dx = player.x - e.x;
          const dy = player.y - e.y;
          const d = Math.hypot(dx, dy) || 1;

          if(e.type === "wraith"){
            e.y += Math.sin(time * 2 + e.phase) * 15 * dt * 3.5;
          }

          if(d > 38){
            e.x += (dx / d) * e.speed * dt;
          }

          if(d < 42 && e.attackCd <= 0){
            damagePlayer(e.damage);
            e.attackCd = 1.0;
          }
        }

        enemies = enemies.filter(e => !e.dead || e.flash > 0);

        if(boss && !boss.dead){
          boss.flash = Math.max(0, boss.flash - dt);
          boss.attackCd = Math.max(0, boss.attackCd - dt);

          const ratio = boss.hp / boss.maxHp;
          boss.phase = ratio < 0.33 ? 3 : ratio < 0.66 ? 2 : 1;

          if(dist(player.x, player.y, boss.x, boss.y) < 90){
            damagePlayer(8 * difficulties[difficulty].enemyDmg);
          }

          if(boss.attackCd <= 0){
            if(Math.random() < 0.45){
              boss.action = "orbs";
              const count = boss.phase === 1 ? 3 : boss.phase === 2 ? 5 : 7;
              for(let i = 0; i < count; i++){
                const angle = Math.atan2(player.y - (boss.y - 70), player.x - boss.x) + (i - (count - 1)/2) * 0.15;
                projectiles.push({
                  x: boss.x,
                  y: boss.y - 65,
                  vx: Math.cos(angle) * (250 + boss.phase * 40),
                  vy: Math.sin(angle) * (250 + boss.phase * 40),
                  r: 10,
                  damage: 12 * difficulties[difficulty].enemyDmg,
                  enemy: true,
                  life: 4
                });
              }
              notify("CRYSTAL ORBS!", 0.8);
            }else{
              boss.action = "slash";
              boss.slashTimer = 0.42;
              if(Math.abs(player.x - boss.x) < 190){
                damagePlayer(20 * difficulties[difficulty].enemyDmg);
              }
              particleBurst(boss.x + (player.x < boss.x ? -55 : 55), boss.y - 40, "#c9a0ff", 26, 220);
              notify("ROYAL RUIN!", 0.8);
            }
            boss.attackCd = boss.phase === 1 ? 1.8 : boss.phase === 2 ? 1.35 : 0.95;
          }

          boss.slashTimer = Math.max(0, boss.slashTimer - dt);
        }

        if(!boss && enemies.every(e => e.dead || e.hp <= 0) && !cleared){
          finishNormalChapter();
        }

        updateHud();

        const targetCamera = clamp(player.x - 260, 0, Math.max(0, worldWidth - W));
        camera += (targetCamera - camera) * Math.min(1, dt * 5.5);
      }

      function draw(){
        ctx.clearRect(0, 0, W, H);

        drawBackground();
        drawPlatforms();
        drawDecor();
        drawEnemies();
        drawBoss();
        drawProjectiles();
        drawPlayer();
        drawParticles();
      }

      function drawBackground(){
        const palettes = [
          ["#6e4a5f", "#2a2034", "#1a1520", "#ffdb94"],
          ["#5c4762", "#20182a", "#16131f", "#d4b0ff"],
          ["#72525a", "#2e2430", "#1a141d", "#ffd08f"],
          ["#735465", "#2d2033", "#17121c", "#f1bb91"],
          ["#6d4257", "#241a29", "#151019", "#ffcf8d"],
          ["#59385f", "#1c1324", "#120d18", "#ffc98b"]
        ];

        const p = palettes[chapterIndex];
        const sky = ctx.createLinearGradient(0, 0, 0, H);
        sky.addColorStop(0, p[0]);
        sky.addColorStop(0.56, p[1]);
        sky.addColorStop(1, p[2]);

        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, W, H);

        const sunX = 720 - camera * 0.05;
        const sunY = 112;

        glow(sunX, sunY, 210, chapterIndex >= 5 ? "rgba(194,131,255,0.28)" : "rgba(255,217,138,0.26)");
        ellipse(sunX, sunY, 58, 58, chapterIndex >= 5 ? "#caa3ff" : "#ffd88a");

        if(chapterIndex >= 4){
          ellipse(sunX + 18, sunY - 4, 48, 48, "#170f1b");
          ctx.strokeStyle = chapterIndex >= 5 ? "#d4b4ff" : "#ffd79c";
          ctx.lineWidth = 6;
          ctx.beginPath();
          ctx.arc(sunX, sunY, 72, 0, TAU);
          ctx.stroke();
        }

        // far mountains
        for(let layer = 0; layer < 3; layer++){
          const speed = [0.12, 0.23, 0.42][layer];
          const y = [370, 400, 430][layer];
          const color = ["rgba(255,255,255,0.08)", "rgba(68,52,86,0.52)", "rgba(34,25,42,0.95)"][layer];

          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.moveTo(0, H);

          for(let i = -2; i < 10; i++){
            const mx = i * 180 - (camera * speed % 180);
            const mh = 120 + ((i * 53 + layer * 24) % 85);
            ctx.lineTo(mx, y);
            ctx.lineTo(mx + 90, y - mh);
            ctx.lineTo(mx + 180, y);
          }

          ctx.lineTo(W, H);
          ctx.closePath();
          ctx.fill();
        }

        // castle silhouettes
        drawCastleSilhouettes();

        // light shafts
        for(let i = 0; i < 6; i++){
          const x = i * 170 + Math.sin(time * 0.3 + i) * 20 - camera * 0.08;
          const g = ctx.createLinearGradient(x, 0, x + 85, H);
          g.addColorStop(0, "rgba(255,255,255,0)");
          g.addColorStop(0.5, chapterIndex >= 5 ? "rgba(201,156,255,0.08)" : "rgba(255,221,158,0.08)");
          g.addColorStop(1, "rgba(255,255,255,0)");
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x + 40, 0);
          ctx.lineTo(x + 140, H);
          ctx.lineTo(x + 100, H);
          ctx.closePath();
          ctx.fill();
        }

        // floor haze
        const fog = ctx.createLinearGradient(0, 330, 0, H);
        fog.addColorStop(0, "rgba(255,255,255,0)");
        fog.addColorStop(1, chapterIndex >= 5 ? "rgba(145,110,189,0.18)" : "rgba(255,218,161,0.12)");
        ctx.fillStyle = fog;
        ctx.fillRect(0, 330, W, H - 330);
      }

      function drawCastleSilhouettes(){
        for(let i = 0; i < 6; i++){
          const x = i * 260 - camera * 0.18 + 30;
          const baseY = 360 + (i % 2) * 18;
          drawCastle(x, baseY, 0.75, i % 2 === 0);
        }

        if(chapterIndex >= 5){
          drawCastle(640 - camera * 0.28, 340, 1.35, true, true);
        }
      }

      function drawCastle(x, y, scale = 1, purple = false, throne = false){
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);

        const wall = ctx.createLinearGradient(-110, -150, 110, 0);
        wall.addColorStop(0, purple ? "#5d456f" : "#9d8c91");
        wall.addColorStop(1, purple ? "#24192c" : "#463840");

        ctx.fillStyle = wall;
        ctx.fillRect(-105, -140, 210, 140);

        for(const dx of [-84, 0, 84]){
          ctx.fillStyle = purple ? "#4d385f" : "#6f6067";
          ctx.fillRect(dx - 28, -225, 56, 225);
          ctx.fillStyle = purple ? "#6e4f8c" : "#c29f68";
          ctx.beginPath();
          ctx.moveTo(dx - 40, -225);
          ctx.lineTo(dx, -285);
          ctx.lineTo(dx + 40, -225);
          ctx.fill();
          ctx.fillStyle = purple ? "#e4b8ff" : "#ffdca2";
          ctx.fillRect(dx - 7, -188, 14, 42);
        }

        ctx.fillStyle = "#18111d";
        ctx.beginPath();
        ctx.arc(0, -40, 32, Math.PI, 0);
        ctx.lineTo(32, 0);
        ctx.lineTo(-32, 0);
        ctx.fill();

        if(throne){
          ctx.strokeStyle = "rgba(255,202,135,0.34)";
          ctx.lineWidth = 6;
          ctx.beginPath();
          ctx.ellipse(0, -150, 125, 165, 0, 0, TAU);
          ctx.stroke();
        }

        ctx.restore();
      }

      function drawPlatforms(){
        for(const pl of platforms){
          const x = pl.x - camera;
          const y = pl.y;

          // top
          const g = ctx.createLinearGradient(x, y, x, y + 34);
          g.addColorStop(0, "#d9b183");
          g.addColorStop(1, "#8f675a");
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.ellipse(x + pl.w/2, y, pl.w/2, 11, 0, 0, TAU);
          ctx.fill();

          // underside body for 2.5D effect
          const under = ctx.createLinearGradient(x, y, x, y + 65);
          under.addColorStop(0, "#715667");
          under.addColorStop(0.5, "#3e2f3d");
          under.addColorStop(1, "#1a141c");
          ctx.fillStyle = under;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x + pl.w, y);
          ctx.lineTo(x + pl.w * 0.82, y + 55);
          ctx.lineTo(x + pl.w * 0.56, y + 72);
          ctx.lineTo(x + pl.w * 0.18, y + 45);
          ctx.closePath();
          ctx.fill();

          ctx.strokeStyle = "rgba(255,255,255,0.15)";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(x + pl.w * 0.2, y + 18);
          ctx.lineTo(x + pl.w * 0.42, y + 40);
          ctx.lineTo(x + pl.w * 0.72, y + 21);
          ctx.stroke();
        }

        // ground glow
        ctx.fillStyle = "rgba(255,232,190,0.03)";
        ctx.fillRect(0, 420, W, 120);
      }

      function drawDecor(){
        // crystals, banners, particles in environment
        for(const b of banners){
          const x = b.x - camera;
          const y = b.y;

          ctx.strokeStyle = "#8a6a5f";
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x, y + 110);
          ctx.stroke();

          const cloth = ctx.createLinearGradient(x, y + 18, x + 48, y + 60);
          cloth.addColorStop(0, chapterIndex >= 5 ? "#8e63d6" : "#7d5060");
          cloth.addColorStop(1, chapterIndex >= 5 ? "#d4b2ff" : "#f2c17e");
          ctx.fillStyle = cloth;
          ctx.beginPath();
          ctx.moveTo(x, y + 20);
          ctx.lineTo(x + 56, y + 30);
          ctx.lineTo(x + 34, y + 78);
          ctx.lineTo(x, y + 68);
          ctx.closePath();
          ctx.fill();
        }

        for(let i = 0; i < 8; i++){
          const x = ((i * 320 - camera * 0.35) % 1300 + 1300) % 1300 - 100;
          const y = 440 + Math.sin(time * 1.4 + i) * 4;
          drawCrystalCluster(x, y, 0.7 + (i % 3) * 0.12, chapterIndex >= 5);
        }
      }

      function drawCrystalCluster(x, y, scale = 1, corrupted = false){
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);

        const colors = corrupted
          ? ["#d0b0ff", "#8f61d9", "#2b153b"]
          : ["#ffe8b4", "#c98f71", "#3b2231"];

        glow(0, -18, 42, corrupted ? "rgba(175,115,255,0.22)" : "rgba(255,220,155,0.18)");

        for(const c of [
          {x:0, y:0, s:22},
          {x:-18, y:8, s:14},
          {x:18, y:6, s:16}
        ]){
          ctx.fillStyle = colors[1];
          ctx.beginPath();
          ctx.moveTo(c.x, c.y - c.s);
          ctx.lineTo(c.x + c.s * 0.45, c.y - 5);
          ctx.lineTo(c.x + c.s * 0.18, c.y + c.s * 0.68);
          ctx.lineTo(c.x - c.s * 0.18, c.y + c.s * 0.9);
          ctx.lineTo(c.x - c.s * 0.48, c.y + 1);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = colors[0];
          ctx.beginPath();
          ctx.moveTo(c.x, c.y - c.s);
          ctx.lineTo(c.x, c.y + c.s * 0.9);
          ctx.lineTo(c.x - c.s * 0.18, c.y + c.s * 0.9);
          ctx.lineTo(c.x - c.s * 0.48, c.y + 1);
          ctx.closePath();
          ctx.fill();
        }

        ctx.restore();
      }

      function drawEnemies(){
        for(const e of enemies){
          drawEnemy(e);
        }
      }

      function drawEnemy(e){
        const x = e.x - camera;
        const y = e.y;
        const flash = e.flash > 0;

        ctx.save();
        ctx.translate(x, y);

        ellipse(0, 24, 20, 7, "rgba(0,0,0,0.36)");

        if(e.type === "wraith"){
          glow(0, -18, 55, "rgba(186,136,255,0.28)");
          const g = ctx.createLinearGradient(-25, -40, 25, 30);
          g.addColorStop(0, flash ? "#ffffff" : "#ccb4ff");
          g.addColorStop(0.45, flash ? "#ffffff" : "#8d61d0");
          g.addColorStop(1, "#20142d");
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.moveTo(-22, -12);
          ctx.quadraticCurveTo(-22, -40, 0, -38);
          ctx.quadraticCurveTo(22, -40, 22, -12);
          ctx.lineTo(14, 26);
          ctx.lineTo(4, 12);
          ctx.lineTo(-8, 26);
          ctx.lineTo(-16, 11);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = "#ffd0ff";
          ctx.shadowColor = "#e8c5ff";
          ctx.shadowBlur = 14;
          ctx.fillRect(-10, -16, 6, 4);
          ctx.fillRect(4, -16, 6, 4);
          ctx.shadowBlur = 0;
        } else {
          // armored enemy
          const armor = ctx.createLinearGradient(-18, -38, 18, 18);
          armor.addColorStop(0, flash ? "#ffffff" : "#e1c39d");
          armor.addColorStop(0.45, e.type === "knight" ? "#8c6d7d" : "#b0726b");
          armor.addColorStop(1, "#251a22");

          ctx.fillStyle = armor;
          ctx.beginPath();
          ctx.moveTo(-16, -20);
          ctx.quadraticCurveTo(0, -36, 16, -20);
          ctx.lineTo(18, 12);
          ctx.quadraticCurveTo(0, 26, -18, 12);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = "#e0b58e";
          ellipse(0, -35, 12, 14, "#3c2731");

          ctx.fillStyle = "#1a1319";
          ctx.beginPath();
          ctx.moveTo(-13, -35);
          ctx.quadraticCurveTo(0, -57, 13, -35);
          ctx.lineTo(8, -23);
          ctx.lineTo(-8, -23);
          ctx.fill();

          ctx.fillStyle = "#ffd6af";
          ctx.shadowColor = "#ffd8ad";
          ctx.shadowBlur = 12;
          ctx.fillRect(-8, -38, 5, 4);
          ctx.fillRect(3, -38, 5, 4);
          ctx.shadowBlur = 0;

          if(e.type === "knight"){
            ctx.strokeStyle = "#c79b68";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(14, -16);
            ctx.lineTo(28, -30);
            ctx.stroke();
          }
        }

        // hp bar
        const width = 42;
        ctx.fillStyle = "rgba(17, 11, 20, 0.8)";
        ctx.fillRect(-width/2, -64, width, 6);
        ctx.fillStyle = e.type === "wraith" ? "#c39cff" : "#f0ba7a";
        ctx.fillRect(-width/2, -64, width * clamp(e.hp / e.maxHp, 0, 1), 6);

        ctx.restore();
      }

      function drawBoss(){
        if(!boss || boss.dead) return;

        const x = boss.x - camera;
        const y = boss.y;
        const flash = boss.flash > 0;

        ctx.save();
        ctx.translate(x, y);

        glow(0, -50, 180, "rgba(184,130,255,0.28)");
        ellipse(0, 42, 58, 10, "rgba(0,0,0,0.4)");

        // cape
        const cape = ctx.createLinearGradient(-70, -35, 70, 110);
        cape.addColorStop(0, "#5c2f78");
        cape.addColorStop(1, "#1f1228");
        ctx.fillStyle = cape;
        ctx.beginPath();
        ctx.moveTo(-42, -16);
        ctx.lineTo(-84, 72);
        ctx.lineTo(-32, 132);
        ctx.lineTo(0, 148);
        ctx.lineTo(32, 132);
        ctx.lineTo(84, 72);
        ctx.lineTo(42, -16);
        ctx.closePath();
        ctx.fill();

        // body armor
        const armor = ctx.createLinearGradient(-55, -80, 55, 55);
        armor.addColorStop(0, flash ? "#ffffff" : "#e2d1d9");
        armor.addColorStop(0.35, "#8d6aa3");
        armor.addColorStop(0.7, "#442c55");
        armor.addColorStop(1, "#18111e");

        ctx.fillStyle = armor;
        ctx.beginPath();
        ctx.moveTo(-52, -22);
        ctx.lineTo(0, -72);
        ctx.lineTo(52, -22);
        ctx.lineTo(66, 42);
        ctx.lineTo(0, 80);
        ctx.lineTo(-66, 42);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = "#d7b07a";
        ctx.lineWidth = 5;
        ctx.stroke();

        // shoulders
        for(const s of [-1, 1]){
          ctx.fillStyle = "#5b456d";
          ctx.beginPath();
          ctx.moveTo(s * 36, -36);
          ctx.lineTo(s * 92, -98);
          ctx.lineTo(s * 118, -40);
          ctx.lineTo(s * 80, -5);
          ctx.closePath();
          ctx.fill();
        }

        // head
        ellipse(0, -102, 34, 40, "#201623");
        ctx.fillStyle = "#f0d9ca";
        ellipse(0, -100, 28, 34, "#352231");

        // crown
        ctx.fillStyle = "#f3c179";
        ctx.shadowColor = "#f2cd90";
        ctx.shadowBlur = 18;
        ctx.beginPath();
        ctx.moveTo(-34, -118);
        ctx.lineTo(-42, -155);
        ctx.lineTo(-12, -136);
        ctx.lineTo(0, -175);
        ctx.lineTo(12, -136);
        ctx.lineTo(42, -155);
        ctx.lineTo(34, -118);
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;

        // eyes
        ctx.fillStyle = "#ffd8a7";
        ctx.shadowColor = "#ffd39f";
        ctx.shadowBlur = 18;
        ctx.fillRect(-18, -106, 10, 5);
        ctx.fillRect(8, -106, 10, 5);
        ctx.shadowBlur = 0;

        // heart crystal
        drawBossCrystal(0, -18);

        if(boss.slashTimer > 0){
          ctx.strokeStyle = "#d4b1ff";
          ctx.shadowColor = "#d4b1ff";
          ctx.shadowBlur = 22;
          ctx.lineWidth = 13;
          ctx.beginPath();
          ctx.arc(player.x - boss.x, player.y - boss.y, 110, -1.0, 1.05);
          ctx.stroke();
          ctx.shadowBlur = 0;
        }

        ctx.restore();
      }

      function drawBossCrystal(x, y){
        ctx.save();
        ctx.translate(x, y);
        glow(0, 0, 48, "rgba(220,184,255,0.34)");
        ctx.fillStyle = "#f7d59c";
        ctx.beginPath();
        ctx.moveTo(0, -24);
        ctx.lineTo(16, -6);
        ctx.lineTo(8, 20);
        ctx.lineTo(0, 28);
        ctx.lineTo(-10, 16);
        ctx.lineTo(-16, -6);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "#ffffff88";
        ctx.beginPath();
        ctx.moveTo(0, -24);
        ctx.lineTo(0, 28);
        ctx.lineTo(-10, 16);
        ctx.lineTo(-16, -6);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function drawProjectiles(){
        for(const p of projectiles){
          const x = p.x - camera;
          glow(x, p.y, p.r * 4, p.enemy ? "rgba(190,145,255,0.28)" : "rgba(255,232,169,0.28)");
          ellipse(x, p.y, p.r, p.r, p.enemy ? "#c9a2ff" : "#ffe2a8");
          ellipse(x - 3, p.y - 3, p.r * 0.35, p.r * 0.35, "#ffffff");
        }
      }

      function drawPlayer(){
        const x = player.x - camera;
        const y = player.y;

        if(player.inv > 0 && Math.floor(time * 12) % 2 === 0){
          // flicker
        }

        ctx.save();
        ctx.translate(x, y);

        ellipse(0, 28, 24, 8, "rgba(0,0,0,0.35)");

        // cape
        const cape = ctx.createLinearGradient(-24, -22, 18, 22);
        cape.addColorStop(0, "#6f3b77");
        cape.addColorStop(1, "#2c1a31");
        ctx.fillStyle = cape;
        ctx.beginPath();
        ctx.moveTo(-12, -22);
        ctx.quadraticCurveTo(-34, -4, -28, 25 + Math.sin(time * 6) * 3);
        ctx.lineTo(14, 22);
        ctx.lineTo(16, -22);
        ctx.closePath();
        ctx.fill();

        // legs
        ctx.fillStyle = "#2f2632";
        ctx.fillRect(-13, 10, 11, 19);
        ctx.fillRect(3, 10, 11, 19);

        // body armor
        const armor = ctx.createLinearGradient(-18, -28, 18, 16);
        armor.addColorStop(0, "#fff3cb");
        armor.addColorStop(0.38, "#f1c77f");
        armor.addColorStop(0.75, "#8d654a");
        armor.addColorStop(1, "#32212a");

        ctx.fillStyle = armor;
        ctx.beginPath();
        ctx.moveTo(-18, -22);
        ctx.quadraticCurveTo(0, -34, 18, -22);
        ctx.lineTo(20, 10);
        ctx.quadraticCurveTo(0, 22, -20, 10);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = "#ffe1a7";
        ctx.lineWidth = 2;
        ctx.stroke();

        // shoulders
        for(const s of [-1, 1]){
          ctx.fillStyle = "#b2865d";
          ctx.beginPath();
          ctx.ellipse(s * 20, -17, 12, 13, s * 0.18, 0, TAU);
          ctx.fill();
        }

        // face
        ellipse(0, -39, 12, 15, "#e8cbb4");

        // helmet
        ctx.fillStyle = "#3e2b31";
        ctx.beginPath();
        ctx.moveTo(-15, -40);
        ctx.quadraticCurveTo(-16, -61, 0, -56);
        ctx.quadraticCurveTo(16, -61, 15, -40);
        ctx.lineTo(10, -31);
        ctx.lineTo(-10, -31);
        ctx.closePath();
        ctx.fill();

        // crown crest
        ctx.fillStyle = "#f3ca86";
        ctx.beginPath();
        ctx.moveTo(-4, -57);
        ctx.lineTo(0, -69);
        ctx.lineTo(4, -57);
        ctx.fill();

        // eyes
        ctx.fillStyle = "#fff0cf";
        ctx.shadowColor = "#fff0cf";
        ctx.shadowBlur = 8;
        ctx.fillRect(player.dir > 0 ? 3 : -9, -41, 6, 4);
        ctx.shadowBlur = 0;

        // sword
        ctx.save();
        ctx.translate(player.dir * 22, -5);
        ctx.rotate(player.dir > 0 ? -0.27 : Math.PI + 0.27);

        ctx.fillStyle = "#fff4d8";
        ctx.shadowColor = "#ffeab5";
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.moveTo(-4, 0);
        ctx.lineTo(-6, -55);
        ctx.lineTo(0, -73);
        ctx.lineTo(6, -55);
        ctx.lineTo(4, 0);
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.fillStyle = "#e0b06c";
        ctx.fillRect(-13, -4, 26, 7);
        ctx.fillStyle = "#513a35";
        ctx.fillRect(-4, 3, 8, 17);
        ctx.restore();

        if(player.attackSwing > 0){
          ctx.strokeStyle = "#fff0bd";
          ctx.shadowColor = "#ffe2a7";
          ctx.shadowBlur = 28;
          ctx.lineWidth = 13;
          const base = player.dir > 0 ? 0 : Math.PI;
          ctx.beginPath();
          ctx.arc(player.dir * 48, -8, 76, base - 0.85, base + 0.85);
          ctx.stroke();
          ctx.shadowBlur = 0;
        }

        if(player.guardTimer > 0){
          ctx.strokeStyle = "#ffd696";
          ctx.shadowColor = "#ffd696";
          ctx.shadowBlur = 22;
          ctx.lineWidth = 5;
          ctx.beginPath();
          ctx.arc(0, -5, 39, 0, TAU);
          ctx.stroke();
          ctx.shadowBlur = 0;
        }

        if(player.dashTimer > 0){
          for(let i = 1; i <= 4; i++){
            ctx.globalAlpha = 0.27 - i * 0.04;
            ctx.fillStyle = "#fff5cd";
            ctx.beginPath();
            ctx.ellipse(-player.dir * i * 20, -7, 12, 25, 0, 0, TAU);
            ctx.fill();
          }
          ctx.globalAlpha = 1;
        }

        ctx.restore();
      }

      function drawParticles(){
        for(const p of particles){
          ctx.globalAlpha = clamp(p.life / p.maxLife, 0, 1);
          ctx.fillStyle = p.color;
          ctx.shadowColor = p.color;
          ctx.shadowBlur = 9;
          ctx.beginPath();
          ctx.arc(p.x - camera, p.y, p.size, 0, TAU);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
      }

      function glow(x, y, r, color){
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, color);
        g.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = g;
        ctx.fillRect(x - r, y - r, r * 2, r * 2);
      }

      function ellipse(x, y, rx, ry, color){
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.ellipse(x, y, rx, ry, 0, 0, TAU);
        ctx.fill();
      }

      function frameLoop(timestamp){
        const dt = Math.min((timestamp - (lastFrame || timestamp)) / 1000, 0.04);
        lastFrame = timestamp;
        update(dt);
        draw();
        requestAnimationFrame(frameLoop);
      }

      window.addEventListener("keydown", e => {
        const key = e.key.toLowerCase();

        if([" ", "arrowup", "arrowdown", "arrowleft", "arrowright", "shift"].includes(key)){
          e.preventDefault();
        }

        keys[key] = true;

        if(e.repeat) return;

        if(mode === "scene"){
          if(key === "enter" || key === " "){
            if(overlayPrimaryAction) overlayPrimaryAction();
          }
          return;
        }

        if(mode === "playing"){
          if(key === " " || key === "w" || key === "arrowup") jump();
          if(key === "j") playerSword();
          if(key === "k") crystalBurst();
          if(key === "shift") kingDash();
          if(key === "n") royalGuard();
        }
      });

      window.addEventListener("keyup", e => {
        keys[e.key.toLowerCase()] = false;
      });

      window.addEventListener("blur", () => {
        for(const k in keys) keys[k] = false;
      });

      canvas.addEventListener("click", () => {
        if(mode === "scene" && overlayPrimaryAction){
          overlayPrimaryAction();
        } else if(mode === "playing"){
          playerSword();
        }
      });

      $("jumpBtn").onclick = jump;
      $("swordBtn").onclick = playerSword;
      $("burstBtn").onclick = crystalBurst;
      $("dashBtn").onclick = kingDash;
      $("guardBtn").onclick = royalGuard;

      $("musicBtn").onclick = () => synth.toggle();

      $("difficulty").onchange = e => {
        difficulty = e.target.value;
        if(mode === "playing" || mode === "scene"){
          startStoryFrom(chapterIndex);
        }
      };

      $("restartBtn").onclick = () => {
        if(mode !== "menu"){
          startStoryFrom(chapterIndex);
        }
      };

      $("menuBtn").onclick = () => {
        showMainMenu();
      };

      $("fullscreenBtn").onclick = async () => {
        try{
          if(document.fullscreenElement){
            await document.exitFullscreen();
          }else{
            await $("stage").requestFullscreen();
          }
        }catch(err){
          alert("Fullscreen is unavailable in this browser.");
        }
      };

      showMainMenu();
      requestAnimationFrame(frameLoop);
    })();
  </script>
</body>
</html>

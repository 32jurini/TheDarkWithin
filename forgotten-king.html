// ==========================================
// CUTSCENE ENGINE
// ==========================================

let sceneList = [];
let sceneIndex = 0;
let sceneCallback = null;
let canSkipIntro = false;

function playScenes(list, callback, skip = false) {
  sceneList = list;
  sceneIndex = 0;
  sceneCallback = callback || null;
  canSkipIntro = skip;

  mode = "cinematic";

  $("scene").classList.add("show");
  $("hud").style.display = "none";
  $("interact").style.display = "none";

  $("skipIntro").style.display =
    skip ? "block" : "none";

  showScene();
}

function showScene() {
  const scene = sceneList[sceneIndex];

  $("sceneLabel").textContent =
    scene.label || "THE FORGOTTEN KING";

  $("sceneTitle").textContent = scene.title;
  $("sceneText").textContent = scene.text;

  $("sceneNext").textContent =
    sceneIndex === sceneList.length - 1
      ? "CONTINUE STORY"
      : "CONTINUE";

  $("sceneTitle").style.animation = "none";
  void $("sceneTitle").offsetWidth;
  $("sceneTitle").style.animation =
    "appear 0.7s ease";
}

function finishScenes() {
  $("scene").classList.remove("show");

  mode = "playing";

  const callback = sceneCallback;
  sceneCallback = null;

  $("hud").style.display = "block";

  if (callback) {
    callback();
  }
}

function nextScene() {
  if (mode !== "cinematic") return;

  sceneIndex++;

  if (sceneIndex >= sceneList.length) {
    finishScenes();
  } else {
    showScene();
  }
}

$("sceneNext").addEventListener(
  "click",
  nextScene
);

$("skipIntro").addEventListener(
  "click",
  () => {
    if (!canSkipIntro) return;
    finishScenes();
  }
);

// ==========================================

// ==========================================
// DIALOGUE ENGINE
// ==========================================

let dialogueLines = [];
let dialogueIndex = 0;
let dialogueActive = false;
let dialogueCallback = null;

function talk(lines, callback = null) {
  dialogueLines = lines;
  dialogueIndex = 0;
  dialogueActive = true;
  dialogueCallback = callback;

  $("dialogue").style.display = "block";
  $("interact").style.display = "none";

  showDialogueLine();
}

function showDialogueLine() {
  const line = dialogueLines[dialogueIndex];

  $("speaker").textContent = line[0];
  $("speech").textContent = line[1];
}

function advanceDialogue() {
  if (!dialogueActive) return;

  dialogueIndex++;

  if (dialogueIndex < dialogueLines.length) {
    showDialogueLine();
    return;
  }

  dialogueActive = false;
  $("dialogue").style.display = "none";

  const callback = dialogueCallback;
  dialogueCallback = null;

  if (callback) {
    callback();
  }
}

$("dialogue").addEventListener(
  "click",
  advanceDialogue
);

// ==========================================
// CHAPTER SYSTEM
// ==========================================

function updateHUD() {
  const data = chapters[chapter];

  $("chapterTitle").textContent =
    "CHAPTER " +
    (chapter + 1) +
    " — " +
    data.title;

  $("objective").textContent =
    "OBJECTIVE: " +
    (data.objectives[stage] || "Continue the story");
}

function startChapter(number) {
  chapter = number;
  stage = 0;
  mode = "playing";

  player.x = 480;
  player.y = 450;

  $("scene").classList.remove("show");
  $("hud").style.display = "block";

    talk([

      ],
      [

    talk([

        "Sir Aeron",

        "They were here long before our kingdom."
      ],
      [
        "King Aldric",

  if (chapter === 2) {

      [

      [

      [

      [

        "Something happened in those mines."

      [

        "I must find out what he is hiding."
      ]
    ]);

}

function advanceStage() {
  stage++;

// ==========================================
// PLAYER INTERACTION
// ==========================================

function activeTarget() {
  return chapters[chapter].targets[stage] || null;
}

function nearTarget() {
  if (mode !== "playing" || dialogueActive) {
    return false;
  }

  const target = activeTarget();

  if (!target) return false;

  return Math.hypot(
    player.x - target.x,
    player.y - target.y
  ) < 95;
}

function interact() {
  if (dialogueActive) {
    advanceDialogue();
    return;
  }

  if (mode !== "playing") return;
  if (!nearTarget()) return;

  if (chapter === 0) {
    chapterOneInteract();
  }

  else if (chapter === 1) {
    chapterTwoInteract();
  }

  else if (chapter === 2) {
    chapterThreeInteract();
  }
}

$("interact").addEventListener("click", interact);

// ==========================================
// KEYBOARD INPUT
// ==========================================

window.addEventListener("keydown", event => {
  const key = event.key.toLowerCase();

  if (
    ["arrowup", "arrowdown", "arrowleft",
     "arrowright", " "].includes(key)
  ) {
    event.preventDefault();
  }

  keys[key] = true;

  if (
    !event.repeat &&
    (key === "e" || key === " ")
  ) {
    interact();
  }
});

window.addEventListener("keyup", event => {
  keys[event.key.toLowerCase()] = false;
});

window.addEventListener("blur", () => {
  for (const key in keys) {
    keys[key] = false;
  }
});

// ==========================================
// PLAYER MOVEMENT
// ==========================================

function movePlayer(dt) {
  if (mode !== "playing" || dialogueActive) {
    return;
  }

  let dx = 0;
  let dy = 0;

  if (keys.a || keys.arrowleft) dx--;
  if (keys.d || keys.arrowright) dx++;

  if (keys.w || keys.arrowup) dy--;
  if (keys.s || keys.arrowdown) dy++;

  const length = Math.hypot(dx, dy);

  if (length > 0) {
    dx /= length;
    dy /= length;

    player.x += dx * player.speed * dt;
    player.y += dy * player.speed * dt;

    if (dx !== 0) {
      player.facing = dx > 0 ? 1 : -1;
    }
  }

  player.x = Math.max(
    25,
    Math.min(W - 25, player.x)
  );

  player.y = Math.max(
    195,
    Math.min(H - 28, player.y)
  );
}

function drawPerson(
  x,
  y,
  color,
  isKing = false
) {
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y));

  // Shadow
  ctx.fillStyle = "#0006";
  ctx.fillRect(-17, 18, 34, 7);

  // Legs
  ctx.fillStyle = "#292735";
  ctx.fillRect(-13, 8, 10, 19);
  ctx.fillRect(4, 8, 10, 19);

  // Body
  ctx.fillStyle = color;
  ctx.fillRect(-17, -23, 34, 37);

  // Face
  ctx.fillStyle = "#dfaa83";
  ctx.fillRect(-12, -44, 24, 23);

  // Hair
  ctx.fillStyle = "#49352c";
  ctx.fillRect(-13, -47, 26, 9);

  // Eyes
  ctx.fillStyle = "#18131d";
  ctx.fillRect(-8, -33, 5, 4);
  ctx.fillRect(5, -33, 5, 4);

  if (isKing) {
    // Crown
    ctx.fillStyle = "#efc25c";
    ctx.fillRect(-16, -56, 32, 10);
    ctx.fillRect(-16, -64, 6, 9);
    ctx.fillRect(-3, -69, 6, 14);
    ctx.fillRect(10, -64, 6, 9);

    // Corrupted eyes in later chapters
    if (chapter >= 2) {
      ctx.fillStyle = "#b32deb";
      ctx.fillRect(-8, -33, 5, 4);
      ctx.fillRect(5, -33, 5, 4);
    }
  }

  ctx.restore();
}

function drawPlayer() {
  drawPerson(
    player.x,
    player.y,
    "#657e9e"
  );

  // Knight sword
  const swordX =
    player.x + player.facing * 20;

  ctx.fillStyle = "#d1dce8";
  ctx.fillRect(swordX, player.y - 24, 5, 42);

  ctx.fillStyle = "#987442";
  ctx.fillRect(swordX - 8, player.y + 9, 21, 5);
}

function drawCrystal(x, y) {
  const pulse = Math.sin(time * 4) * 5;

  ctx.save();
  ctx.translate(x, y);

  ctx.fillStyle = "#8f30cd44";
  ctx.beginPath();
  ctx.arc(
    0,
    0,
    66 + pulse,
    0,
    Math.PI * 2
  );
  ctx.fill();

  ctx.fillStyle = "#652098";

  ctx.beginPath();
  ctx.moveTo(0, -65);
  ctx.lineTo(40, -15);
  ctx.lineTo(25, 48);
  ctx.lineTo(-27, 48);
  ctx.lineTo(-40, -15);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = "#b949ff";

  ctx.beginPath();
  ctx.moveTo(0, -57);
  ctx.lineTo(20, -10);
  ctx.lineTo(0, 38);
  ctx.lineTo(-15, -12);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = "#e9a7ff";
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.restore();
}

// ==========================================
// DRAW STORY CHARACTERS
// ==========================================

function drawTargets() {
  const targets = chapters[chapter].targets;
  const alreadyDrawn = new Set();

  for (const target of targets) {
    const id = target.x + "," + target.y;

    if (alreadyDrawn.has(id)) continue;
    alreadyDrawn.add(id);

    if (target.object === "crystal") {
      drawCrystal(target.x, target.y);
    }

    else if (
      target.object === "book" ||
      target.object === "door"
    ) {
      // Already drawn in the environment.
    }

    else {
      drawPerson(
        target.x,
        target.y,
        target.color,
        target.king
      );
    }
  }

  // Objective marker
  if (mode === "playing" && !dialogueActive) {
    const target = activeTarget();

    if (target) {
      ctx.textAlign = "center";
      ctx.font = "bold 28px Arial";
      ctx.fillStyle = "#ffe295";

      ctx.fillText(
        "!",
        target.x,
        target.y - 77 +
          Math.sin(time * 4) * 5
      );

      ctx.textAlign = "left";
    }
  }
}

// ==========================================
// MAIN DRAW FUNCTION
// ==========================================

function draw() {
  ctx.clearRect(0, 0, W, H);

  if (chapter === 0) {
    drawGoldenKingdom();
  }

  else if (chapter === 1) {
    drawMines();
  }

  else {
    drawSecretCastle();
  }

  drawTargets();
  drawPlayer();

  $("interact").style.display =
    nearTarget() ? "block" : "none";
}

// ==========================================
// MAIN GAME LOOP
// ==========================================

function gameLoop(timestamp) {
  const dt = Math.min(
    (timestamp - (lastTime || timestamp)) / 1000,
    0.05
  );

  lastTime = timestamp;
  time += dt;

  movePlayer(dt);
  draw();

  requestAnimationFrame(gameLoop);
}

// ==========================================
// START THE FORGOTTEN KING
// ==========================================

playScenes(
  openingScenes,
  () => startChapter(0),
  true
);

requestAnimationFrame(gameLoop);

</script>

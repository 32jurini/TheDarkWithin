
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TheDarkWithin: The Forgotten King</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #050508;
  color: #f4ead8;
  font-family: Georgia, serif;
}

#game {
  position: relative;
  max-width: 1100px;
  margin: auto;
  background: #08080e;
  overflow: hidden;
}

canvas {
  display: block;
  width: 100%;
  image-rendering: pixelated;
}

#screen {
  position: absolute;
  inset: 0;
  background: rgba(3,3,8,.97);
  z-index: 10;
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 45px 25px;
}

#screen.show { display: flex; }

#sceneLabel {
  font: bold 12px Arial;
  color: #ac8b58;
  letter-spacing: 5px;
  margin-bottom: 24px;
}

#sceneTitle {
  color: #e4c489;
  font-size: clamp(29px,5vw,54px);
  line-height: 1.2;
  font-weight: normal;
  max-width: 850px;
  text-shadow: 0 0 35px #d69a4a55;
}

#sceneText {
  color: #d0c6bd;
  font-size: clamp(16px,2.2vw,21px);
  line-height: 1.8;
  max-width: 720px;
  white-space: pre-line;
}

button {
  font-family: inherit;
  cursor: pointer;
}

.goldButton {
  padding: 14px 30px;
  background: #282014;
  border: 1px solid #b99b60;
  color: #f5dca6;
  letter-spacing: 2px;
  margin-top: 25px;
}

.goldButton:hover {
  background: #564025;
}

#skip {
  position: absolute;
  top: 15px;
  right: 15px;
  border: 1px solid #73634e;
  color: #d9c098;
  background: #141116;
  padding: 10px 14px;
  z-index: 11;
}

#hud {
  position: absolute;
  top: 15px;
  left: 15px;
  padding: 12px 15px;
  background: #08080cdd;
  border-left: 3px solid #cba65b;
  font: 13px Arial;
  max-width: 65%;
  display: none;
}

#chapterName {
  color: #ead19b;
  font-weight: bold;
  margin-bottom: 8px;
}

#dialogue {
  position: absolute;
  left: 5%;
  bottom: 69px;
  width: 90%;
  min-height: 130px;
  background: #090a11f5;
  border: 2px solid #a98956;
  padding: 20px;
  display: none;
  cursor: pointer;
}

#speaker {
  color: #e7c783;
  font-size: 20px;
  margin-bottom: 12px;
  font-weight: bold;
}

#speech {
  color: #eee7df;
  line-height: 1.6;
  font-size: 17px;
}

#dialogueHint {
  color: #aaa19b;
  text-align: right;
  font: 12px Arial;
  margin-top: 12px;
}

#interact {
  position: absolute;
  right: 22px;
  bottom: 100px;
  display: none;
  background: #3c2e19;
  color: #f8e8be;
  border: 1px solid #d2a960;
  padding: 13px 20px;
}

#controls {
  background: #101016;
  color: #ada6a0;
  padding: 15px;
  font: 13px Arial;
  text-align: center;
}

@media(max-width:600px) {
  #dialogue { bottom: 55px; padding: 13px; }
  #speech { font-size: 14px; }
  #speaker { font-size: 16px; }
  #interact { bottom: 66px; }
}
</style>
</head>

<body>

<div id="game">
  <canvas id="canvas" width="960" height="540"></canvas>

  <div id="hud">
    <div id="chapterName"></div>
    <div id="objective"></div>
  </div>

  <div id="screen" class="show">
    <button id="skip">SKIP INTRO</button>
    <div id="sceneLabel"></div>
    <h1 id="sceneTitle"></h1>
    <p id="sceneText"></p>
    <button class="goldButton" id="sceneNext">
      CONTINUE
    </button>
  </div>

  <div id="dialogue">
    <div id="speaker"></div>
    <div id="speech"></div>
    <div id="dialogueHint">
      E / SPACE / CLICK — Continue
    </div>
  </div>

  <button id="interact">E — INTERACT</button>

  <div id="controls">
    WASD / Arrow Keys — Move |
    E — Interact |
    Space / Click — Continue Dialogue
  </div>
</div>

<script>
"use strict";

// ========================================
// THE FORGOTTEN KING
// CHAPTERS 1 AND 2
// ========================================

const $ = id => document.getElementById(id);

const canvas = $("canvas");
const ctx = canvas.getContext("2d");

ctx.imageSmoothingEnabled = false;

const W = 960;
const H = 540;

let chapter = 0;
let stage = 0;
let mode = "cinematic";
let time = 0;
let last = 0;

const keys = {};

const player = {
  x: 470,
  y: 430,
  speed: 180,
  facing: 1
};

const chapterNames = [
  "The Golden Kingdom",
  "Beneath the Castle"
];

const objectives = [
  [
    "Speak with the Royal Guard",
    "Speak with the Villager",
    "Report to King Aldric"
  ],
  [
    "Speak with King Aldric",
    "Find the Injured Miner",
    "Investigate the Purple Crystal",
    "Return to King Aldric"
  ]
];

// ========================================
// CINEMATIC ENGINE
// ========================================

let scenes = [];
let sceneIndex = 0;
let afterScenes = null;

function cinematic(sequence, finished) {
  scenes = sequence;
  sceneIndex = 0;
  afterScenes = finished;
  mode = "cinematic";

  $("screen").classList.add("show");
  $("hud").style.display = "none";

  showScene();
}

function showScene() {
  const scene = scenes[sceneIndex];

  $("sceneLabel").textContent =
    scene.label || "THE FORGOTTEN KING";

  $("sceneTitle").textContent =
    scene.title;

  $("sceneText").textContent =
    scene.text || "";

  $("sceneNext").textContent =
    sceneIndex === scenes.length - 1
      ? "CONTINUE STORY"
      : "CONTINUE";
}

function nextScene() {
  if (mode !== "cinematic") return;

  sceneIndex++;

  if (sceneIndex < scenes.length) {
    showScene();
    return;
  }

  $("screen").classList.remove("show");

  const callback = afterScenes;
  afterScenes = null;

  mode = "playing";

  $("hud").style.display = "block";

  if (callback) callback();
}

$("sceneNext").addEventListener(
  "click", nextScene
);

$("skip").addEventListener("click", () => {
  if (chapter === 0 && stage === 0) {
    $("screen").classList.remove("show");
    startChapter(0);
  } else {
    nextScene();
  }
});

// ========================================
// OPENING PREQUEL CUTSCENE
// ========================================

const openingScenes = [
  {
    label: "A STORY FROM THE PAST",
    title: "HUNDREDS OF YEARS EARLIER...",
    text:
      "Long before the villagers disappeared.\n" +
      "Before the darkness consumed the land."
  },
  {
    label: "THE AGE OF PEACE",
    title: "A KINGDOM OF LIGHT",
    text:
      "There was once a kingdom ruled by a beloved king.\n" +
      "Its people knew neither fear nor darkness."
  },
  {
    label: "DEEP BELOW THE CASTLE",
    title: "AN ANCIENT DISCOVERY",
    text:
      "Miners uncovered a mysterious purple crystal.\n" +
      "Something within it had been waiting for centuries."
  },
  {
    label: "A WARNING",
    title: "POWER ALWAYS HAS A PRICE",
    text:
      "The king saw a miracle.\n" +
      "But something inside the crystal saw an opportunity."
  },
  {
    label: "THEDARKWITHIN",
    title: "THE FORGOTTEN KING",
    text:
      "The story of the kingdom's final days.\n" +
      "And the knight who witnessed its fall."
  }
];

// ========================================
// DIALOGUE SYSTEM
// ========================================

let dialogueLines = [];
let dialogueIndex = 0;
let dialogueActive = false;
let dialogueFinished = null;

function talk(lines, finished) {
  dialogueLines = lines;
  dialogueIndex = 0;
  dialogueActive = true;
  dialogueFinished = finished || null;

  $("dialogue").style.display = "block";
  showLine();
}

function showLine() {
  const line = dialogueLines[dialogueIndex];

  $("speaker").textContent = line[0];
  $("speech").textContent = line[1];
}

function advanceDialogue() {
  if (!dialogueActive) return;

  dialogueIndex++;

  if (dialogueIndex < dialogueLines.length) {
    showLine();
    return;
  }

  dialogueActive = false;
  $("dialogue").style.display = "none";

  const callback = dialogueFinished;
  dialogueFinished = null;

  if (callback) callback();
}

$("dialogue").addEventListener(
  "click", advanceDialogue
);

// ========================================
// CHAPTER SYSTEM
// ========================================

function updateHUD() {
  $("chapterName").textContent =
    "CHAPTER " + (chapter + 1) +
    " — " + chapterNames[chapter];

  $("objective").textContent =
    "OBJECTIVE: " +
    (
      objectives[chapter][stage] ||
      "Continue the story"
    );
}

function startChapter(number) {
  chapter = number;
  stage = 0;
  mode = "playing";

  player.x = 470;
  player.y = 430;

  $("screen").classList.remove("show");
  $("hud").style.display = "block";

  updateHUD();

  if (chapter === 0) {
    talk([
      [
        "Narrator",
        "The Golden Kingdom. Hundreds of years " +
        "before the events of TheDarkWithin."
      ],
      [
        "Narrator",
        "You are Sir Aeron, the king's most trusted knight."
      ],
      [
        "Sir Aeron",
        "Another peaceful morning. " +
        "I should report to His Majesty."
      ]
    ]);
  }

  if (chapter === 1) {
    talk([
      [
        "Narrator",
        "Far beneath the castle, the air grows cold."
      ],
      [
        "Sir Aeron",
        "These tunnels feel wrong. " +
        "The miners should never have come this deep."
      ],
      [
        "King Aldric",
        "Come, Aeron. We must see what they discovered."
      ]
    ]);
  }
}

function advanceStage() {
  stage++;
  updateHUD();
}

// ========================================
// CHAPTER ONE DIALOGUE
// ========================================

function chapterOneInteract() {
  if (stage === 0) {
    talk([
      [
        "Royal Guard",
        "Sir Aeron! The capital is peaceful today."
      ],
      [
        "Sir Aeron",
        "Then why are the guards so restless?"
      ],
      [
        "Royal Guard",
        "The king ordered the miners deeper beneath " +
        "the castle. No one knows why."
      ],
      [
        "Sir Aeron",
        "I will investigate."
      ]
    ], advanceStage);
  }

  else if (stage === 1) {
    talk([
      [
        "Villager",
        "Sir Aeron, my brother works in the mines."
      ],
      [
        "Villager",
        "He told me they discovered a purple light."
      ],
      [
        "Villager",
        "He said it whispered his name."
      ],
      [
        "Sir Aeron",
        "A whisper from the stone? " +
        "I must speak with His Majesty."
      ]
    ], advanceStage);
  }

  else if (stage === 2) {
    talk([
      [
        "King Aldric",
        "Aeron, my loyal friend. " +
        "You seem troubled."
      ],
      [
        "Sir Aeron",
        "Your Majesty, what have the miners found?"
      ],
      [
        "King Aldric",
        "Something extraordinary. " +
        "Something that could protect us forever."
      ],
      [
        "Royal Messenger",
        "YOUR MAJESTY! One of the miners has vanished!"
      ],
      [
        "Royal Messenger",
        "And the crystal... " +
        "it has started glowing again!"
      ],
      [
        "King Aldric",
        "Prepare the expedition. " +
        "We descend immediately."
      ]
    ], chapterOneEnding);
  }
}

function chapterOneEnding() {
  cinematic([
    {
      label: "CHAPTER I COMPLETE",
      title: "THE GOLDEN KINGDOM",
      text:
        "The peaceful kingdom has been disturbed.\n" +
        "Something beneath the castle has awakened."
    },
    {
      label: "THE NEXT CHAPTER",
      title: "BENEATH THE CASTLE",
      text:
        "King Aldric and Sir Aeron enter the royal mines.\n" +
        "Neither knows what waits below."
    }
  ], () => startChapter(1));
}

// ========================================
// CHAPTER TWO
// ========================================

function chapterTwoInteract() {
  if (stage === 0) {
    talk([
      [
        "King Aldric",
        "Look at these tunnels, Aeron. " +
        "They extend far beyond the castle."
      ],
      [
        "Sir Aeron",
        "Your Majesty, these markings aren't ours."
      ],
      [
        "King Aldric",
        "Our ancestors must have built something here."
      ],
      [
        "Sir Aeron",
        "Then why was its existence forgotten?"
      ],
      [
        "King Aldric",
        "Find the missing miners. " +
        "I will examine these walls."
      ]
    ], advanceStage);
  }

  else if (stage === 1) {
    talk([
      [
        "Injured Miner",
        "Stay back! Please... don't let it hear you."
      ],
      [
        "Sir Aeron",
        "Calm yourself. I am Sir Aeron."
      ],
      [
        "Injured Miner",
        "We broke through the final wall. " +
        "There was a crystal."
      ],
      [
        "Injured Miner",
        "Then the whispers started."
      ],
      [
        "Sir Aeron",
        "What happened to the others?"
      ],
      [
        "Injured Miner",
        "They followed the voice into the darkness."
      ],
      [
        "Injured Miner",
        "It knows our names, Sir Aeron."
      ],
      [
        "Injured Miner",
        "And it said... the king would come."
      ]
    ], () => {
      advanceStage();

      cinematic([
        {
          label: "DEEP IN THE ROYAL MINES",
          title: "THE WHISPERS",
          text:
            "A cold wind passes through the tunnels.\n" +
            "The torches flicker, although no wind should reach this far."
        },
        {
          label: "AN UNKNOWN VOICE",
          title: "\"HE IS NEAR...\"",
          text:
            "\"The one who will carry our power...\"\n" +
            "\"The king approaches.\""
        }
      ], () => {
        mode = "playing";
        updateHUD();
      });
    });
  }

  else if (stage === 2) {
    talk([
      [
        "Sir Aeron",
        "So this is what the miners discovered..."
      ],
      [
        "Sir Aeron",
        "A purple crystal... " +
        "buried beneath an ancient seal."
      ],
      [
        "Unknown Voice",
        "...Aeron..."
      ],
      [
        "Sir Aeron",
        "WHO'S THERE?!"
      ],
      [
        "Unknown Voice",
        "You cannot stop what has already begun."
      ]
    ], () => {
      advanceStage();

      cinematic([
        {
          label: "THE SEALED CHAMBER",
          title: "THE CRYSTAL AWAKENS",
          text:
            "The crystal releases a pulse of violet light.\n" +
            "The cavern trembles."
        },
        {
          label: "THE FIRST WARNING",
          title: "SOMETHING IS WATCHING",
          text:
            "For a moment, a dark silhouette appears within the crystal.\n" +
            "Then it disappears."
        }
      ], () => {
        mode = "playing";
        updateHUD();
      });
    });
  }

  else if (stage === 3) {
    talk([
      [
        "Sir Aeron",
        "Your Majesty, we have to leave. " +
        "This thing is dangerous."
      ],
      [
        "King Aldric",
        "Dangerous? No, Aeron..."
      ],
      [
        "King Aldric",
        "I felt its power. " +
        "It showed me a kingdom without suffering."
      ],
      [
        "Sir Aeron",
        "The crystal spoke to you?"
      ],
      [
        "King Aldric",
        "It offered me a way to protect our people."
      ],
      [
        "Sir Aeron",
        "We don't know what it wants in return."
      ],
      [
        "King Aldric",
        "I am their king. " +
        "It is my duty to protect them."
      ],
      [
        "Unknown Voice",
        "Yes... my king..."
      ],
      [
        "Sir Aeron",
        "Your Majesty? Your eyes..."
      ],
      [
        "King Aldric",
        "What about my eyes, Aeron?"
      ]
    ], chapterTwoEnding);
  }
}

// ========================================
// CHAPTER TWO ENDING CUTSCENE
// ========================================

function chapterTwoEnding() {
  cinematic([
    {
      label: "THE PURPLE CRYSTAL",
      title: "THE FIRST CORRUPTION",
      text:
        "King Aldric places his hand upon the crystal.\n" +
        "Purple energy spreads through his fingers."
    },
    {
      label: "SIR AERON",
      title: "\"YOUR MAJESTY, STOP!\"",
      text:
        "Aeron tries to pull the king away.\n" +
        "But Aldric no longer hears him."
    },
    {
      label: "AN ANCIENT VOICE",
      title: "\"AT LAST...\"",
      text:
        "\"A ruler willing to sacrifice everything.\"\n" +
        "\"You will make a beautiful king.\""
    },
    {
      label: "CHAPTER II COMPLETE",
      title: "BENEATH THE CASTLE",
      text:
        "The expedition returns to the surface.\n" +
        "But King Aldric has brought something back with him."
    },
    {
      label: "TO BE CONTINUED",
      title: "CHAPTER III: THE KING'S SECRET",
      text:
        "The king begins to change.\n" +
        "And Sir Aeron must uncover what happened in the mines."
    }
  ], showChapterTwoComplete);
}

function showChapterTwoComplete() {
  mode = "complete";

  $("screen").classList.add("show");
  $("hud").style.display = "none";

  $("sceneLabel").textContent =
    "THE FORGOTTEN KING";

  $("sceneTitle").textContent =
    "TO BE CONTINUED";

  $("sceneText").textContent =
    "Chapters 1 and 2 complete!\n" +
    "Chapter 3: The King's Secret is coming next.";

  $("sceneNext").textContent = "REPLAY STORY";
  $("skip").style.display = "none";

  $("sceneNext").onclick = () => {
    location.reload();
  };
}

// ========================================
// INTERACTION TARGETS
// ========================================

const chapterOneNPCs = [
  { x: 235, y: 405, name: "Royal Guard", color: "#7d8ca0" },
  { x: 730, y: 420, name: "Villager", color: "#a36b52" },
  { x: 480, y: 210, name: "King Aldric", color: "#d3aa55", king: true }
];

const chapterTwoNPCs = [
  { x: 360, y: 325, name: "King Aldric", color: "#d3aa55", king: true },
  { x: 720, y: 420, name: "Injured Miner", color: "#8f665b" },
  { x: 510, y: 285, name: "Purple Crystal", crystal: true },
  { x: 360, y: 325, name: "King Aldric", color: "#d3aa55", king: true }
];

function activeTarget() {
  return chapter === 0
    ? chapterOneNPCs[stage]
    : chapterTwoNPCs[stage];
}

function nearTarget() {
  if (mode !== "playing" || dialogueActive) {
    return false;
  }

  const target = activeTarget();
  if (!target) return false;

  return Math.hypot(
    player.x - target.x,
    player.y - target.y
  ) < 92;
}

function interact() {
  if (dialogueActive) {
    advanceDialogue();
    return;
  }

  if (mode !== "playing") return;
  if (!nearTarget()) return;

  if (chapter === 0) {
    chapterOneInteract();
  } else {
    chapterTwoInteract();
  }
}

$("interact").addEventListener("click", interact);

// ========================================
// KEYBOARD MOVEMENT
// ========================================

window.addEventListener("keydown", event => {
  const key = event.key.toLowerCase();

  if (
    ["arrowup", "arrowdown", "arrowleft",
     "arrowright", " "].includes(key)
  ) {
    event.preventDefault();
  }

  keys[key] = true;

  if (!event.repeat && (key === "e" || key === " ")) {
    interact();
  }
});

window.addEventListener("keyup", event => {
  keys[event.key.toLowerCase()] = false;
});

window.addEventListener("blur", () => {
  for (const key in keys) keys[key] = false;
});

function movePlayer(dt) {
  if (mode !== "playing" || dialogueActive) return;

  let x = 0;
  let y = 0;

  if (keys.a || keys.arrowleft) x--;
  if (keys.d || keys.arrowright) x++;
  if (keys.w || keys.arrowup) y--;
  if (keys.s || keys.arrowdown) y++;

  const length = Math.hypot(x, y);

  if (length > 0) {
    x /= length;
    y /= length;

    player.x += x * player.speed * dt;
    player.y += y * player.speed * dt;

    if (x !== 0) {
      player.facing = x > 0 ? 1 : -1;
    }
  }

  player.x = Math.max(25, Math.min(W - 25, player.x));
  player.y = Math.max(190, Math.min(H - 30, player.y));
}

// ========================================
// GRAPHICS — PIXEL ART CHARACTERS
// ========================================

function drawPerson(x, y, color, king = false) {
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y));

  ctx.fillStyle = "#0005";
  ctx.fillRect(-17, 18, 34, 7);

  ctx.fillStyle = "#302a32";
  ctx.fillRect(-13, 8, 10, 19);
  ctx.fillRect(4, 8, 10, 19);

  ctx.fillStyle = color;
  ctx.fillRect(-17, -23, 34, 37);

  ctx.fillStyle = "#dfaa83";
  ctx.fillRect(-12, -44, 24, 23);

  ctx.fillStyle = "#49352c";
  ctx.fillRect(-13, -47, 26, 9);

  ctx.fillStyle = "#161019";
  ctx.fillRect(-8, -33, 5, 4);
  ctx.fillRect(5, -33, 5, 4);

  if (king) {
    ctx.fillStyle = "#f3c95b";
    ctx.fillRect(-16, -56, 32, 10);
    ctx.fillRect(-16, -64, 6, 9);
    ctx.fillRect(-3, -69, 6, 14);
    ctx.fillRect(10, -64, 6, 9);

    if (chapter === 1 && stage >= 3) {
      ctx.fillStyle = "#ba30ec";
      ctx.fillRect(-8, -33, 5, 4);
      ctx.fillRect(5, -33, 5, 4);
    }
  }

  ctx.restore();
}

function drawCrystal(x, y) {
  const pulse = Math.sin(time * 4) * 6;

  ctx.save();
  ctx.translate(x, y);

  ctx.fillStyle = "#7d28ac55";
  ctx.beginPath();
  ctx.arc(0, 0, 65 + pulse, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#67209f";
  ctx.beginPath();
  ctx.moveTo(0, -65);
  ctx.lineTo(40, -15);
  ctx.lineTo(28, 48);
  ctx.lineTo(-30, 48);
  ctx.lineTo(-40, -15);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = "#b94bff";
  ctx.beginPath();
  ctx.moveTo(0, -60);
  ctx.lineTo(20, -10);
  ctx.lineTo(0, 42);
  ctx.lineTo(-15, -12);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = "#edb4ff";
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.restore();
}

function drawNPCs() {
  const npcs =
    chapter === 0 ? chapterOneNPCs : chapterTwoNPCs;

  const shown = new Set();

  npcs.forEach(npc => {
    const key = npc.x + "," + npc.y;

    if (shown.has(key)) return;
    shown.add(key);

    if (npc.crystal) {
      drawCrystal(npc.x, npc.y);
    } else {
      drawPerson(npc.x, npc.y, npc.color, npc.king);
    }
  });

  if (mode === "playing" && !dialogueActive) {
    const target = activeTarget();

    if (target) {

// ========================================
// CHAPTER 2 — UNDERGROUND MINES
// ========================================

function drawMines() {
  ctx.fillStyle = "#15101c";
  ctx.fillRect(0,0,W,H);

  // Purple glow around crystal chamber.
  const glow = ctx.createRadialGradient(
    510,275,15,
    510,275,340
  );

  glow.addColorStop(0,"#512075");
  glow.addColorStop(1,"#15101c");

  ctx.fillStyle = glow;
  ctx.fillRect(0,0,W,H);

  // Cave ceiling.
  ctx.fillStyle = "#090910";

  for (let x=0;x<W;x+=65) {
    const size = 50+(x*7%80);

    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x+35,size);
    ctx.lineTo(x+65,0);
    ctx.fill();
  }

  // Cave floor.
  ctx.fillStyle = "#302838";
  ctx.fillRect(0,365,W,175);

  for (let i=0;i<50;i++) {
    const x = (i*137)%W;
    const y = 370+(i*79)%160;

    ctx.fillStyle =
      i%3===0 ? "#4b3855" : "#221b29";

    ctx.fillRect(x,y,15,6);
  }

  // Wooden supports.
  for (const x of [130,810]) {
    ctx.fillStyle = "#59432c";
    ctx.fillRect(x,120,18,300);
    ctx.fillRect(x-35,118,95,18);
  }

  // Torches.
  for (const x of [165,830]) {
    ctx.fillStyle = "#754f2e";
    ctx.fillRect(x,255,8,28);

    ctx.fillStyle = "#ff982d";
    ctx.beginPath();
    ctx.arc(x+4,245,12+Math.sin(time*9)*2,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle = "#ffdf72";
    ctx.beginPath();
    ctx.arc(x+4,244,5,0,Math.PI*2);
    ctx.fill();
  }

  // Old mining rails.
  ctx.strokeStyle = "#625566";
  ctx.lineWidth = 5;

  ctx.beginPath();
  ctx.moveTo(390,540);
  ctx.lineTo(470,350);
  ctx.moveTo(620,540);
  ctx.lineTo(545,350);
  ctx.stroke();

  // Tracks.
  for (let i=0;i<8;i++) {
    const y = 385+i*22;
    const half = 35+i*12;

    ctx.strokeStyle = "#68513a";
    ctx.lineWidth = 6;

    ctx.beginPath();
    ctx.moveTo(508-half,y);
    ctx.lineTo(508+half,y);
    ctx.stroke();
  }
}

// ========================================
// GAME LOOP
// ========================================

function draw() {
  if (chapter === 0) {
    drawCastle();
  } else {
    drawMines();
  }

  drawNPCs();
  drawPlayer();

  $("interact").style.display =
    nearTarget() ? "block" : "none";
}

function loop(timestamp) {
  const dt = Math.min(
    (timestamp-(last||timestamp))/1000,
    0.05
  );

  last = timestamp;
  time += dt;

  movePlayer(dt);
  draw();

  requestAnimationFrame(loop);
}

    // Hanging royal banners.
    for (const x of [130, 770]) {
      ctx.fillStyle = "#702b3d";
      ctx.fillRect(x, 65, 55, 160);

      ctx.fillStyle = "#d9b56a";
      ctx.fillRect(x + 22, 90, 12, 80);
    }

    // Glowing torches.
    for (const x of [90, 865]) {
      ctx.fillStyle = "#796047";
      ctx.fillRect(x, 195, 9, 47);

      ctx.fillStyle = "#ec9c48";
      ctx.beginPath();
      ctx.arc(
        x + 4,
        180,
        14 + Math.sin(time * 8) * 3,
        0,
        Math.PI * 2
      );
      ctx.fill();
    }

    // King's forbidden chamber.
    ctx.fillStyle = "#120e19";
    ctx.fillRect(610, 160, 90, 140);

    ctx.strokeStyle = "#7e438a";
    ctx.lineWidth = 5;
    ctx.strokeRect(610, 160, 90, 140);

    ctx.fillStyle = "#b34ee3";
    ctx.fillRect(678, 224, 8, 8);

    // Research table.
    ctx.fillStyle = "#59402e";
    ctx.fillRect(425, 310, 80, 15);
    ctx.fillRect(435, 325, 9, 35);
    ctx.fillRect(485, 325, 9, 35);

    // Secret journal.
    ctx.fillStyle = "#c3ae83";
    ctx.fillRect(450, 300, 38, 11);

    ctx.strokeStyle = "#69472e";
    ctx.lineWidth = 2;
    ctx.strokeRect(450, 300, 38, 11);

    // A faint purple mist.
    ctx.fillStyle =
      "rgba(136,49,174,0.12)";

    for (let i = 0; i < 9; i++) {
      const x =
        (i * 127 + time * 12) % W;

      const y =
        300 + Math.sin(time + i) * 18;

      ctx.beginPath();
      ctx.ellipse(
        x,
        y,
        60,
        15,
        0,
        0,
        Math.PI * 2
      );
      ctx.fill();
    }
  }

  // ==========================================
  // DRAW CHAPTER 3 CHARACTERS
  // ==========================================

  function drawChapterThreeNPCs() {
    const drawn = new Set();

    for (const npc of chapterThreeNPCs) {
      // Avoid drawing King Aldric twice.
      const key = npc.x + "," + npc.y;

      if (drawn.has(key)) continue;
      drawn.add(key);

      if (npc.object === "records") {
        // The book is already on the table.
      } else if (npc.object === "door") {
        // The chamber is already in the background.
      } else {
        drawPerson(
          npc.x,
          npc.y,
          npc.color,
          npc.king
        );
      }
    }

    if (
      mode === "playing" &&
      !dialogueActive
    ) {
      const npc = activeTarget();

      if (npc) {
        ctx.fillStyle = "#ffe19e";
        ctx.font = "bold 28px Arial";
        ctx.textAlign = "center";

        ctx.fillText(
          "!",
          npc.x,
          npc.y - 75 +
            Math.sin(time * 4) * 5
        );

        ctx.textAlign = "left";
      }
    }
  }

  // ==========================================
  // USE NEW GRAPHICS FOR CHAPTER 3
  // ==========================================

  const originalDraw = draw;

  draw = function() {
    if (chapter !== 2) {
      originalDraw();
      return;
    }

    drawSecretCastle();

    drawChapterThreeNPCs();

    drawPlayer();

    $("interact").style.display =
      nearTarget() ? "block" : "none";
  };

  // ==========================================
  // END OF CHAPTER THREE
  // ==========================================

</script>

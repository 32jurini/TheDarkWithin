
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TheDarkWithin — Official Story Launcher>

<style>
* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  --accent: #e5bb73;
  --bright: #ffe2a6;
  --background: #110b1b;
  --panel: #21162d;
  --panel2: #30213f;
  --border: #8867a0;
  --muted: #c6b9d0;
  --glow: #8743bd;

  margin: 0;
  min-height: 100vh;
  background: var(--background);
  color: #f5efff;
  font-family: Arial, Helvetica, sans-serif;
  transition: background .4s;
}

/* =====================================
   EACH GAME HAS ITS OWN THEME
   ===================================== */

body.theme-king {
  --accent: #e5bb73;
  --bright: #ffe2a6;
  --background: #110b1b;
  --panel: #21162d;
  --panel2: #30213f;
  --border: #8867a0;
  --muted: #c6b9d0;
  --glow: #8743bd;
}

body.theme-main {
  --accent: #6ee59b;
  --bright: #c4ffd5;
  --background: #060f0a;
  --panel: #111d16;
  --panel2: #1a3323;
  --border: #3c8052;
  --muted: #aec7b5;
  --glow: #247f4a;
}

body.theme-spirit {
  --accent: #86d9ff;
  --bright: #d2efff;
  --background: #090920;
  --panel: #171633;
  --panel2: #292454;
  --border: #756ad1;
  --muted: #bdbbe6;
  --glow: #6a4bdf;
}

body.theme-light {
  --accent: #ffc47b;
  --bright: #ffe8bc;
  --background: #1b100d;
  --panel: #2d1d19;
  --panel2: #453026;
  --border: #9f744e;
  --muted: #d5bdae;
  --glow: #d37b36;
}

/* =====================================
   WEBSITE HEADER
   ===================================== */

header {
  text-align: center;
  padding: 28px 16px;
  background: #08090eea;
  border-bottom: 2px solid var(--accent);
}

header h1 {
  margin: 0;
  font-size: clamp(30px, 6vw, 58px);
  letter-spacing: 3px;
}

header h1 span {
  color: var(--accent);
}

header p {
  margin: 12px 0 0;
  font-size: 12px;
  letter-spacing: 3px;
  color: var(--muted);
}

/* =====================================
   LAUNCHER
   ===================================== */

.launcher {
  max-width: 1120px;
  margin: 25px auto 0;
  padding: 0 12px;
}

.launcher-label {
  color: var(--muted);
  text-align: center;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 2px;
  margin-bottom: 13px;
}

.launcher-card {
  position: relative;
  min-height: 465px;
  border: 2px solid var(--accent);
  border-radius: 14px;
  overflow: hidden;
  isolation: isolate;
  background: #120d20;
  transition: border-color .35s;
}

/* THEMED SKY */

.launcher-card::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -3;
  background:
    radial-gradient(circle at 75% 28%, #704aab, transparent 43%),
    linear-gradient(110deg, #241630, #100b1a);
}

.theme-main .launcher-card::before {
  background:
    radial-gradient(circle at 75% 28%, #267f48, transparent 43%),
    linear-gradient(110deg, #102618, #050b08);
}

.theme-spirit .launcher-card::before {
  background:
    radial-gradient(circle at 75% 28%, #6652d8, transparent 45%),
    linear-gradient(110deg, #16264d, #0d0b29);
}

.theme-light .launcher-card::before {
  background:
    radial-gradient(circle at 75% 28%, #ea934a, transparent 47%),
    linear-gradient(110deg, #4c2925, #180e12);
}

/* =====================================
   PIXEL SCENERY
   ===================================== */

.scenery {
  position: absolute;
  inset: 0;
  z-index: -1;
  overflow: hidden;
  pointer-events: none;
}

.moon {
  position: absolute;
  top: 45px;
  right: 15%;
  width: 150px;
  height: 150px;
  border-radius: 50%;
  background: #e1bdff;
  box-shadow: 0 0 65px var(--glow);
  opacity: .85;
}

.theme-main .moon {
  background: #79f4a3;
}

.theme-spirit .moon {
  background: #b3deff;
  box-shadow: 0 0 95px #9a83ff;
}

.theme-light .moon {
  background: #ffe4a5;
  box-shadow: 0 0 100px #ffae59;
}

.hills {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 205px;
  background: #1a122b;
  clip-path: polygon(
    0 45%, 8% 12%, 17% 48%,
    28% 5%, 37% 57%, 48% 23%,
    59% 55%, 70% 8%, 80% 50%,
    92% 15%, 100% 43%,
    100% 100%, 0 100%
  );
}

.theme-main .hills {
  background: #06170d;
}

.theme-spirit .hills {
  background: #171340;
}

.theme-light .hills {
  background: #382219;
}

/* ROYAL CASTLE */

.castle {
  position: absolute;
  right: 12%;
  bottom: 30px;
  width: 235px;
  height: 165px;
  opacity: .85;
  transition: opacity .3s;
}

.castle-body {
  position: absolute;
  left: 38px;
  bottom: 0;
  width: 159px;
  height: 145px;
  background: #b59886;
}

.castle-tower {
  position: absolute;
  bottom: 0;
  width: 58px;
  height: 205px;
  background: #d5b28b;
}

.castle-tower.left { left: 0; }
.castle-tower.right { right: 0; }

.castle-tower::before {
  content: "";
  position: absolute;
  top: -40px;
  width: 100%;
  height: 43px;
  background: #7540a1;
  clip-path: polygon(50% 0, 100% 100%, 0 100%);
}

.castle-door {
  position: absolute;
  left: 90px;
  bottom: 0;
  width: 56px;
  height: 90px;
  background: #28172f;
  border-radius: 30px 30px 0 0;
}

.theme-main .castle {
  filter: brightness(.3) hue-rotate(70deg);
  opacity: .65;
}

.theme-spirit .castle {
  opacity: 0;
}

.theme-light .castle {
  filter: sepia(.7);
  opacity: .5;
}

/* PURPLE CRYSTAL */

.crystal {
  position: absolute;
  top: 65px;
  right: 35%;
  width: 68px;
  height: 110px;
  background: linear-gradient(
    125deg, #f7caff, #9b47ed, #4d0c8c
  );
  clip-path: polygon(
    50% 0, 100% 30%, 85% 80%,
    50% 100%, 15% 80%, 0 30%
  );
  filter: drop-shadow(0 0 20px #ac57ff);
  animation: float 3s ease-in-out infinite;
}

.theme-main .crystal {
  opacity: 0;
}

.theme-spirit .crystal {
  opacity: .65;
}

.theme-light .crystal {
  opacity: .2;
}

@keyframes float {
  50% { transform: translateY(-14px); }
}

/* FLOATING SPIRIT ISLANDS */

.floating-island {
  position: absolute;
  background: #342b72;
  border-top: 10px solid #a99aff;
  clip-path: polygon(
    0 0, 100% 0, 100% 35%,
    65% 100%, 30% 75%, 0 35%
  );
  opacity: 0;
}

.island-one {
  right: 10%;
  bottom: 55px;
  width: 165px;
  height: 95px;
  animation: float 4s ease-in-out infinite;
}

.island-two {
  right: 32%;
  bottom: 170px;
  width: 120px;
  height: 76px;
  animation: float 3.3s ease-in-out infinite reverse;
}

.island-three {
  right: 5%;
  bottom: 260px;
  width: 100px;
  height: 65px;
  animation: float 5s ease-in-out infinite;
}

.theme-spirit .floating-island {
  opacity: 1;
}

/* =====================================
   LEFT AND RIGHT ARROWS
   ===================================== */

.arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  z-index: 4;
  height: 63px;
  width: 49px;
  border: 1px solid var(--accent);
  background: #070815d9;
  color: var(--bright);
  border-radius: 8px;
  font-size: 34px;
  cursor: pointer;
}

.arrow:hover:not(:disabled) {
  background: var(--panel2);
}

.arrow:disabled {
  opacity: .25;
  cursor: default;
}

.arrow.left { left: 12px; }
.arrow.right { right: 12px; }

/* =====================================
   GAME INFO
   ===================================== */

.hero-content {
  position: relative;
  z-index: 2;
  min-height: 465px;
  max-width: 720px;
  padding: 55px 85px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.era {
  color: var(--bright);
  font-weight: bold;
  font-size: 12px;
  letter-spacing: 2px;
  text-shadow: 0 2px 6px black;
}

.status {
  display: inline-block;
  align-self: flex-start;
  background: #090716ce;
  border: 1px solid var(--accent);
  color: var(--bright);
  border-radius: 5px;
  padding: 8px 12px;
  margin-top: 15px;
  font-size: 11px;
  font-weight: bold;
}

.hero-content h2 {
  color: white;
  font-size: clamp(29px, 5.4vw, 58px);
  margin: 20px 0 12px;
  line-height: 1.1;
  text-shadow: 0 3px 16px black;
}

.hero-content p {
  color: #f1ecf6;
  font-size: 16px;
  line-height: 1.75;
  max-width: 520px;
  text-shadow: 0 2px 9px black;
}

.play {
  display: inline-block;
  align-self: flex-start;
  background: var(--accent);
  color: #100b18;
  border: 2px solid var(--bright);
  border-radius: 6px;
  padding: 15px 25px;
  margin-top: 13px;
  font-weight: 900;
  text-decoration: none;
}

.play:hover {
  filter: brightness(1.15);
}

.play.locked {
  background: #39333d;
  border-color: #716b76;
  color: #bbb4c4;
  pointer-events: none;
}

/* POSITION INDICATOR */

.progress {
  display: flex;
  justify-content: center;
  gap: 10px;
  padding: 18px 0;
}

.progress-dot {
  width: 12px;
  height: 12px;
  border: 1px solid var(--border);
  border-radius: 30px;
  background: var(--panel2);
  cursor: pointer;
}

.progress-dot.active {
  width: 30px;
  background: var(--accent);
}

.progress-label {
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  margin: 0 0 20px;
}

/* =====================================
   FOUR TABS — VERSIONS REMOVED
   ===================================== */

nav {
  max-width: 1100px;
  margin: 12px auto 0;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 2px;
  background: var(--border);
  border: 1px solid var(--border);
}

nav button {
  border: 0;
  background: var(--panel);
  color: var(--muted);
  padding: 19px 6px;
  font-weight: bold;
  cursor: pointer;
}

nav button.active,
nav button:hover {
  background: var(--panel2);
  color: var(--bright);
}

main {
  max-width: 1100px;
  margin: 0 auto;
  padding: 27px 15px 65px;
}

.tab {
  display: none;
}

.tab.active {
  display: block;
}

h2, h3 {
  color: var(--bright);
}

p {
  color: var(--muted);
  line-height: 1.7;
}

.grid {
  display: grid;
  grid-template-columns:
    repeat(auto-fit, minmax(245px, 1fr));
  gap: 20px;
  margin-top: 20px;
}

.card {
  border: 1px solid var(--border);
  background: var(--panel);
  border-radius: 10px;
  padding: 24px;
}

.badge {
  display: inline-block;
  border: 1px solid var(--accent);
  color: var(--bright);
  border-radius: 5px;
  padding: 7px 10px;
  font-size: 11px;
  font-weight: bold;
  margin-bottom: 10px;
}

.badge.planned {
  border-color: #77717d;
  color: #bbb3c5;
}

.link {
  display: inline-block;
  text-decoration: none;
  color: #120d18;
  background: var(--accent);
  padding: 12px 19px;
  margin-top: 10px;
  font-weight: bold;
  border-radius: 5px;
}

.link:hover {
  filter: brightness(1.15);
}

/* =====================================
   TIMELINE
   ===================================== */

.timeline {
  padding-left: 34px;
  border-left: 4px solid var(--accent);
  margin: 30px 0;
}

.timeline-entry {
  position: relative;
  margin-bottom: 24px;
  padding: 25px;
  border-radius: 10px;
  background: var(--panel);
  border: 1px solid var(--border);
}

.timeline-entry::before {
  content: "";
  position: absolute;
  left: -46px;
  top: 27px;
  width: 19px;
  height: 19px;
  border-radius: 50%;
  background: var(--accent);
  border: 3px solid var(--background);
}

.timeline-era {
  display: block;
  color: var(--accent);
  letter-spacing: 2px;
  font-size: 12px;
  font-weight: bold;
}

.timeline-note {
  color: var(--bright);
  padding: 12px;
  background: var(--panel2);
  border-left: 3px solid var(--accent);
  font-size: 13px;
  line-height: 1.7;
}

/* FOOTER */

.pixelground {
  height: 85px;
  background: repeating-linear-gradient(
    90deg,
    var(--panel2) 0 25px,
    var(--background) 25px 45px,
    var(--panel) 45px 65px
  );
}

footer {
  border-top: 1px solid var(--border);
  color: var(--muted);
  text-align: center;
  padding: 26px;
  font-size: 12px;
}

@media (max-width: 650px) {
  .launcher-card, .hero-content {
    min-height: 470px;
  }

  .hero-content {
    padding: 32px 59px;
  }

  .hero-content p {
    font-size: 13px;
  }

  .arrow {
    height: 47px;
    width: 35px;
    font-size: 25px;
  }

  .arrow.left { left: 4px; }
  .arrow.right { right: 4px; }

  .castle {
    right: -35px;
    opacity: .3;
  }

  .crystal {
    right: 15%;
  }

  nav button {
    font-size: 11px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

    },

    {
      id: "main",
      theme: "theme-main",
      name: "TheDarkWithin",
      era: "ERA II — CENTURIES LATER",
      status: "MAIN STORY — RELEASED",
      description:
        "The villagers have disappeared. " +
        "Explore dark forests, snowy mountains, " +
        "and dangerous lands to confront " +
        "the Purple King.",
      overview:
        "The original eight-chapter adventure. " +
        "Rescue the villagers, master special " +
        "abilities, and discover the darkness.",
      url: "game.html",
      button: "▶ PLAY MAIN STORY",
      playable: true
    },

    {
      id: "spirit",
      theme: "theme-spirit",
      name: "The Spirit Realm",
      era: "ERA III — AFTER THE MAIN STORY",
      status: "DLC II — PLAYABLE TEST BUILD",
      description:
        "A broken portal leads to a shattered " +
        "dimension. Leap across floating islands, " +
        "dash through dangerous gaps, and face " +
        "the armored Spirit Titan.",
      overview:
        "Discover a whole new platforming " +
        "adventure with spirit powers, moving " +
        "platforms, checkpoints, and boss battles.",
      url: "spirit-realm.html",
      button: "💜 PLAY THE SPIRIT REALM",
      playable: true
    },

    {
      id: "light",
      theme: "theme-light",
      name: "The Last Light",
      era: "ERA IV — THE FINAL ADVENTURE",
      status: "DLC III — PLANNED",
      description:
        "The final chapter of TheDarkWithin " +
        "saga is coming. A new adventure " +
        "will decide the fate of the darkness.",
      overview:
        "The Last Light is still planned. " +
        "Its full story and gameplay " +
        "will be revealed later.",
      url: null,
      button: "COMING SOON",
      playable: false
    }
  ];

  let index = 0;

  // =====================================
  // REMEMBER SELECTED GAME
  // =====================================

  try {
    const saved = localStorage.getItem(SAVE);

    const found = games.findIndex(
      game => game.id === saved
    );

    if (found !== -1) {
      index = found;
    }
  } catch (error) {
    // Storage is optional.
  }

  // =====================================
  // CHANGE THE SELECTED GAME
  // =====================================

  function showGame(newIndex) {
    index = Math.max(
      0,
      Math.min(games.length - 1, newIndex)
    );

    const game = games[index];

    // Entire website changes theme.

    document.body.className = game.theme;

    // Update launcher information.

    $("gameEra").textContent = game.era;
    $("gameStatus").textContent = game.status;
    $("gameTitle").textContent = game.name;
    $("gameDescription").textContent =
      game.description;

    // Update overview.

    $("overviewHeading").textContent = game.name;
    $("overviewDescription").textContent =
      game.overview;

    // Update main Play button.

    const playButton = $("playButton");

    playButton.textContent = game.button;
    playButton.classList.toggle(
      "locked",
      !game.playable
    );

    if (game.playable) {
      playButton.href = game.url;
      playButton.removeAttribute("aria-disabled");
      playButton.removeAttribute("tabindex");
    } else {
      playButton.removeAttribute("href");
      playButton.setAttribute(
        "aria-disabled",
        "true"
      );
      playButton.setAttribute(
        "tabindex",
        "-1"
      );
    }

    // Enable/disable arrows at the ends.

    $("previous").disabled = index === 0;
    $("next").disabled =
      index === games.length - 1;

    // Progress display.

    $("positionLabel").textContent =
      "ADVENTURE " + (index + 1) +
      " OF " + games.length;

    document.querySelectorAll(
      ".progress-dot"
    ).forEach((dot, i) => {
      dot.classList.toggle(
        "active",
        i === index
      );
    });

    // Save the current selection.

    try {
      localStorage.setItem(SAVE, game.id);
    } catch (error) {}
  }

  // =====================================
  // LEFT AND RIGHT BUTTONS
  // =====================================

  $("previous").onclick = () => {
    showGame(index - 1);
  };

  $("next").onclick = () => {
    showGame(index + 1);
  };

  // =====================================
  // PROGRESS DOTS
  // =====================================

  games.forEach((game, i) => {
    const dot = document.createElement("button");

    dot.type = "button";
    dot.className = "progress-dot";
    dot.title = game.name;

    dot.setAttribute(
      "aria-label",
      "Show " + game.name
    );

    dot.onclick = () => showGame(i);

    $("progress").appendChild(dot);
  });

  // =====================================
  // OPTIONAL KEYBOARD NAVIGATION
  // =====================================

  document.addEventListener("keydown", e => {
    const tag = document.activeElement.tagName;

    if (
      ["INPUT", "SELECT", "TEXTAREA"].includes(tag)
    ) {
      return;
    }

    if (e.key === "ArrowRight") {
      showGame(index + 1);
    }

    if (e.key === "ArrowLeft") {
      showGame(index - 1);
    }
  });

  // =====================================
  // FOUR WEBSITE TABS
  // =====================================

  const tabNames = [
    "overview",
    "reviews",
    "dlc",
    "timeline"
  ];

  const tabButtons =
    document.querySelectorAll(
      "nav button[data-tab]"
    );

  const tabs =
    document.querySelectorAll(".tab");

  function openTab(name) {
    if (!tabNames.includes(name)) {
      return;
    }

    tabButtons.forEach(button => {
      button.classList.toggle(
        "active",
        button.dataset.tab === name
      );
    });

    tabs.forEach(tab => {
      tab.classList.toggle(
        "active",
        tab.id === name
      );
    });
  }

  tabButtons.forEach(button => {
    button.onclick = () => {
      const name = button.dataset.tab;

      openTab(name);

      history.replaceState(
        null,
        "",
        "#" + name
      );
    };
  });

  // Handle direct links to tabs.

  function checkHash() {
    const hash = location.hash.slice(1);

    if (tabNames.includes(hash)) {
      openTab(hash);
    } else if (hash === "versions") {
      // Old Versions links open Overview.
      openTab("overview");
    }
  }

  window.addEventListener(
    "hashchange",
    checkHash
  );

  // =====================================
  // START LAUNCHER
  // =====================================

  showGame(index);
  checkHash();

})();
</script>

</body>
</html>

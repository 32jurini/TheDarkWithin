
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>TheDarkWithin — Main Story</title>

  <style>

    /* =====================================
       THEDARKWITHIN — NEW GAME PAGE
       ===================================== */

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #070a09;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;

      background:
        radial-gradient(
          ellipse at top,
          #153327 0%,
          #080c0a 50%,
          #050607 100%
        );

      color: #f0fff4;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    /* =====================================
       TOP HEADER
       ===================================== */

    .game-header {
      width: 100%;
      padding: 20px 30px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;

      background: rgba(5, 10, 8, 0.96);
      border-bottom: 2px solid #286b43;
    }

    .game-logo {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #ffffff;
    }

    .game-logo span {
      color: #70ef9d;
    }

    .back-button {
      display: inline-block;

      padding: 12px 20px;

      color: #c9ffd6;
      background: #173c29;

      border: 1px solid #5dbe7e;
      border-radius: 7px;

      font-size: 14px;
      font-weight: bold;
      text-decoration: none;

      transition: 0.2s;
    }

    .back-button:hover {
      color: #ffffff;
      background: #286e48;
      transform: translateY(-2px);
    }

    /* =====================================
       GAME HEADING
       ===================================== */

    .game-intro {
      padding: 36px 20px 15px;
      text-align: center;
    }

    .game-intro h1 {
      margin: 0 0 12px;

      color: #afffc6;

      font-size: clamp(
        28px,
        5vw,
        46px
      );

      font-weight: 900;
      letter-spacing: 1px;

      text-shadow:
        0 0 35px rgba(69, 230, 125, 0.2);
    }

    .game-intro p {
      max-width: 680px;
      margin: 0 auto;

      color: #a6b9ae;

      font-size: 15px;
      line-height: 1.8;
    }

    /* =====================================
       GAME AREA
       ===================================== */

    .game-area {
      width: min(1040px, 100%);
      margin: 20px auto 45px;
      padding: 0 15px;
    }

    /* =====================================
       MODERN GAME ENGINE
       ===================================== */

    #dwGameFrame {
      max-width: 100%;
      margin: 12px auto;
    }

    #darkWithinCanvas {
      display: block;

      width: 100%;
      height: auto;

      image-rendering: pixelated;

      border-radius: 8px;
      border: 2px solid #3b7750;

      box-shadow:
        0 0 45px rgba(30, 120, 55, 0.12);
    }

    #darkWithinUI {
      width: 100%;
      max-width: 960px;

      margin: 16px auto;
      padding: 18px;

      border-radius: 10px;
      border: 1px solid #426a50;

      background: #101814;

      color: #f0fff4;
    }

    #darkWithinUI button {
      border-radius: 6px;
      transition: 0.15s;
    }

    #darkWithinUI button:hover:not(:disabled) {
      filter: brightness(1.3);
    }

    #darkWithinUI button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #darkWithinUI select {
      background: #19251e;
      color: #e9fff0;
      border: 1px solid #54735e;
      padding: 9px;
      border-radius: 6px;
    }

    /* =====================================
       OLD GAME INTERFACE CLEANUP
       ===================================== */

    /*
      These selectors only target possible
      legacy interface elements.

      The new game is created by game.js,
      using darkWithinCanvas and dwGameFrame.
    */

    #gameCanvas,
    #gameScreen,
    #gameWorld,
    #oldGame,
    #oldGameContainer,
    #gameContainerOld,
    #gameHUD,
    #gameHud,
    #gameControls,
    #messageBox {
      display: none !important;
    }

    /* =====================================
       FOOTER
       ===================================== */

    .game-footer {
      padding: 28px 15px;

      background: #080c0a;
      border-top: 1px solid #234e33;

      color: #849b89;

      text-align: center;
      font-size: 12px;
      letter-spacing: 2px;
    }

    .footer-highlight {
      color: #70ef9d;
    }

    /* =====================================
       MOBILE ADJUSTMENTS
       ===================================== */

    @media (max-width: 650px) {

      .game-header {
        justify-content: center;
        text-align: center;
      }

      .game-logo {
        font-size: 21px;
      }

      .game-intro {
        padding-top: 25px;
      }

      .game-area {
        padding: 0 6px;
      }

      #darkWithinUI {
        padding: 12px;
      }

      .game-footer {
        font-size: 10px;
      }

    }

  </style>
</head>

<body>

  <!-- =====================================
       WEBSITE HEADER
       ===================================== -->

  <header class="game-header">

    <div class="game-logo">
      THE<span>DARK</span>WITHIN
    </div>

    <a
      href="index.html"
      class="back-button"
    >
      ← EXIT TO MENU
    </a>

  </header>

  <!-- =====================================
       MAIN STORY TITLE
       ===================================== -->

  <section class="game-intro">

    <h1>
      TheDarkWithin
    </h1>

    <p>
      The villagers have disappeared.
      Journey through forests,
      frozen mountains and dark kingdoms.

      Discover the Black Spirit,
      master powerful abilities,
      and defeat the Purple King.
    </p>

  </section>

  <!-- =====================================
       MAIN GAME AREA
       ===================================== -->

  <main
    class="game-area"
    id="gameArea"
  >

    <!--
      IMPORTANT:

      There is NO old green game
      screen in this file.

      There is NO old punch system.

      There is NO extra game canvas.

      The new game.js automatically
      creates and displays the real game,
      including:

      - Eight chapters
      - Difficulty selection
      - Sword combat
      - Water Wheel
      - Black Flash
      - Divergent Fist
      - Flame Arrow
      - Fullscreen
      - Music controls
      - Original 8-bit soundtrack

      Don't add the old game HTML
      back into this section.
    -->

  </main>

  <!-- =====================================
       FOOTER
       ===================================== -->

  <footer class="game-footer">

    <span class="footer-highlight">
      THEDARKWITHIN
    </span>

    — THE MAIN STORY

  </footer>

  <!-- =====================================
       LOAD THE ACTUAL GAME

       IMPORTANT:
       ONLY LOAD GAME.JS ONCE!
       ===================================== -->

  <script src="game.js"></script>

</body>
</html>

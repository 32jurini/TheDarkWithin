
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>TheDarkWithin — Play Game</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #080a0d;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 50% 0%,
          #173429 0%,
          #080a0d 55%
        );
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    /* TOP BAR */

    .game-header {
      width: 100%;
      min-height: 75px;
      padding: 15px 25px;

      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;

      background: rgba(5, 10, 8, 0.95);
      border-bottom: 2px solid #285f3c;
    }

    .game-logo {
      color: #ffffff;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .game-logo span {
      color: #76f2a1;
    }

    .home-button {
      padding: 11px 18px;

      background: #173e28;
      color: #b3ffca;

      text-decoration: none;
      font-weight: bold;
      font-size: 14px;

      border: 1px solid #68d68d;
      border-radius: 6px;

      transition: 0.2s;
    }

    .home-button:hover {
      background: #276b42;
      color: white;
    }

    /* INTRODUCTION */

    .game-intro {
      text-align: center;
      padding: 28px 15px 8px;
    }

    .game-intro h1 {
      font-size: clamp(26px, 5vw, 42px);
      margin: 0 0 10px;
      color: #c0ffd2;
    }

    .game-intro p {
      color: #a9bcb0;
      font-size: 14px;
      line-height: 1.7;
      max-width: 650px;
      margin: auto;
    }

    /* GAME CONTAINER */

    #gameContainer {
      width: min(1000px, 100%);
      margin: 20px auto 35px;
      padding: 0 12px;
    }

    /* Existing game.js creates
       the actual canvas and controls. */

    #dwGameFrame {
      max-width: 100%;
    }

    #darkWithinCanvas {
      display: block;
      width: 100%;
      height: auto;
      image-rendering: pixelated;
    }

    #darkWithinUI {
      max-width: 100%;
      border-radius: 10px;
    }

    /* BOTTOM FOOTER */

    .game-footer {
      text-align: center;
      padding: 25px 15px;
      margin-top: 25px;

      border-top: 1px solid #234632;

      color: #738879;
      font-size: 12px;
      letter-spacing: 1px;
    }

    @media (max-width: 600px) {
      .game-header {
        justify-content: center;
        text-align: center;
      }

      .game-logo {
        font-size: 20px;
      }

      #gameContainer {
        padding: 0 6px;
      }
    }
  </style>
</head>

<body>

  <!-- MAIN HEADER -->

  <header class="game-header">

    <div class="game-logo">
      THE<span>DARK</span>WITHIN
    </div>

    <a
      href="index.html"
      class="home-button"
    >
      ← Back to Main Menu
    </a>

  </header>

  <!-- GAME TITLE -->

  <section class="game-intro">

    <h1>
      Enter TheDarkWithin
    </h1>

    <p>
      Eight chapters. One dark adventure.
      Rescue the missing villagers,
      master powerful abilities,
      and face the Purple King.
    </p>

  </section>

  <!-- GAME INSERTION AREA -->

  <main id="gameContainer">

    <!--
      Your game.js creates its own game
      canvas, difficulty selector,
      attacks, music controls,
      fullscreen button and HUD.

      Do not add another canvas here.
    -->

  </main>

  <!-- FOOTER -->

  <footer class="game-footer">
    THEDARKWITHIN
    — A DARK FANTASY ADVENTURE
  </footer>

  <!-- LOAD THE MAIN GAME -->

  <script src="game.js"></script>

</body>
</html>
